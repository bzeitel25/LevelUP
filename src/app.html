<title>Level UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: game HUD. Left = character sheet (sticky on desktop), right = skill tracks + session log. Stacks on phones. */
:root {
  --bg: #e9edf5;
  --panel: #ffffff;
  --panel-2: #dfe5f0;
  --ink: #151a2c;
  --muted: #586180;
  --line: #c9d1e1;
  --xp: #9a6604;
  --xp-fill: #e2a521;
  --xp-hi: #f5cc62;
  --rest: #2a66d9;
  --good: #1b7f53;
  --danger: #bf3b28;
  --shadow: 0 1px 0 rgba(21,26,44,.06), 0 6px 18px -10px rgba(21,26,44,.25);
  --on-fill: #1b1404;
  --pattern: none;
  --f-display: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f111b; --panel: #171a28; --panel-2: #212539; --ink: #e8ebf6; --muted: #8f97b8; --line: #2b3050;
    --xp: #f2c14e; --xp-fill: #e3a72c; --xp-hi: #ffd977; --rest: #73a6ff; --good: #4fc58d; --danger: #f17a66;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f111b; --panel: #171a28; --panel-2: #212539; --ink: #e8ebf6; --muted: #8f97b8; --line: #2b3050;
  --xp: #f2c14e; --xp-fill: #e3a72c; --xp-hi: #ffd977; --rest: #73a6ff; --good: #4fc58d; --danger: #f17a66;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background-color: var(--bg); background-image: var(--pattern); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding: 0 16px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 18px 48px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rest); outline-offset: 2px; }
.px { font-family: var(--f-display); letter-spacing: .01em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 28px; font-weight: 700; }
.brand h1 b { color: var(--xp); font-weight: 700; }
.brand span { color: var(--muted); font-size: 13px; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); white-space: nowrap; }
.pill.warn { color: var(--danger); border-color: var(--danger); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border: 1px dashed var(--rest); color: var(--ink); border-radius: 8px; margin-bottom: 16px; font-size: 14px; background: var(--panel); }

/* buttons */
.btn { border: 2px solid var(--ink); background: var(--panel); padding: 8px 14px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--xp-fill); color: var(--on-fill); border-color: var(--xp-fill); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.btn.primary:hover { background: var(--xp-hi); }
.btn.ghost { border-color: var(--line); }
.btn.small { padding: 4px 10px; font-size: 13px; border-width: 1px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--rest); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* layout */
.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.sheet { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); padding: 18px; display: grid; gap: 16px; }
@media (max-width: 820px) { .sheet { position: static; } }

/* character sheet */
.who { display: flex; gap: 14px; align-items: center; }
.emblem { width: 76px; height: 76px; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-size: 40px; font-weight: 700; color: #1b1404; background: linear-gradient(160deg, var(--xp-hi), var(--xp-fill)); clip-path: polygon(0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)); }
.who-text { min-width: 0; }
.hero-name { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.class-title { font-family: var(--f-display); color: var(--xp); font-size: 18px; }
.paths { font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-weight: 700; }
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.meter-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 4px; }
.meter-label strong { font-weight: 600; }
.rest-bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.rest-bar i { display: block; height: 100%; background: var(--rest); border-radius: 4px; }
.pips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; padding-left: 2px; }
.pips i { width: 9px; height: 9px; border: 1.5px solid var(--xp); transform: rotate(45deg); border-radius: 1px; }
.pips i.on { background: var(--xp-fill); border-color: var(--xp-fill); }
.keys-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.keys-count { font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--xp); }

/* training scene */
.train { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 18px; margin-bottom: 20px; border: 2px solid var(--xp-fill); align-items: center; }
@media (max-width: 640px) { .train { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; height: 200px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: var(--panel-2); }
.stage .sparks { display: none; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.train-px { width: 160px; height: 192px; margin: auto; border-radius: 8px; }
.portrait { width: 80px; height: 80px; border-radius: 3px; flex: none; }
.wdg .portrait { width: 52px; height: 52px; box-shadow: 0 0 0 2px var(--xp-fill); }
.wdg.md .portrait { width: 64px; height: 64px; }
.item-ic { width: 40px; height: 40px; margin-bottom: 2px; }
.hero-card { padding: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 640px) { .hero-card { grid-template-columns: minmax(0, 1fr); } }
.hero-stage { display: grid; place-items: center; }
.hero-stage canvas { width: 200px; height: 240px; border-radius: 3px; box-shadow: 0 8px 22px -12px rgba(0,0,0,.5); }
.hero-side { display: grid; gap: 12px; min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--line); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--xp-fill); }
.bd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.bd { border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 4px 6px; display: grid; gap: 3px; justify-items: center; text-align: center; min-width: 0; }
.bd canvas { width: 60px; height: 72px; border-radius: 4px; }
.bd span { font-size: 12px; font-weight: 700; line-height: 1.2; }
.bd small { font-size: 10.5px; color: var(--muted); line-height: 1.2; }
.bd[aria-pressed="true"] { border-color: var(--xp-fill); box-shadow: 0 0 0 2px var(--xp-fill); }
.bd.locked { cursor: not-allowed; }
.bd.locked canvas { filter: grayscale(1) brightness(.55); }
.slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.chibi .ol { stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.chibi .hero { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 1.2s ease-in-out infinite; }
.chibi.run .hero { animation-duration: .42s; }
.chibi.float .hero { animation: float 3s ease-in-out infinite; }
.chibi .legA, .chibi .legB { transform-box: fill-box; transform-origin: 50% 0; }
.chibi.run .legA { animation: legs .42s ease-in-out infinite; }
.chibi.run .legB { animation: legs .42s ease-in-out infinite reverse; }
.chibi .eye { transform-box: fill-box; transform-origin: center; animation: eyeblink 4s infinite; }
.chibi .strum { animation: strum .5s ease-in-out infinite; }
.chibi .swing { transform-box: fill-box; transform-origin: 15% 90%; animation: swing .7s ease-in-out infinite; }
.chibi .sweep { transform-box: fill-box; transform-origin: 30% 5%; animation: sweep .9s ease-in-out infinite; }
.chibi .flip { transform-box: fill-box; transform-origin: 0 50%; animation: flip 2.6s ease-in-out infinite; }
.chibi .glow { animation: glow .8s steps(2) infinite; }
.chibi .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
.chibi .tap { animation: strum .3s ease-in-out infinite; }
.chibi .tap2 { animation: strum .3s ease-in-out infinite reverse; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes legs { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
@keyframes eyeblink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes strum { 50% { transform: translateY(6px); } }
@keyframes swing { 0%, 100% { transform: rotate(-35deg); } 50% { transform: rotate(20deg); } }
@keyframes sweep { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
@keyframes flip { 0%, 60% { transform: scaleX(1); } 80%, 100% { transform: scaleX(-1); } }
@keyframes glow { 50% { opacity: .45; } }
@keyframes pulse { 0%, 100% { transform: scale(.9); opacity: .35; } 50% { transform: scale(1.08); opacity: .7; } }
.sparks { position: absolute; inset: 0; pointer-events: none; }
.sparks i { position: absolute; bottom: 8px; width: 6px; height: 6px; background: var(--xp-fill); opacity: 0; animation: rise 2.6s linear infinite; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-160px); opacity: 0; } }
.stage .ring { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border: 4px solid var(--xp-hi); border-radius: 50%; opacity: 0; pointer-events: none; }
.stage .lvpop { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--xp); opacity: 0; }
.stage.burst .ring { animation: ring 1.1s ease-out; }
.stage.burst .lvpop { animation: pop 1.8s ease-out; }
@keyframes ring { 0% { opacity: 1; transform: scale(.5); } 100% { opacity: 0; transform: scale(6); } }
@keyframes pop { 0% { opacity: 0; transform: translateY(10px); } 20%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
.train-info { display: grid; gap: 12px; min-width: 0; }
.train-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.train-head h2 { font-family: var(--f-display); font-size: 20px; }
.train-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.live-xp { font-family: var(--f-display); font-size: 22px; color: var(--xp); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .chibi *, .sparks i, .stage.burst .ring, .stage.burst .lvpop { animation: none !important; } .stage.burst .lvpop { opacity: 1; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.tag.lesson { color: var(--good); border: 1px solid var(--good); }
.tag.rest { color: var(--rest); border: 1px solid var(--rest); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

/* timer card */
.timer { border: 2px solid var(--xp-fill); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: color-mix(in srgb, var(--xp-fill) 10%, var(--panel)); }
.timer-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.timer-clock { font-family: var(--f-display); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* skills */
.col { display: grid; gap: 20px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.section-head h2 { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.skills { display: grid; gap: 10px; }
.skill { padding: 14px 16px; }
.skill-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.skill-main { min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 6px; }
.skill-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.skill-title h3 { font-size: 17px; font-weight: 700; }
.lv { font-family: var(--f-display); font-size: 17px; color: var(--xp); font-weight: 700; }
.tier { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.badge.vet { border-color: var(--rest); color: var(--rest); }
.badge.star { border-color: var(--xp); color: var(--xp); }
.xp { position: relative; height: 16px; background: var(--panel-2); border: 2px solid var(--ink); border-radius: 3px; overflow: hidden; }
.xp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, var(--xp-hi), var(--xp-fill) 60%, var(--xp)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.xp::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), color-mix(in srgb, var(--ink) 35%, transparent) calc(10% - 2px) 10%); pointer-events: none; }
.xp-text { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.play { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--ink); background: var(--panel); display: grid; place-items: center; }
.play:hover:not(:disabled) { background: var(--xp-fill); border-color: var(--xp-fill); color: #1b1404; }
.play svg { width: 20px; height: 20px; }
.play.on { background: var(--danger); border-color: var(--danger); color: #fff; }
.play:disabled { opacity: .35; cursor: not-allowed; }

.detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.quick span { font-size: 13px; color: var(--muted); margin-right: 4px; }
.facts { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
.facts b { font-weight: 700; }
.tip { border-left: 3px solid var(--xp-fill); padding: 6px 0 6px 12px; }
.tip.old { border-left-color: var(--line); }
.tip small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.tip p { margin: 2px 0 0; max-width: 62ch; }
.lock { font-size: 13px; color: var(--muted); }
.ms { display: flex; gap: 6px; flex-wrap: wrap; }
.ms span { font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px dashed var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.ms span.got { border: 1px solid var(--xp); color: var(--xp); font-weight: 700; }
.detail-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }

/* sessions */
.log { padding: 6px 16px; }
.log-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log-row:last-child { border-bottom: 0; }
.log-row .when { color: var(--muted); font-size: 13px; }
.log-row .what { min-width: 0; overflow-wrap: anywhere; }
.log-row .what em { color: var(--muted); font-style: normal; font-size: 13px; }
.log-row .gold { color: var(--xp); font-size: 13px; font-weight: 600; white-space: nowrap; }
.x { border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 4px; font-size: 13px; }
.x:hover { color: var(--danger); background: var(--panel-2); }
@media (max-width: 520px) { .log-row { grid-template-columns: minmax(0, 1fr) auto auto; } .log-row .when { grid-column: 1 / -1; padding-bottom: 0; margin-bottom: -6px; } }
.empty-log { padding: 16px 0; color: var(--muted); font-size: 14px; }

.rules { padding: 16px 18px; font-size: 14px; }
.rules h2 { font-family: var(--f-display); font-size: 18px; margin-bottom: 8px; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.rules table { border-collapse: collapse; margin: 6px 0 12px; font-size: 13px; }
.rules td, .rules th { padding: 3px 14px 3px 0; text-align: left; font-variant-numeric: tabular-nums; }
.rules th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }

/* onboarding */
.onboard { max-width: 680px; margin: 0 auto; padding: 24px; display: grid; gap: 22px; }
.onboard h2 { font-family: var(--f-display); font-size: 30px; }
.onboard p { margin: 0; max-width: 60ch; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.input { border: 2px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); width: 100%; min-width: 0; }
.input:focus { border-color: var(--rest); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.picked { display: grid; gap: 8px; }
.picked-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; align-items: center; }
.picked-row span { font-weight: 600; overflow-wrap: anywhere; }
.custom-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px auto; gap: 8px; }
@media (max-width: 520px) { .custom-row { grid-template-columns: minmax(0, 1fr); } .picked-row { grid-template-columns: minmax(0, 1fr) 120px; } }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* dialog */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cat { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.cat b { font-size: 14px; }
.cat small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat:hover { border-color: var(--muted); }
.cat[aria-pressed="true"] { border-color: var(--xp-fill); background: color-mix(in srgb, var(--xp-fill) 12%, var(--panel)); }
.cat .count { color: var(--xp); font-weight: 700; font-size: 12px; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.custom-row.two { grid-template-columns: minmax(0, 1fr) auto; }
.group { display: grid; gap: 10px; }
.group-head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 6px; }
.group:first-child .group-head { margin-top: 0; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); }

.dlg { padding: 20px; display: grid; gap: 16px; }

.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; }
.err { color: var(--danger); font-size: 13px; min-height: 1em; }

/* home-screen widget preview */
.wall { border-radius: 14px; padding: 18px; display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--rest) 55%, var(--panel-2)), color-mix(in srgb, var(--xp-fill) 35%, var(--panel-2))); }
.wdg { background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px); border-radius: 22px; padding: 14px; box-shadow: 0 8px 22px -12px rgba(0,0,0,.45); display: grid; gap: 10px; color: var(--ink); }
.wdg.sm { width: 158px; height: 158px; grid-template-rows: auto 1fr auto; }
.wdg.md { width: min(338px, 100%); min-height: 158px; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 14px; }
.wdg .emblem { width: 46px; height: 46px; font-size: 24px; }
.wdg.md .emblem { width: 64px; height: 64px; font-size: 32px; }
.wdg-lv { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1; }
.wdg-lv small { font-size: 12px; color: var(--muted); font-family: var(--f-body); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 2px; }
.wdg-class { font-family: var(--f-display); color: var(--xp); font-size: 15px; }
.wdg-skill { font-size: 12.5px; display: flex; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.wdg-skill b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wdg .xp { height: 10px; border-width: 1.5px; }
.wdg-go { border: 0; border-radius: 999px; padding: 8px 10px; font-weight: 700; font-size: 13px; background: var(--xp-fill); color: var(--on-fill); display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
.wdg-go svg { width: 14px; height: 14px; }
.wdg-go.on { background: var(--danger); color: #fff; }
.wdg-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.wdg-right { min-width: 0; display: grid; gap: 8px; }
.wdg-span { grid-column: 1 / -1; }

.start-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .start-opts { grid-template-columns: 1fr; } }
.start-opt { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px; display: grid; gap: 4px; }
.start-opt:hover { border-color: var(--xp-fill); background: color-mix(in srgb, var(--xp-fill) 10%, var(--panel)); }
.start-opt b { font-size: 16px; }
.start-opt span { font-size: 13px; color: var(--muted); }
.type-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.type-badge.lesson { color: var(--good); border-color: var(--good); }
.wdg-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* veteran emblem: tier colors are fixed metals and read on both themes */
.vet { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 1px 8px 1px 6px; border-radius: 999px; border: 1.5px solid currentColor; letter-spacing: .02em; }
.vet::before { content: ""; width: 8px; height: 8px; background: currentColor; transform: rotate(45deg); border-radius: 1px; }
.vet.t0 { color: #b06a2c; } .vet.t1 { color: #8a94a6; } .vet.t2 { color: var(--xp); } .vet.t3 { color: #2f9e96; } .vet.t4 { color: var(--rest); }
.vet-edit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.vet-edit input { width: 110px; }

.tip-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tip-refresh { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 2px 9px 2px 7px; font-size: 12px; font-weight: 600; flex: none; }
.tip-refresh:hover { color: var(--ink); border-color: var(--muted); }
.tip-lib { font-size: 13.5px; }
.tip-lib summary { cursor: pointer; font-weight: 600; color: var(--rest); }
.lib-tier { margin-top: 10px; }
.lib-tier ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 4px; max-width: 62ch; }
.lib-tier.locked { opacity: .7; }
.tip-vote { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 2px; }
.tip-vote .x { font-size: 12px; padding: 2px 6px; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.set-card { padding: 16px; display: grid; gap: 10px; }
.set-card h3 { font-size: 16px; }
.note { border-radius: 8px; padding: 10px 12px; font-size: 13.5px; border: 1px solid var(--line); background: var(--panel-2); }
.note.good { border-color: var(--good); } .note.warn { border-color: var(--xp); } .note.bad { border-color: var(--danger); }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spinr .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes spinr { to { transform: rotate(360deg); } }
.backup-box { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; word-break: break-all; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); overflow-x: auto; }
.tab-ic { width: 18px; height: 18px; vertical-align: -4px; margin-right: 5px; }
.tab > span:not(.cnt) { vertical-align: 0; }
.install .install-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 520px) { .install .install-row { grid-template-columns: minmax(0, 1fr); justify-items: center; } }
.qr-box { width: 156px; height: 156px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 10px; background: #fff; text-align: center; padding: 6px; }
.qr-box canvas { width: 140px; height: 140px; }
.link-row { display: flex; gap: 6px; }
.link-row .input { font-size: 13px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; max-width: 62ch; }
.btn.big { padding: 12px 16px; font-size: 16px; }
a.btn { text-decoration: none; justify-content: center; color: var(--ink); }
/* phones: app-style bottom navigation */
@media (max-width: 820px) {
  .hide-phone { display: none; }
  .wrap { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--panel); border-top: 2px solid var(--line); border-bottom: 0; padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; gap: 0; box-shadow: 0 -6px 18px -12px rgba(0,0,0,.35); overflow: visible; }
  .tab { flex: 1; display: grid; justify-items: center; gap: 1px; padding: 6px 2px 4px; font-size: 11px; border-bottom: 0; border-top: 3px solid transparent; margin: 0; position: relative; min-width: 0; }
  .tab[aria-selected="true"] { border-top-color: var(--xp-fill); color: var(--ink); }
  .tab-ic { width: 22px; height: 22px; margin: 0; }
  .tab .cnt-u, .tab .cnt-gold { display: none; }
  .tab .cnt { position: absolute; top: 2px; right: 50%; transform: translateX(24px); font-size: 9.5px; background: var(--xp-fill); color: var(--on-fill); border-radius: 999px; padding: 0 5px; margin: 0; line-height: 15px; }
  .toasts { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
}
.tab { border: 0; background: none; padding: 8px 10px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--xp-fill); }
.tab .cnt { font-size: 12px; color: var(--xp); margin-left: 4px; font-variant-numeric: tabular-nums; }

/* stats */
.power { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.power b { font-family: var(--f-display); font-size: 24px; color: var(--xp); }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 13px; margin-top: 6px; }
.statgrid div { display: flex; justify-content: space-between; gap: 6px; }
.statgrid span { color: var(--muted); }
.statgrid b { font-variant-numeric: tabular-nums; }
.statgrid i { font-style: normal; color: var(--good); font-size: 12px; font-weight: 600; }
.statgrid i.tal { color: var(--xp); }

/* gear */
.gear-skill { padding: 14px 16px; display: grid; gap: 10px; }
.gear-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gear-head h3 { font-size: 16px; }
.gear-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.item { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 3px; align-content: start; background: var(--panel); min-width: 0; }
.item.locked { opacity: .55; border-style: dashed; }
.item.equipped { border-color: var(--xp-fill); background: color-mix(in srgb, var(--xp-fill) 12%, var(--panel)); }
.item b { font-size: 14px; overflow-wrap: anywhere; }
.item .eff { font-size: 12.5px; color: var(--good); font-weight: 600; }
.item .req { font-size: 12px; color: var(--muted); }
.item .btn { margin-top: 6px; }
.trophies { display: flex; flex-wrap: wrap; gap: 8px; }
.trophy { border: 1px solid var(--xp); color: var(--xp); border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
/* progress */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pg-pick select { width: auto; padding: 4px 8px; font-size: 13.5px; }
.pg { padding: 14px 16px; display: grid; gap: 14px; }
.pg-tiles .stat small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.pg-tiles .stat b { font-size: 21px; }
.pg-chart-wrap { position: relative; }
.pg-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.pg-chart { width: 100%; height: auto; display: block; overflow: visible; }
.pg-grid { stroke: var(--line); stroke-width: 1; opacity: .7; }
.pg-ax { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.pg-val { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--f-body); }
.pg-bar path { fill: color-mix(in srgb, var(--xp-fill) 55%, var(--panel)); transition: fill .15s; }
.pg-bar.cur path { fill: var(--xp-fill); }
.pg-bar.hot path, .pg-bar:hover path { fill: var(--xp); }
.pg-tip { position: absolute; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 5px 9px; border-radius: 6px; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); z-index: 2; }
.pg-table { display: grid; gap: 2px; font-size: 13.5px; }
.pg-row { display: grid; grid-template-columns: minmax(90px, 1.2fr) 2fr 64px; gap: 10px; align-items: center; padding: 3px 0; }
.pg-row span:last-child { text-align: right; }
.pg-headrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.pg-mini { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.pg-mini i { display: block; height: 100%; background: var(--xp-fill); border-radius: 4px; }
.frame-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.frame-grid .bd canvas { width: 56px; height: 56px; border-radius: 2px; }
.frame-grid .bd.locked canvas { filter: saturate(.55) brightness(.85); opacity: .8; }
/* inventory */
.icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; padding: 0; }
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn svg { width: 19px; height: 19px; }
.item.inv .seg.ver { margin-top: 4px; justify-self: start; }
.item.inv .seg.ver button { padding: 2px 9px; font-size: 12px; }
.relic-count { color: #1fa89b; }
/* adventure map */
.adv { padding: 12px; display: grid; gap: 10px; }
.adv-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.adv-top b { font-size: 17px; }
.advmap { width: 100%; height: auto; aspect-ratio: 13 / 9; border-radius: 8px; box-shadow: 0 0 0 2px var(--ink); touch-action: manipulation; cursor: pointer; background: #151a2c; }
.adv-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 58px; }
.adv-card.sign { background: color-mix(in srgb, #b07840 10%, var(--panel)); border-color: #b07840; }
.dun-list summary { cursor: pointer; padding: 12px 16px; list-style: none; }
.dun-list summary::-webkit-details-marker { display: none; }
.dun-list summary::before { content: "▸ "; color: var(--muted); }
.dun-list[open] summary::before { content: "▾ "; }
.dun-list-body { display: grid; gap: 8px; padding: 0 12px 12px; }
.dun-list .dun { box-shadow: none; }
/* quests, elixirs, achievements */
.quests { padding: 12px 16px; display: grid; gap: 6px; }
.q-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; align-items: baseline; }
.q { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 0; }
.q-check { width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: var(--on-fill); }
.q.done .q-check { background: var(--good); border-color: var(--good); color: #fff; }
.q-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.q.done .q-top span:first-child { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.q-bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-top: 4px; }
.q-bar i { display: block; height: 100%; background: var(--xp-fill); border-radius: 3px; }
.q.done .q-bar i { background: var(--good); }
.q-rew { font-size: 12.5px; font-weight: 700; color: var(--xp); }
.q.done .q-rew { color: var(--good); }
.q-elixir { display: flex; gap: 10px; align-items: center; font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.tag.elix { color: #7a4ac8; border: 1px solid #9a72e0; }
.item.elix svg { margin-bottom: 2px; }
.elix-drop { border-color: #c89cf2; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.ach { display: grid; grid-template-columns: 26px 1fr; gap: 8px; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; align-items: start; }
.ach-ic { font-size: 20px; line-height: 1; color: var(--line); }
.ach b { font-size: 13.5px; display: block; }
.ach small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.ach .ach-rew { margin-top: 3px; font-weight: 600; }
.ach.ok { border-color: var(--xp-fill); background: color-mix(in srgb, var(--xp-fill) 10%, var(--panel)); }
.ach.ok .ach-ic { color: var(--xp-fill); }
.ach.ok .ach-rew { color: var(--xp); }
/* active combat */
.bt-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bt-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; font-size: 12.5px; }
.bt-bar span { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bt-bar b { font-size: 12px; color: var(--muted); }
.bt-track { grid-column: 1 / -1; height: 10px; border: 2px solid var(--ink); border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bt-track i { display: block; height: 100%; width: 100%; background: linear-gradient(180deg, #7be3a8, #3fae74); transition: width .15s linear; }
.bt-bar.mon .bt-track i { background: linear-gradient(180deg, #ff9c8a, #d94a3a); }
.bt-log { font-size: 13.5px; font-weight: 600; min-height: 1.4em; }
.bt-skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.bt-skill { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 10px; min-height: 64px; touch-action: manipulation; }
.bt-skill .bt-ic { grid-row: 1 / 3; width: 30px; height: 30px; color: var(--ink); }
.bt-skill .bt-ic svg, .sb .bt-ic svg { width: 100%; height: 100%; display: block; }
.bt-skill b { font-size: 14px; line-height: 1.15; }
.bt-skill small { font-size: 11px; color: var(--muted); line-height: 1.25; }
.bt-skill .bt-cd { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--cd, 0) * 100%); background: color-mix(in srgb, var(--ink) 22%, transparent); pointer-events: none; }
.bt-skill .bt-sec { position: absolute; right: 8px; top: 6px; font-family: var(--f-display); font-size: 15px; font-weight: 700; color: var(--ink); }
.bt-skill kbd { position: absolute; right: 7px; bottom: 5px; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-family: inherit; }
.bt-skill.ready { border-color: var(--xp-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--xp-fill) 25%, transparent); cursor: pointer; }
.bt-skill.ready:active { transform: translateY(1px) scale(.97); }
.bt-skill:disabled { cursor: default; opacity: 1; }
.bt-skill:not(.ready) b, .bt-skill:not(.ready) .bt-ic { opacity: .55; }
.skillbook .sb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.sb { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.sb .bt-ic { width: 28px; height: 28px; color: var(--ink); }
.sb b { font-size: 14px; display: block; }
.sb small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.sb .sb-req { margin-top: 2px; font-weight: 600; }
.sb.on { border-color: var(--xp-fill); background: color-mix(in srgb, var(--xp-fill) 10%, var(--panel)); }
.sb.on .sb-req { color: var(--xp); }
.sb.locked { opacity: .6; border-style: dashed; }
@media (max-width: 520px) { .bt-skills { grid-template-columns: 1fr 1fr; } .bt-skill small { display: none; } .bt-skill { min-height: 54px; } }
/* relics */
.relic-name { background: linear-gradient(90deg, #1fa89b, #b14fd0, #1fa89b); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: relicShine 4s linear infinite; }
.item.relic { border-color: #5fe3d6; background: linear-gradient(160deg, color-mix(in srgb, #5fe3d6 14%, var(--panel)), color-mix(in srgb, #e08cf2 12%, var(--panel))); }
.relic-drop { display: flex; gap: 12px; align-items: center; border: 2px solid #5fe3d6; border-radius: 10px; padding: 10px 12px; background: linear-gradient(160deg, color-mix(in srgb, #5fe3d6 16%, var(--panel)), color-mix(in srgb, #e08cf2 14%, var(--panel))); animation: celin .4s cubic-bezier(.2,1.4,.4,1); }
.relic-drop .item-ic { width: 48px; height: 48px; flex: none; }
.relic-drop b { font-size: 16px; }
.relic-kicker { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
@keyframes relicShine { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .relic-name, .relic-drop { animation: none; } }
/* talents */
.cel-acts { display: grid; gap: 6px; justify-items: center; }
.tal-cats { display: flex; gap: 6px; flex-wrap: wrap; }
.tal-chip { position: relative; padding: 5px 12px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.tal-dot { background: var(--xp-fill); color: var(--on-fill); border-radius: 999px; font-size: 11px; font-weight: 800; line-height: 17px; min-width: 17px; padding: 0 5px; text-align: center; }
.tal-tree { padding: 14px 16px; display: grid; gap: 12px; }
.tal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.tal-pts { display: grid; justify-items: end; line-height: 1.1; text-align: right; }
.tal-pts b { font-family: var(--f-display); font-size: 30px; color: var(--xp); }
.tal-pts span { font-size: 12px; color: var(--muted); }
.tal-bar i { background: linear-gradient(90deg, var(--xp-fill), var(--xp-hi)); }

  const TIP_DATA = {"sets": {"art": [["Make something small every day. Volume builds skill.", "Keep a sketchbook or folder of everything you make.", "Don't wait for perfect materials. Start with what you have."], ["Pick one specific thing to improve each session.", "Study work you admire and ask what makes it effective.", "Use references. Even professionals rely on them."], ["Learn the basics of composition, like balance and focal point.", "Finish pieces even when they're not going well.", "Share your work with a supportive group for feedback."], ["Copy a master's work to study their decisions.", "Try a new medium or technique to stretch yourself.", "Set a small project with a deadline."], ["Work in a series. Several pieces on one theme reveal your voice.", "Ask for honest critique from experienced artists.", "Compare your recent work to pieces from months ago."], ["Develop your own style by combining influences.", "Show your work in public, online or in person.", "Teach a technique to deepen your understanding."], ["Take on an ambitious, long-term project.", "Mentor a beginner.", "Keep experimenting so your work keeps growing."]], "drawing": [["Draw basic shapes like boxes, spheres and cylinders. Most objects are built from them.", "Draw from life, not just photos, to train your eye."], ["Do 30-second gesture drawings to catch movement before detail.", "Draw lightly at first, then darken lines you're sure about."], ["Squint at your reference to see light and shadow as a few simple shapes.", "Practice one- and two-point perspective."], ["Copy a master's drawing. Copying teaches decisions you wouldn't think to make.", "Study basic anatomy if you draw people."], ["Draw from memory, then check the reference.", "Work on a full illustration with background and lighting."], ["Develop a consistent personal style.", "Fill a sketchbook on a single theme."], ["Work in a series. Ten pieces on one theme reveal your own voice.", "Teach a beginner to draw basic forms."]], "painting": [["Start with a limited palette of a few colors plus white.", "Clean your brushes thoroughly after every session."], ["Learn to mix colors rather than buying every tube.", "Block in big shapes first, then add detail."], ["Work out values, light versus dark, before worrying about color.", "Paint small studies before big canvases."], ["Learn about warm and cool colors and how they push and pull space.", "In oils, follow 'fat over lean': later layers should contain more oil than earlier ones to prevent cracking."], ["Paint the same subject in different lighting.", "Study how master painters handled edges, hard and soft."], ["Develop a series with a consistent theme.", "Experiment with texture, glazing and other techniques."], ["Exhibit your work in a show or online gallery.", "Teach a color-mixing workshop."]], "photography": [["Learn the exposure triangle: aperture, shutter speed and ISO.", "Hold the camera steady and squeeze the shutter gently."], ["Use the rule of thirds as a starting guide, not a strict law.", "Shoot during golden hour, just after sunrise or before sunset, for soft light."], ["Learn to read your camera's histogram to check exposure.", "Shoot in RAW if your camera allows it, for more editing flexibility."], ["Practice manual mode until it feels natural.", "Learn basic editing: exposure, white balance and cropping."], ["Shoot a themed project over several weeks.", "Study photographers you admire and analyze their composition."], ["Develop a consistent editing style.", "Learn to work with off-camera light."], ["Publish a portfolio or photo book.", "Teach someone the basics of exposure."]], "pottery": [["Wedge your clay to remove air bubbles before throwing.", "Keep your hands and the clay wet, but not soaking, on the wheel."], ["Centering is the foundation. Practice it until it feels steady.", "Start with simple cylinders before bowls and vases."], ["Keep wall thickness even so pieces dry and fire evenly.", "Let pieces dry slowly to prevent cracking."], ["Learn trimming to shape the foot of your pieces.", "Try handbuilding techniques like coil and slab."], ["Learn about glazes and test them on tiles first.", "Throw sets of matching pieces to build consistency."], ["Experiment with different clay bodies and firing temperatures.", "Develop your own forms and surfaces."], ["Exhibit or sell a collection of your work.", "Teach someone to center clay."]], "writing": [["Write a little every day, even 10 minutes.", "Read widely. Reading teaches you what good writing sounds like."], ["Finish a first draft before editing. Drafts are supposed to be rough.", "Cut words that don't add meaning."], ["Read your work aloud to catch awkward sentences.", "Use specific, concrete details instead of vague descriptions."], ["Get feedback from a writing group or trusted reader.", "Study the structure of stories or essays you admire."], ["Revise in passes: big structure first, then sentences.", "Try a form you don't usually write, like poetry or a personal essay."], ["Submit work to publications or contests.", "Develop a recognizable voice."], ["Finish a long project, like a novel or collection.", "Mentor a newer writer."]], "cooking": [["Read the whole recipe first and set out every ingredient before you turn on the heat.", "Wash your hands and keep raw meat separate from ready-to-eat food.", "Taste as you cook, not only at the end."], ["Season gradually: add a little salt, taste, and adjust.", "Let the pan heat up before adding food for better browning.", "Don't crowd the pan. Food steams instead of browning when it's packed in."], ["Master one heat skill at a time: a hard sear, a gentle simmer, a quick sauté.", "Use a meat thermometer instead of guessing doneness.", "Learn to make a simple pan sauce from the browned bits left after searing."], ["Cook a favorite dish without the recipe, then compare it to the original.", "Learn to balance a dish with a splash of acid, like lemon juice or vinegar.", "Plan and cook a full meal so everything finishes at the same time."], ["Learn the classic French mother sauces. Many sauces branch from them.", "Make your own stock and taste the difference.", "Try cooking from a cuisine you've never tried before."], ["Build dishes around balance: salt, fat, acid and heat.", "Develop your own versions of classic recipes.", "Cook for a group and manage timing like a restaurant line."], ["Invent a dish and write the recipe clearly enough for someone else to make.", "Teach someone to cook a dish you know well.", "Host a dinner with a menu you designed yourself."]], "baking": [["Weigh ingredients with a kitchen scale. It's far more accurate than cups.", "Preheat the oven fully before baking."], ["Use room-temperature butter and eggs when a recipe calls for creaming.", "Measure flour by weight, or spoon it into the cup and level it. Scooping packs in too much."], ["Get an oven thermometer. Many ovens run hotter or colder than the dial says.", "Avoid opening the oven door too early, especially for cakes."], ["Learn the difference between baking soda and baking powder. Soda needs an acid in the recipe to work.", "Bake a simple bread and learn to tell when dough is properly kneaded."], ["Try a sourdough starter or a long, cold fermentation for more flavor.", "Learn to adjust recipes for altitude or different pan sizes."], ["Practice laminated doughs like croissants.", "Study the role of each ingredient so you can troubleshoot recipes."], ["Develop your own signature recipe.", "Teach a friend to bake a loaf of bread."]], "knife-skills": [["Use the claw grip: curl your fingertips under so your knuckles guide the blade.", "Put a damp towel under your cutting board so it doesn't slide."], ["A sharp knife is safer than a dull one because it needs less force and slips less.", "Hold the knife with a pinch grip on the blade, just in front of the handle."], ["Learn to dice an onion efficiently, keeping the root end attached.", "Practice a rocking motion with a chef's knife for fast chopping."], ["Learn the difference between honing, which realigns the edge, and sharpening, which removes metal.", "Practice consistent cuts like brunoise and julienne."], ["Learn to break down a whole chicken.", "Practice filleting fish with a flexible knife."], ["Learn to sharpen on a whetstone at a consistent angle.", "Work on speed only after your cuts are consistently even."], ["Teach someone the claw grip and basic cuts.", "Build a small, well-maintained knife kit that suits your cooking."]], "grilling-bbq": [["Set up two heat zones, one hot and one cooler, so you can move food around.", "Clean and oil the grates before cooking."], ["Use a meat thermometer. Safe minimums: poultry 165°F (74°C), ground beef 160°F (71°C), and whole cuts of beef or pork 145°F (63°C) with a 3-minute rest.", "Keep the lid closed as much as possible to hold the temperature steady."], ["Let meat rest after grilling so juices settle.", "Learn indirect grilling for thicker cuts."], ["Try low-and-slow smoking for cuts like pork shoulder.", "Learn to manage charcoal or wood for steady temperatures."], ["Experiment with dry rubs, marinades and brines.", "Keep a log of cook times and temperatures to learn your grill."], ["Tackle a long cook like brisket.", "Learn to grill vegetables and fish as well as meat."], ["Host a cookout and manage multiple dishes at once.", "Develop your own signature rub or sauce."]], "pastry": [["Keep butter cold for flaky pastry dough.", "Measure precisely. Pastry is less forgiving than cooking."], ["Rest dough in the fridge before rolling so it's easier to handle and shrinks less.", "Use a light touch. Overworking dough makes it tough."], ["Blind-bake tart shells with weights to keep them flat.", "Learn to make a basic pastry cream."], ["Learn choux pastry for éclairs and cream puffs.", "Practice piping with a pastry bag."], ["Work on laminated doughs like puff pastry.", "Learn to temper chocolate for a glossy finish."], ["Design a plated dessert with different textures.", "Study classic French pâtisserie techniques."], ["Create a signature pastry of your own.", "Teach a friend to make a simple tart."]], "world-cuisines": [["Pick one cuisine to explore first and learn its key ingredients.", "Find a trusted cookbook or creator from that cuisine."], ["Stock the pantry staples for your chosen cuisine.", "Learn a simple everyday dish from it before festive ones."], ["Learn the core techniques of that cuisine, like stir-frying or slow braising.", "Visit local markets for authentic ingredients."], ["Learn about regional variations within the cuisine.", "Cook a full traditional meal with several dishes."], ["Explore a second cuisine and compare techniques.", "Learn the history and culture behind the dishes."], ["Cook with someone from the culture to learn hands-on.", "Adapt dishes to local ingredients while respecting tradition."], ["Host a dinner featuring a cuisine you've studied.", "Teach a dish to friends and share its story."]], "fitness": [["Start smaller than you think. Three short sessions a week beat one heroic one.", "Warm up for a few minutes before working hard.", "If you have a health condition or haven't exercised in a long time, check with a doctor before starting."], ["Learn proper form before adding intensity.", "Mild soreness is normal. Sharp or joint pain is a signal to stop.", "Schedule your sessions like appointments so they happen."], ["Track your sessions so you can see progress and spot plateaus.", "Mix in some variety so you train different muscles and avoid burnout.", "Sleep and food fuel your progress as much as the workouts do."], ["Follow a structured plan for 8 to 12 weeks before judging it.", "Increase one thing at a time: duration, intensity or frequency.", "Find a partner or class to keep you accountable."], ["Schedule easier recovery weeks. Your body adapts during rest.", "Train your weak points on purpose.", "Learn to tell the difference between being tired and being injured."], ["Set a mea
