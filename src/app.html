re planting."], ["Add compost to improve your soil.", "Mulch to keep moisture in and weeds down."], ["Get a soil test to learn what your soil needs.", "Learn to spot common pests early."], ["Plan your garden with crop rotation in mind.", "Start plants from seed."], ["Try companion planting and succession planting.", "Save seeds from your best plants."], ["Design a garden that produces through several seasons.", "Share plants and knowledge with neighbors."]], "home-repair": [["Learn where your water shutoff, gas shutoff and breaker panel are.", "Build a basic toolkit: hammer, screwdrivers, tape measure, level and pliers."], ["Use a stud finder before hanging heavy items.", "Patch small drywall holes with spackle and sand smooth."], ["Learn to caulk tubs and windows neatly.", "Fix squeaky doors and loose cabinet hinges."], ["Learn to replace a faucet aerator or showerhead.", "Keep a log of home maintenance tasks."], ["Learn to paint a room with clean edges.", "Know when a job needs a licensed pro, like electrical, gas or structural work."], ["Plan a seasonal maintenance checklist.", "Take on a larger project like installing shelves or tile."], ["Help a neighbor with a repair.", "Keep your home in good shape with regular maintenance."]], "time-management": [["Write down every task so your head is free to focus.", "Pick the one most important task each day."], ["Try working in focused blocks, like 25 minutes with a 5-minute break.", "Turn off notifications during focus time."], ["Block time on your calendar for important work.", "Group similar tasks together."], ["Do a weekly review of tasks and priorities.", "Learn to say no to things that don't fit your goals."], ["Track how you actually spend your time for a week.", "Plan your week around your energy levels."], ["Delegate tasks others can do.", "Set quarterly goals and break them into weekly steps."], ["Help someone set up a planning system.", "Keep your system simple and adjust it as life changes."]], "generic": [["Short daily sessions beat one long weekly one. Ten minutes counts.", "Start with the basics before advanced techniques.", "Focus on enjoying the process early on."], ["Pick one specific thing to improve in each session.", "Find a good beginner resource and work through it.", "Practice at the same time each day."], ["Find someone a little ahead of you and notice what they do differently.", "Track your progress so you can see it.", "Push slightly past your comfort zone."], ["Record or save your work so you can compare it later.", "Get feedback from someone experienced.", "Take on a project with a clear goal."], ["Spend part of each session on your weakest area. That's deliberate practice.", "Study the work of experts.", "Set a challenging long-term goal."], ["Take on a project bigger than you think you can finish.", "Refine your own style or approach.", "Share your progress with a community."], ["Teach what you know. It locks it in and shows you the gaps.", "Mentor someone starting out.", "Keep learning for the long haul."]], "instrument": [["Learn to hold the instrument comfortably and play one clean note before chasing songs.", "Practice in short daily sessions. Fifteen focused minutes beats an hour once a week.", "Learn the names of the notes your instrument plays so lessons and tabs make sense."], ["Practice with a metronome at a tempo where you make no mistakes, then speed up gradually.", "Learn the major scale in a couple of keys. A lot of melodies are built from it.", "Warm up before you play songs, even if it's just a minute of slow scales."], ["Learn one full song start to finish, including the bar you keep skipping.", "Isolate the hardest two bars and loop them slowly instead of replaying the whole piece.", "Learn basic chord building: a major chord is the 1st, 3rd and 5th notes of the major scale."], ["Play along with recordings to build timing and feel.", "Start learning to read music or charts if you haven't. It opens up far more material.", "Practice dynamics on purpose: play a phrase very quietly, then loudly, keeping it even."], ["Record yourself and listen back a day later with fresh ears.", "Learn a piece in a style you don't usually play. It exposes new techniques.", "Play with other musicians. Staying together teaches more about timing than solo practice."], ["Transcribe a passage by ear and compare it to the written version.", "Perform for an audience, even a small one. Nerves are a skill you can train.", "Work on tone as a goal in itself, not just correct notes."], ["Teach a beginner. Explaining technique exposes habits you've stopped noticing.", "Compose or arrange your own piece using what you've learned.", "Keep a few long-term goal pieces that stretch you for months."]], "guitar": [["Start with E minor and G major. They're easy shapes and appear in countless songs.", "Press strings just behind the fret, not on top of it, for a clean sound with less pressure."], ["Practice switching between two chords for one minute straight. Clean changes matter more than speed.", "Learn to tune by ear against a tuner app, then check how close you got."], ["Learn the A minor pentatonic scale in its first position at the 5th fret. It's the backbone of many rock and blues solos.", "Start practicing the F barre chord a little each day. It's hard for everyone at first."], ["Learn the CAGED system to see each chord in five places on the neck.", "Practice bends to pitch: play the target note first, then bend up to match it."], ["Transcribe a solo by ear. It trains your ear faster than reading tabs.", "Learn the notes on the low E and A strings so you can find any root note quickly."], ["Record yourself and listen for timing first, tone second.", "Learn modes by hearing them over a drone, not by memorizing shapes alone."], ["Teach someone. Explaining technique exposes the habits you've stopped noticing.", "Develop a signature phrase or tone you could recognize as your own."]], "piano": [["Learn finger numbers: thumbs are 1 and pinkies are 5 on both hands.", "Find middle C and learn the white keys around it by name."], ["Practice hands separately until each feels easy, then put them together slowly.", "Keep fingers gently curved, as if holding a ball, to play evenly."], ["Learn the C major scale with correct fingering, passing the thumb under smoothly.", "Learn to read the treble and bass clefs together, a few notes at a time."], ["Start using the sustain pedal, lifting and pressing it right after each chord change so chords don't blur.", "Learn the major and minor scales in all keys, a few each week."], ["Practice voicing: let the melody sing out over a softer accompaniment.", "Learn a piece from a different era, like Baroque or Romantic, to stretch your technique."], ["Record yourself to check evenness in fast runs and the balance between hands.", "Study a piece's harmony so you can memorize it by structure, not just muscle memory."], ["Prepare a short recital program and perform it from memory.", "Teach a beginner their first song. It sharpens your own fundamentals."]], "bass": [["Start by playing root notes on beat one of each chord in a simple song.", "Use your fretting hand's fingertips and keep your thumb behind the neck."], ["Lock in with the kick drum. Bass and drums together make the groove.", "Alternate your index and middle fingers when plucking for an even sound."], ["Mute strings you're not playing with both hands to avoid ringing notes.", "Learn simple walking lines using root, fifth and octave."], ["Learn the major and minor arpeggios across the neck.", "Practice with a metronome clicking only on beats 2 and 4 to strengthen your internal time."], ["Transcribe bass lines from songs you love and notice how they support the chords.", "Experiment with slap or pick technique to widen your tone options."], ["Learn to read bass clef or chord charts so you can sit in with other musicians.", "Work on playing behind, on, or ahead of the beat on purpose."], ["Write your own bass lines for chord progressions you haven't heard before.", "Teach a drummer or guitarist how your parts lock together."]], "drums": [["Learn a basic rock beat: kick on 1 and 3, snare on 2 and 4, hi-hat on eighth notes.", "Wear ear protection. Drums are loud enough to damage hearing over time."], ["Practice the single stroke roll and double stroke roll on a practice pad.", "Let the stick rebound off the head instead of pressing into it."], ["Learn the paradiddle and use it around the kit.", "Practice fills that end cleanly on beat one of the next bar."], ["Work through all 40 standard rudiments, a few at a time.", "Practice with a metronome at slow tempos. Steady and slow is harder than fast."], ["Learn grooves from different styles like funk, jazz, and Latin.", "Record yourself playing along to songs and check if you're rushing fills."], ["Work on dynamics: play ghost notes softly so accents stand out.", "Practice odd time signatures like 5/4 and 7/8."], ["Play with a band regularly and learn to support the song, not just show off.", "Develop your own fills and grooves that musicians would recognize as yours."]], "ukulele": [["Standard tuning is G-C-E-A, with the G string tuned higher than the C on most ukuleles.", "Learn C, A minor, F and G. Those four chords cover lots of songs."], ["Practice a simple down-down-up-up-down-up strum until it feels automatic.", "Keep your strumming hand moving even on beats where you don't hit the strings."], ["Learn to switch chords without stopping your strum.", "Try fingerpicking simple patterns with thumb and first two fingers."], ["Learn barre chords like B flat to unlock more keys.", "Try a chord-melody arrangement where you play the tune and harmony together."], ["Learn the notes on the fretboard so you can find melodies by ear.", "Experiment with chucks and percussive strums for rhythm variety."], ["Learn songs in a low-G tuning to hear a fuller range.", "Arrange a song from another instrument for ukulele."], ["Perform a full set of songs for friends or an open mic.", "Teach someone their first four chords."]], "violin": [["Learn the open strings: G, D, A and E, from lowest to highest.", "Work on a relaxed bow hold before worrying about notes."], ["Keep the bow parallel to the bridge and practice long, straight strokes on open strings.", "Beginners often use tape on the fingerboard to mark finger positions. That's normal while your ear develops."], ["Practice scales slowly with a drone note to train your intonation.", "Learn to tune with the fine tuners first, then the pegs with help."], ["Learn third position to reach higher notes on each string.", "Start working on vibrato slowly with a teacher's guidance."], ["Practice shifting between positions slowly, listening for the target note.", "Study bowing techniques like spiccato and martelé."], ["Record yourself to catch intonation drift in fast passages.", "Play chamber music with others to build ensemble listening."], ["Prepare a full concerto movement or recital piece.", "Teach a beginner bow hold and posture."]], "saxophone": [["Many beginners start with a softer reed, around strength 2 to 2.5, before moving up.", "Learn a steady embouchure: lower lip slightly over the bottom teeth, corners firm."], ["Play long tones every session to build a steady, full sound.", "Learn the octave key to jump between low and middle registers smoothly."], ["Learn your first major scales and practice them slowly.", "Use a tuner while playing long tones to check pitch."], ["Practice overtones to strengthen your air support and control.", "Start learning simple jazz standards and their melodies."], ["Transcribe solos by ear from recordings you admire.", "Work on articulation like slap tongue or ghosted notes."], ["Learn to improvise over common chord progressions such as a ii–V–I.", "Explore altissimo notes above the normal range with a teacher."], ["Develop a recognizable personal tone.", "Play in a band or combo and practice blending your sound."]], "tuba": [["Buzz your lips on the mouthpiece alone before playing the full instrument.", "Breathe deeply and relaxed. The tuba needs a lot of steady air."], ["Play long tones every day to build steady air and tone.", "Learn your first few valve combinations and the notes they make."], ["Practice lip slurs between notes using the same valve combination.", "Learn to read bass clef fluently."], ["Work on your low register while keeping the tone full, not flabby.", "Practice scales across the instrument's range."], ["Play in an ensemble and practice keeping the group in time.", "Work on articulation so low notes speak clearly."], ["Learn solo repertoire written for tuba.", "Record yourself to check pitch in your extreme registers."], ["Perform a solo piece in public.", "Teach a new brass player how to buzz and breathe."]], "singing": [["Warm up gently before singing, with hums or lip trills.", "Stop if your voice hurts or feels strained. Pushing through pain can cause damage."], ["Practice breathing low and steady so your shoulders don't rise when you inhale.", "Sing along with a piano or app to check your pitch."], ["Learn sirens: glide smoothly from low to high notes and back.", "Record yourself. Your voice sounds different from inside your head."], ["Learn to blend smoothly between your chest voice and head voice.", "Work on clear vowels. They carry tone more than consonants."], ["Sing harmony parts to train your ear.", "Learn a song in another language to stretch your diction."], ["Prepare a set and perform it for an audience.", "Work with a vocal coach to refine your technique and stamina."], ["Develop a recognizable personal style and interpretation.", "Teach someone how to warm up properly."]], "study": [["Study in short focused blocks with breaks.", "Remove distractions like your phone during study time.", "Start with an overview of the topic before diving into details."], ["Test yourself instead of just rereading. Recalling information strengthens memory.", "Space out your review over several days.", "Explain what you learned in your own words."], ["Take notes that summarize ideas, not copies of the text.", "Mix related topics in one session to see connections.", "Use a variety of sources."], ["Teach a concept to someone else to check your understanding.", "Work through harder material slowly and repeatedly.", "Join a study group or discussion."], ["Apply what you learn to a real project or problem.", "Read critically and question sources.", "Track what you've learned over time."], ["Go deep into one area and become the go-to person for it.", "Read primary sources and advanced texts.", "Write about what you've learned."], ["Mentor others in your subject.", "Contribute your own ideas to discussions in the field.", "Keep learning as a lifelong habit."]], "reading": [["Read at the same time each day to build the habit.", "Start with books you're genuinely curious about."], ["Keep a book with you for spare moments.", "It's fine to quit a book you don't enjoy."], ["Take brief notes or highlight key ideas.", "Summarize each chapter in a sentence or two."], ["Read across genres and subjects.", "Discuss books with friends or a book club."], ["Read challenging classics slowly and with notes.", "Compare books on the same topic."], ["Write reviews or reflections on what you read.", "Reread favorite books and notice new details."], ["Recommend books thoughtfully to others.", "Build a personal library of books that shaped you."]], "math": [["Work through problems yourself instead of only reading solutions.", "Review the basics you're shaky on before moving forward."], ["Show your work so you can find where mistakes happen.", "Practice a little every day instead of cramming."], ["Focus on understanding why a method works, not just the steps.", "Check answers by estimating first."], ["Explain a solution to someone else.", "Mix problem types so you learn to choose the right method."], ["Tackle problems that take several sessions to solve.", "Read proofs carefully and try to reconstruct them."], ["Study a new branch of math that interests you.", "Try competition-style or challenge problems."], ["Tutor someone in math.", "Explore open problems or research-level topics."]], "chess": [["Learn how every piece moves, including castling and en passant.", "Learn basic checkmates like king and queen against a lone king."], ["Follow opening principles: control the center, develop your pieces, castle early.", "Before each move, check what your opponent's last move threatens."], ["Solve tactics puzzles daily to spot forks, pins and skewers.", "Review your losses to find the mistakes."], ["Learn basic endgames like king and pawn endings.", "Play longer games where you have time to think."], ["Study annotated master games.", "Build a small, consistent opening repertoire."], ["Calculate variations deeply before moving in critical positions.", "Play in tournaments to test yourself."], ["Coach a beginner.", "Study the games of a world champion in depth."]], "history": [["Start with a broad overview of a period before details.", "Use timelines to place events in order."], ["Learn the difference between primary sources from the time and secondary sources about it.", "Ask why events happened when they did."], ["Read several perspectives on the same event.", "Visit museums or historic sites."], ["Read primary sources from the period you're studying.", "Notice how historians disagree and why."], ["Write a short essay on a historical question.", "Study how geography and economics shaped events."], ["Research a topic in depth using primary sources.", "Connect historical patterns to current events, carefully."], ["Share your research through talks or writing.", "Mentor someone starting to study history."]], "public-speaking": [["Practice out loud, not just in your head.", "Know your opening lines well. A strong start calms nerves."], ["Record yourself and watch it back.", "Pause instead of using filler words like 'um.'"], ["Structure talks with a clear beginning, middle and end.", "Practice in front of a friend or small group."], ["Know your audience and tailor your message.", "Use stories to make points memorable."], ["Join a speaking group, like a Toastmasters club.", "Practice handling questions and interruptions calmly."], ["Speak without reading from notes.", "Work on vocal variety: pace, volume and pitch."], ["Give a talk to a large audience.", "Coach someone preparing their first speech."]], "tech": [["Follow a beginner tutorial all the way through before starting your own project.", "Learn the keyboard shortcuts for the tools you use most.", "Save your work often and keep backups."], ["Build a tiny project you'd actually use.", "When stuck, search the exact error message.", "Keep notes on what you learn so you can find it later."], ["Learn version control or another way to track changes.", "Read official documentation, not just tutorials.", "Break big problems into small steps."], ["Study how experienced people structure their projects.", "Join a community or forum for your area.", "Build something slightly beyond your current skill."], ["Get feedback on your work from someone more experienced.", "Learn to debug systematically instead of guessing.", "Finish and share a complete project."], ["Contribute to a community project or help others online.", "Learn the fundamentals beneath the tools you use.", "Plan a larger project with milestones."], ["Mentor someone who's starting out.", "Build something that other people rely on.", "Keep learning as tools change."]], "coding": [["Type examples out instead of pasting them. Your fingers learn the syntax too.", "Learn one language well before jumping to another."], ["Build a tiny project you'd actually use, like a dice roller or a to-do list.", "Read error messages carefully. They usually point to the problem."], ["Learn Git basics and commit small changes often, with clear messages.", "Learn to use a debugger instead of only print statements."], ["Read the source of an open-source project you use.", "Learn basic data structures like arrays, maps and sets."], ["Write a test that reproduces a bug before fixing it, so it can't sneak back.", "Ask for code reviews and learn from the feedback."], ["Measure performance before optimizing. The slow part is rarely where you'd guess.", "Learn a second language in a different style, like functional programming."], ["Write for the person reading your code next year, including future you.", "Mentor a beginner or contribute to open source."]], "game-development": [["Start by recreating a simple classic like Pong.", "Pick one engine and stick with it while you learn."], ["Keep scope tiny. Finished small games teach more than unfinished big ones.", "Learn your engine's basics: scenes, objects and input."], ["Make a game in a weekend game jam.", "Playtest with someone else and watch without explaining."], ["Learn basic game feel: responsive controls, feedback and juice.", "Use version control for your projects."], ["Finish and publish a small game online.", "Study games you love and break down why they're fun."], ["Learn optimization and profiling in your engine.", "Work with others on art, sound or design."], ["Release a polished game with a full start-to-finish experience.", "Share postmortems of what you learned."]], "3d-modeling": [["Learn to navigate the viewport smoothly: orbit, pan and zoom.", "Start with simple objects like a mug or a chair."], ["Use reference images from several angles.", "Learn the basic modeling tools: extrude, loop cut and bevel."], ["Aim for clean topology, using mostly four-sided faces.", "Model in low detail first, then add detail."], ["Learn UV unwrapping and basic texturing.", "Learn basic lighting and rendering."], ["Model a full scene with several objects.", "Study professional models to see how they're built."], ["Learn sculpting or procedural techniques.", "Optimize models for their purpose, like games or film."], ["Build a portfolio of finished pieces.", "Teach a beginner the basics of the viewport."]], "video-editing": [["Organize footage into folders or bins before you start cutting.", "Learn the keyboard shortcuts for cut, trim and playback."], ["Cut out anything that doesn't serve the story.", "Good audio matters as much as good video."], ["Learn J and L cuts, where audio leads or trails the picture.", "Cut on action to make transitions feel smooth."], ["Color correct for consistency before adding a creative grade.", "Learn basic audio mixing and leveling."], ["Edit a short film or video with a clear structure.", "Study editing in films you admire."], ["Learn motion graphics or advanced effects.", "Develop a recognizable editing style."], ["Edit a longer project from start to finish.", "Teach someone to organize and cut footage."]], "electronics": [["Start with low-voltage, battery-powered projects. Leave mains wiring to qualified people.", "Learn Ohm's law: voltage equals current times resistance."], ["Always use a current-limiting resistor with an LED.", "Build circuits on a breadboard before soldering."], ["Learn to use a multimeter to measure voltage, current and resistance.", "Learn to solder in a ventilated area, and wash your hands afterward."], ["Learn to read schematics.", "Try a microcontroller board like Arduino for simple projects."], ["Design and build a small project from your own schematic.", "Learn to read component datasheets."], ["Design a printed circuit board for a project.", "Learn basic debugging with an oscilloscope."], ["Build a complex project combining hardware and code.", "Teach someone to solder safely."]], "trade": [["Learn the safety gear and rules for every tool before anything else.", "Keep your workspace clean and well lit.", "Read the manual for each tool you use."], ["Measure twice, cut once. Slow, accurate work beats fast rework.", "Learn the names and uses of the basic hand tools.", "Practice on scrap material before your real project."], ["Finish a small project start to finish, even if it's simple.", "Learn how to keep your tools clean and sharp.", "Ask experienced people to look at your work."], ["Take a class or find a mentor in your trade.", "Learn the relevant codes or standards for your work.", "Keep a notebook of techniques and measurements."], ["Take on a project with a real deadline or a real customer.", "Learn to estimate time and materials before starting.", "Study common failure points and how to avoid them."], ["Keep a log of mistakes and fixes. It becomes your best reference.", "Learn when a job needs a licensed professional.", "Refine your work for both function and finish."], ["Mentor an apprentice. Teaching keeps your standards sharp.", "Consider formal certification if it fits your goals.", "Take on a showcase project that uses all your skills."]], "woodworking": [["Wear eye and hearing protection, and keep fingers away from blades.", "Learn to read wood grain direction before cutting or planing."], ["Measure from the same reference edge each time to avoid adding up errors.", "Keep chisels and plane blades sharp. Dull tools need more force and slip."], ["Use push sticks on the table saw and never reach over a moving blade.", "Learn a few basic joints, like butt, dado and rabbet."], ["Check for square at every step of assembly.", "Learn about wood movement: boards expand and shrink with humidity."], ["Learn traditional joinery like mortise-and-tenon and dovetails.", "Wear a dust mask or use dust collection. Fine wood dust is harmful to breathe."], ["Experiment with finishes and test them on scrap first.", "Design your own furniture with sketches and a cut list."], ["Build a heirloom piece that uses your best joinery.", "Teach a beginner to use hand tools safely."]], "welding": [["Learn in a class with proper supervision before welding on your own.", "Always wear a welding helmet, gloves, and flame-resistant clothing. Arc light can burn your eyes and skin."], ["Weld in a well-ventilated area. Welding fumes are harmful to breathe.", "Clean metal thoroughly before welding. Rust and paint cause weak, dirty welds."], ["Practice running straight, consistent beads on flat scrap metal.", "Keep a fire extinguisher nearby and clear flammables from your area."], ["Learn the differences between MIG, TIG and stick welding.", "Practice different joint types, like butt, lap and T-joints."], ["Practice welding in different positions, like horizontal and vertical.", "Learn to read welding symbols on drawings."], ["Cut and inspect test welds to check penetration.", "Learn to weld different metals, like aluminum and stainless."], ["Consider a recognized welding certification if you want to weld professionally.", "Build a project that requires precise fitting and welding."]], "electrical": [["Many places require permits or a licensed electrician for wiring work. Check your local rules first.", "Learn the basics of how circuits work before touching any wiring."], ["Always turn off power at the breaker before working, then confirm it's off with a voltage tester.", "Never assume a circuit is dead just because a switch is off."], ["Learn to safely replace a light switch or outlet with power off and verified.", "Use the correct wire gauge for the circuit."], ["Learn to read basic wiring diagrams.", "Understand what GFCI and AFCI protection do and where they're required."], ["Learn your local electrical code basics.", "Practice clean, secure connections and proper box fill."], ["Know when to call a licensed electrician, especially for panels or service upgrades.", "Learn to troubleshoot circuits with a multimeter."], ["Consider formal training if you want to work in the trade.", "Teach others the basics of electrical safety."]], "plumbing": [["Find your home's main water shutoff before you need it.", "Turn off the water supply before working on any fixture."], ["Wrap thread tape in the same direction the fitting tightens.", "Don't overtighten plastic fittings. They can crack."], ["Learn to fix a running toilet by replacing the flapper or fill valve.", "Learn to clear a clog with a plunger or drain snake before reaching for chemicals."], ["Learn basic pipe types like copper, PEX and PVC.", "Check for leaks after every repair."], ["Learn to replace a faucet or shower valve cartridge.", "Understand how drain venting works."], ["Learn local plumbing codes for your area.", "Know when to call a licensed plumber, especially for gas lines or main sewer work."], ["Take on a full fixture install from start to finish.", "Teach someone where their shutoff valves are."]], "auto-repair": [["Never work under a car supported only by a jack. Use jack stands on solid ground.", "Learn to check oil, coolant and tire pressure."], ["Chock the wheels before lifting a car.", "When disconnecting a battery, remove the negative terminal first and reconnect it last."], ["Learn to change your oil and filter.", "Tighten lug nuts in a star pattern to the torque in your manual."], ["Learn to replace brake pads with a repair manual for your vehicle.", "Use an OBD-II scanner to read engine fault codes on most modern cars."], ["Learn to diagnose common noises and leaks.", "Keep a maintenance log for your vehicle."], ["Work on more advanced repairs like suspension parts with proper tools.", "Know when a job needs a professional shop or specialized equipment."], ["Take on a restoration or major repair project.", "Teach someone basic car care."]], "sewing": [["Practice sewing straight lines on paper with an unthreaded machine.", "Learn to thread your machine and wind a bobbin."], ["Pre-wash fabric to pre-shrink it before cutting.", "Press seams with an iron as you go for a cleaner finish."], ["Learn to read a pattern and match its seam allowance.", "Change machine needles regularly. Dull needles cause skipped stitches."], ["Learn to sew zippers and buttonholes.", "Make a simple garment like a skirt or tote bag."], ["Learn to adjust patterns for fit.", "Try working with tricky fabrics like knits or silk."], ["Draft a simple pattern from your own measurements.", "Learn finishing techniques like French seams."], ["Design and sew a garment from scratch.", "Teach someone to use a sewing machine."]], "science": [["Keep a notebook of questions, observations and results from day one.", "Learn the steps of the scientific method: question, hypothesis, test, observe, conclude.", "Follow the safety instructions for any experiment, and wear eye protection when an activity calls for it."], ["Measure carefully and write down the units every time.", "Repeat an experiment to check that your results are consistent.", "Learn from reputable sources like university courses, museums and science journalists."], ["Change one variable at a time and keep everything else the same.", "Practice turning your data into simple graphs.", "Learn the difference between correlation and causation."], ["Read a real research paper, starting with the abstract and the figures.", "Design a small experiment of your own with a control group.", "Learn basic statistics like averages, spread and sample size."], ["Try to replicate a famous classic experiment.", "Learn to estimate the uncertainty in your measurements.", "Join a citizen-science project that collects real data."], ["Write up an experiment as a short report with methods and results.", "Critique studies by checking their methods and sample sizes.", "Present your findings to others and invite questions."], ["Mentor a beginner through their first experiment.", "Contribute to a research project or community science group.", "Keep following new research in your field."]], "chemistry": [["Always wear safety goggles for experiments, and never taste chemicals or sniff them directly.", "Learn the first 20 elements of the periodic table and their symbols."], ["Only try home experiments from reputable kits or guides, with good ventilation.", "Learn the difference between atoms, molecules and ions."], ["Learn to balance chemical equations so the same atoms appear on both sides.", "Learn the difference between acids and bases, and what the pH scale measures."], ["Learn the mole and how to convert between grams and moles.", "Learn to read the safety data sheet for any chemical you use."], ["Study what speeds reactions up, like temperature, concentration and catalysts.", "Learn the common functional groups in organic chemistry."], ["Practice lab techniques like titration with proper supervision.", "Learn how a chemical equilibrium shifts when conditions change."], ["Help run a safe demonstration for beginners.", "Explore a specialty like biochemistry or materials chemistry."]], "biology": [["Learn the main parts of a cell and what each one does.", "Observe living things around you and keep a nature journal."], ["Learn to use a microscope, starting at the lowest magnification and working up.", "Learn the levels of life, from cells and tissues up to ecosystems."], ["Learn how DNA stores genetic information.", "Practice simple inheritance problems with Punnett squares."], ["Study how natural selection drives evolution.", "Learn the main body systems and how they work together."], ["Learn how energy and nutrients cycle through an ecosystem.", "Identify species in your area with a field guide or app."], ["Read primary research on a topic you care about.", "Learn how modern techniques like DNA sequencing work."], ["Join a citizen-science project, like a local species survey.", "Teach someone how to use a microscope."]], "physics": [["Learn the basic units: meters, kilograms and seconds.", "Notice physics in everyday life, like friction, gravity and momentum."], ["Learn Newton's three laws of motion.", "Practice drawing diagrams of the forces acting on an object."], ["Learn the equations for motion with constant acceleration.", "Learn how energy is conserved and changes from one form to another."], ["Always check that the units in your answer make sense.", "Learn the basics of electricity: voltage, current and resistance."], ["Study waves, including sound and light.", "Learn some calculus. Much of physics is written in it."], ["Explore thermodynamics, the physics of heat and energy.", "Read about relativity and quantum mechanics from trusted sources."], ["Work through challenge problems from olympiads or advanced textbooks.", "Explain a physics idea to a beginner with a simple demonstration."]], "astronomy": [["Never look at the Sun through binoculars or a telescope without a proper solar filter. It can permanently damage your eyes.", "Learn a few bright constellations you can see from where you live."], ["Let your eyes adjust to the dark for 20 to 30 minutes before observing.", "Use a red flashlight so you keep your night vision."], ["Start with binoculars before buying a telescope.", "Find the planets with a star chart or astronomy app."], ["Follow the Moon's phases and features over a whole month.", "Learn about light pollution and find a darker spot to observe from."], ["Learn how a telescope's aperture affects what you can see.", "Keep an observing log with the date, conditions and what you saw."], ["Try astrophotography, starting with the Moon.", "Learn how stars form, live and die."], ["Join an astronomy club and share your views at a star party.", "Contribute to a citizen-science project like variable star observing."]], "outdoors": [["Tell someone where you're going and when you'll be back.", "Check the weather and pack water, a snack and an extra layer before you head out.", "Start with short, well-marked routes close to home."], ["Wear shoes that suit the ground, like trail shoes or boots for rough paths.", "Learn to read a trail map, and carry one as a backup to your phone.", "Leave no trace: pack out everything you bring in."], ["Pack the basics every time: water, food, a light, first aid and a charged phone.", "Turn around at the time you planned, even if your goal is close.", "Learn the local hazards, such as poison ivy, ticks and unstable ground."], ["T   const TIPS = Object.assign({}, TIP_DATA.sets);

  // ---------- Math helpers ----------
  const lvFrom = m => Math.min(MAX_LV, Math.floor(Math.sqrt(Math.max(0, m) / MIN_PER_LV)));

  const VET_TIERS = [{ h: 1, name: "Bronze" }, { h: 50, name: "Silver" }, { h: 250, name: "Gold" }, { h: 1000, name: "Platinum" }, { h: 5000, name: "Diamond" }];
  function vetBadge(min, long) {
    const h = (min || 0) / 60; if (h < 1) return "";

  }
  function progress(m) {

    if (m >= LEGEND_MIN) return { L, have: 1, need: 1, pct: 1, next: "Legend" };

  const pad = n => String(n).padStart(2, "0");

  const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dayKey(d); };

  // ---------- State ----------
  const blank = () => ({ v: 1, heroName: "", skills: [], sessions: [], gold: 0, keyShards: 0, keysUsed: 0, owned: {}, equipped: {}, trophies: {}, runs: [], tipVotes: {}, submissions: [], talents: {}, title: null, appearance: null, settings: { sound: true, haptics: true, theme: "classic", panel: "clean" }, restedPool: 0, lastSessionDay: null, timer: null });

  // ---------- Persistence ----------

  async function load() {
    let db = null, user = null, id = null;
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use("db");
        user = await window.claude.use("user");
        id = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    if (db && id) {
      try {
        ref = db.collection("data/users/" + id).doc("hero"); dbh = db;
        const snap = await ref.get();
        if (snap.exists) { state = Object.assign(blank(), snap.data()); migrate(); }
        mode = "cloud"; setPill("Saved to your account");
        return;
      } catch (e) { ref = null; }
    }
    try { const raw = localStorage.getItem(LS_KEY); if (raw) { state = Object.assign(blank(), JSON.parse(raw)); migrate(); } mode = "local"; setPill("Saved on this device"); }
    catch (e) { mode = "none"; setPill("Not saving: storage is blocked here", true); }
  }

  // Saves go out right away (one at a time, newest state wins) so nothing is lost if the page
  // reloads, for example when an update is published while the app is open.
  let dirty = false, saving = false, failToastShown = false;
  function persist() {
    progressTick();

    dirty = true;
    if (mode !== "none") setPill("Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 0);
  }
  function flushSave() {
    if (!dirty || saving) return;

    const data = JSON.parse(JSON.stringify(state));
    chain = chain.then(async () => {
      if (mode === "cloud") {
        try { await ref.set(data); if (!dirty) setPill("Saved to your account"); failToastShown = false; }
        catch (e) {
          dirty = true;
          setPill("Couldn't save. Retrying when you make your next change.", true);
          if (!failToastShown) { failToastShown = true; toast(`Couldn't save to your account${e && e.code ? " (" + esc(e.code) + ")" : ""}. Your progress is still on screen.`); }
        }
      } else if (mode === "local") {
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); if (!dirty) setPill("Saved on this device"); }

      }

  }

  // Older saves had no category; place each skill in the best-matching one.
  function migrate() {
    if (!state.settings || typeof state.settings !== "object") state.settings = { sound: true, haptics: true, theme: "classic", panel: "clean" };
    state.skills.forEach(s => {
      if (!PATHS[s.cat]) s.cat = "life";
      if (s.earnedXp == null) s.earnedXp = s.earnedMin;
      if (!s.catId || !CATEGORIES.some(c => c.id === s.catId)) {
        const p = PRESETS.find(x => x.name.toLowerCase() === s.name.toLowerCase());
        s.catId = p ? p.catId : (PATH_HOME[s.cat] || "life");
      }
    });
    // Paths v2 (v0.14): visual arts move from Craft to Art, gardening moves to Nature, every skill gets a discipline.
    if (!state.pathsV2) {
      state.skills.forEach(s => {
        const n = s.name.toLowerCase(), pr = PRESETS.find(x => x.name.toLowerCase() === n);
        if (s.catId === "art" && s.cat === "craft") s.cat = "music";
        if (n === "gardening") s.cat = "nature";
        if (pr && pr.disc === "visual" && s.cat === "craft") s.cat = "music";
        s.disc = discFor(s.name, s.catId, s.cat);
      });
      state.pathsV2 = true;
    }
    state.skills.forEach(s => { if (!DISCIPLINES[s.disc] || DISCIPLINES[s.disc].path !== s.cat) s.disc = discFor(s.name, s.catId, s.cat); });
    state.sessions.forEach(x => {
      if (x.xp == null) x.xp = x.min;
      if (!x.type) x.type = "solo";
      if (x.rested == null) x.rested = 0;
    });
    if (state.sessions.some(x => x.shards == null)) {
      const byDay = {};
      [...state.sessions].sort((a, b) => a.ts - b.ts).forEach(x => {
        if (x.shards == null) { const used = byDay[x.day] || 0; x.shards = Math.max(0, Math.min(x.min, DAILY_SHARD_CAP - used)); }
        byDay[x.day] = (byDay[x.day] || 0) + x.shards;
      });
      state.keyShards = state.sessions.reduce((n, x) => n + x.shards, 0);
    }
    if (state.keyShards == null) state.keyShards = 0;
    if (state.keysUsed == null) state.keysUsed = 0;
    if (state.relics) Object.keys(state.relics).forEach(k => { const m = /^relic:(.+):(\d)$/.exec(k); if (m) { const r = state.relics[k]; delete state.relics[k]; const id = m[1] + ":" + m[2]; state.relics[id] = { day: r.day, dungeon: r.dungeon }; state.owned[id] = state.owned[id] || true; } });
    ["owned", "equipped", "trophies", "tipVotes", "talents", "relics", "relicOff"].forEach(k => { if (!state[k] || typeof state[k] !== "object") state[k] = {}; });
    if (!Array.isArray(state.runs)) state.runs = [];
    if (!state.days || typeof state.days !== "object") { state.days = {}; state.sessions.forEach(x => addDay(x.day, x.skillId, x.min)); }
    if (!state.stats || typeof state.stats !== "object") state.stats = { clears: state.runs.filter(r => r.win).length, runs: state.runs.length };
    if (!Array.isArray(state.submissions)) state.submissions = [];
    petMigrate();
  }

  // ---------- Derived ----------
  function restedNow() {
    if (!state.lastSessionDay) return Math.min(REST_CAP, state.restedPool);
    const idle = Math.max(0, dayNum(dayKey()) - dayNum(state.lastSessionDay) - 1);
    return Math.min(REST_CAP, state.restedPool + idle * REST_PER_DAY);
  }
  function heroClass() { return classHero(); }   // CLASSES (v0.15): the class you chose (see the CLASSES section)
  // Dungeon keys: earned from real practice minutes only (never prior hours), capped per day.
  // Shards behind keys you already spent can't be taken back, so deleting a session that paid for a
  // spent key leaves a small shard debt that your next practice repays first.
  const keysAvail = () => Math.max(0, Math.floor(state.keyShards / SHARDS_PER_KEY) - state.keysUsed);
  const shardDebt = () => Math.max(0, state.keysUsed * SHARDS_PER_KEY - state.keyShards);
  const shardRem = () => shardDebt() ? 0 : state.keyShards % SHARDS_PER_KEY;
  const shardsOnDay = day => state.sessions.filter(x => x.day === day).reduce((n, x) => n + (x.shards || 0), 0);
  const earnedLv = s => lvFrom(totalXp(s));
  function gearFor(s) {

  }
  function equippedItem(s) { const id = state.equipped[s.id]; return id ? gearFor(s).find(g => g.id === id) : null; }
  function heroStats() {
    const tf = talentFx(), tal = tf.stat, gp = 1 + tf.gearPow / 100, base = {}, gear = {};
    Object.keys(STATS).forEach(k => { base[k] = 0; gear[k] = 0; });
    state.skills.forEach(s => { base[s.cat] += lvFrom(totalXp(s)); const it = equippedItem(s); if (it) gear[s.cat] += it.bonus; });
    Object.keys(gear).forEach(k => { gear[k] = Math.round(gear[k] * gp); });
    const total = {}; Object.keys(STATS).forEach(k => total[k] = base[k] + gear[k] + (tal[k] || 0));

  const fortunePct = st => Math.min(50, st.total.life);
  const dungeonOpen = (d, power) => d.rec <= 5 || power >= d.rec * 0.5;

  // ===== CLASSES (v0.15) =====
  // Your class comes from what you practice, and you choose it from every class you've unlocked
  // (see the Class Compendium). This build has two tiers: 5 neutral classes (from total level) and
  // 16 starter classes (one per discipline, at discipline Lv 10). Later tiers (specialization, dual,
  // two-path, ascended) go in the same table with their own `tier` and `req`.
  // A class gives a signature battle skill and an always-on perk. Never XP.
  // Signature skills are recipes run by castSkill's recipe branch (keys start "c-"); the new recipe

  const TAL_KIND = ["power", "tactics", "fortune"];

  // ---------- Overworld: the pet trots one tile behind ----------

  const PET_LAG = 4;     // the hero takes 4 frames per tile (3 for a Strider, so the pet lags less)

    { const L = petLag(); petTrail = []; for (let i = 0; i <= L; i++) petTrail.push({ fx: near[0] + (a.x - near[0]) * i / L, fy: near[1] + (a.y - near[1]) * i / L }); }

  }

  }

    petTrail.push({ fx: advPos.fx, fy: advPos.fy });
    if (petTrail.length > 24) petTrail.shift();
    const cur = petTrail[Math.max(0, petTrail.length - 1 - petLag())];

  }
  // Returns a painter: call it with each row while trees are drawn back to front; it draws the pet once.
  function petMapPainter(c, camX, camY) {

  }

  // MONSTERS, DUNGEON_SCENE and RELIC_CHANCE are declared further down the file, so register lazily.
  let adv2Ready = false;
  function adv2Register() {

    });
  }

  const caveState = R => { adv2State(); return state.caves[R.cave.id] || (state.caves[R.cave.id] = { found: null, clears: 0, first: null }); };
  const bossState = R => { adv2State(); return state.bosses[R.id] || (state.bosses[R.id] = { wins: 0, first: null }); };

  // Steps complete on their own, in order. Nothing expires and progress never decays.
  function advCheckMissions() {

  // --- Battles: caves and bosses are dungeon fights with a kind ---
  function advBattleDef(kind, R) {

    const d = adv2Dun(R), cave = kind === "cave", rc = RELIC_CHANCE[d.id] || 0.05;
    const first = cave ? !caveState(R).clears : !bossState(R).wins;

      gold: cave ? [Math.round(d.gold[0] * 0.5), Math.round(d.gold[1] * 0.5)] : first ? [Math.round(d.gold[0] * 1.5), Math.round(d.gold[1] * 1.5)] : d.gold.slice(),
      hpX: cave ? ADV2_CAVE_HP : ADV2_BOSS_HP, dmgX: cave ? 1 : ADV2_BOSS_DMG, boss: cave ? null : R.boss,
      relicCh: cave ? rc * 0.5 : first ? Math.min(0.5, rc * 3) : rc * 1.5 };

  function advFight(kind, rid) {
    const R = adv2Reg(rid); if (!R || bt || runView && runView.step < 4) return;
    if (keysAvail() < 1) { toast("No keys yet. Practice 10 minutes to earn one."); return; }
    if (!dungeonOpen(adv2Dun(R), heroStats().power)) return;
    if (kind === "boss" && !missionDone(R)) return;
    startBattle(advBattleDef(kind, R));

  // startBattle hook: potion tracking for every fight, then per-kind HP and the boss wind-up timer.
  function advBattleStart(b) {
    b.pot = { used: 0, cd: 0, drank: {} };
    const d = b.d; if (!d.kind) return;
    const V = b.monMax / 600, Vn = d.kind === "boss" ? 0.9 + Math.random() * 0.2 : V;   // bosses roll a narrower strength
    b.monMax = b.monHp = Math.round(600 * Vn * d.hpX);
    b.monDmg = b.monDmg * (Vn / V) * (d.dmgX || 1);
    if (d.kind === "boss") b.bw = { st: "idle", next: 10 + adv2Gap(), start: 0, end: 0, n: 0 };
  }
  const adv2Gap = () => ADV2_EVERY[0] + Math.floor(Math.random() * (ADV2_EVERY[1] - ADV2_EVERY[0] + 1));
  // stepBattle hook (fight phase, every 100 ms tick): potion cooldown and the telegraphed boss special.
  function advBattleTick(b) {
    if (b.pot && b.pot.cd > 0) b.pot.cd--;
    const w = b.bw; if (!w) return;
    const B = b.d.boss, mx = 44;
    if (w.st === "idle") {
      if (b.t < w.next) return;
      if (b.stun > 0) { w.next = b.t + 5; return; }
      w.st = "wind"; w.start = b.t; w.end = b.t + ADV2_WIND; w.n++; b.nextMon = Math.max(b.nextMon, w.end + 8);
      btPop("Winding up!", mx, 12, "#ff6a5a", true); b.log = `${B.wind}: ${B.special}! Stun it, raise a shield, or dodge it.`;
      Sound.play("tap"); buzz(15); return;
    }
    if (b.stun > 0) {                                   // any stun during the wind-up interrupts it
      w.st = "idle"; w.next = b.t + adv2Gap(); b.monHit = b.t;
      btPop("Interrupted!", mx, 12, "#ffe58a", true); b.log = `Interrupted! ${B.special} fizzles out.`; b.fx.push({ k: "flash", ttl: 2 });
      Sound.play("unlock"); buzz([20, 30]); return;
    }
    if (b.t < w.end) return;
    w.st = "idle"; w.next = b.t + adv2Gap(); b.monAtk = b.t;

    const W = VW * TS, H = VH * TS;
    if (cv.width !== W * AS) { cv.width = W * AS; cv.height = H * AS; }
    const c = cv.getContext("2d"); c.imageSmoothingEnabled = false;
    c.setTransform(AS, 0, 0, AS, 0, 0);
    const camX = Math.max(0, Math.min(AW * TS - W, advPos.fx * TS + 8 - W / 2)), camY = Math.max(0, Math.min(AH * TS - H, advPos.fy * TS + 8 - H / 2));
    const bits = seenGet(), f = Math.floor(performance.now() / 120);
    const x0 = Math.floor(camX / TS), y0 = Math.floor(camY / TS);
    const each = fn => { for (let y = y0; y <= y0 + VH; y++) for (let x = x0; x <= x0 + VW; x++) { if (x < AW && y < AH) fn(x, y, Math.round(x * TS - camX), Math.round(y * TS - camY)); } };

    // trees and the hero, back to front, so canopies overlap the row above
    const walking = advPath.length > 0;
    const hg = miniHero(heroLook(), advFrame >> 2, { walk: walking });
    const hx = Math.round(advPos.fx * TS - camX) - 1, hy = Math.round(advPos.fy * TS - camY) - 4;
    const drawHero = () => { c.fillStyle = "rgba(0,0,0,.2)"; c.fillRect(hx + 4, hy + 17, 10, 2); hg.forEach((row, yy) => row.forEach((col, xx) => { if (col) { c.fillStyle = col; c.fillRect(hx + xx, hy + yy, 1, 1); } })); };
    const petDraw = petMapPainter(c, camX, camY);
    let heroDrawn = false;
    for (let y = y0; y <= y0 + VH + 1; y++) {
      petDraw(y);
      if (!heroDrawn && y > advPos.fy) { drawHero(); heroDrawn = true; }
      for (let x = x0 - 1; x <= x0 + VW + 1; x++) {
        if (x < 0 || y < 0 || x >= AW || y >= AH || !bits[y * AW + x]) continue;
        const t = tileAt(x, y), px = Math.round(x * TS - camX), py = Math.round(y * TS - camY);
        if (t === "T") drawTree(c, px, py, x, y); else if (t === "P") drawPine(c, px, py);
      }

    if (!heroDrawn) drawHero();

    each((x, y, px, py) => {
      if (!bits[y * AW + x]) { P(c, px, py, TS, TS, "#151a2c"); return; }
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([ox, oy]) => { const nx = x + ox, ny = y + oy; if (nx >= 0 && ny >= 0 && nx < AW && ny < AH && !bits[ny * AW + nx]) { c.fillStyle = "rgba(21,26,44,.45)"; c.fillRect(px + (ox > 0 ? 12 : 0), py + (oy > 0 ? 12 : 0), ox ? 4 : TS, oy ? 4 : TS); } });
    });
    classMapFog(c, bits, camX, camY);                 // CLASSES (v0.15): Technomancer sees chests through fog
    // target marker
    if (advPath.length) { const [tx, ty] = advPath[advPath.length - 1]; const px = tx * TS - camX, py = ty * TS - camY; c.strokeStyle = "#ffe58a"; c.lineWidth = 1; c.strokeRect(px + 3.5, py + 3.5, 9, 9); }
    c.setTransform(1, 0, 0, 1, 0, 0);
    const reg = document.getElementById("adv-region"); if (reg) { const r = regionAt(a.x, a.y).name; if (reg.textContent !== r) reg.textContent = r; }
  }

  // ---------- Training scene ----------
  let liveLevel = null;
  function project(t) {

    const pool = restedNow(), rested = Math.min(el, pool);
    const ae = activeElixir();
    const xp = el * (t.type === "lesson" ? LESSON_MULT : 1) + rested + (ae ? Math.min(el, ae.left) * (t.type === "lesson" ? LESSON_MULT : 1) * ae.pct / 100 : 0);
    const shards = Math.max(0, Math.min(Math.floor(el), DAILY_SHARD_CAP - shardsOnDay(dayKey())));
    const total = totalXp(s) + xp;
    return { s, xp, rested: pool > 0 && rested < pool, p: progress(total), shards, keys: Math.max(0, Math.floor((state.keyShards + shards) / SHARDS_PER_KEY) - state.keysUsed), rem: state.keyShards + shards < state.keysUsed * SHARDS_PER_KEY ? 0 : (state.keyShards + shards) % SHARDS_PER_KEY };
  }

  function liveTick() {
    const t = state.timer; if (!t) return;
    document.querySelectorAll("[data-elapsed]").forEach(el => { el.textContent = clock(Date.now() - t.startedAt); });
    const pj = project(t); if (!pj.s) return;

  function renderSkill(s) {

  const REFRESH = '<svg viewBox="0 0 24 24" aria-hidden="true" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>';

  function tipLibrary(s, ti) {

    return `<details class="tip-lib"><summary>Tip library · ${unlocked} unlocked of ${set.reduce((n, t) => n + t.length, 0)}</summary>
      ${set.map((tier, i) => i <= ti
        ? `<div class="lib-tier"><div class="lbl">${TIERS[i].name}</div><ul>${tier.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`
        : `<div class="lib-tier locked"><div class="lbl">${TIERS[i].name}</div><span class="muted">${tier.length} tip${tier.length > 1 ? "s" : ""} unlock at Lv ${TIERS[i].min}</span></div>`).join("")}

  function renderDetail(s, p, lvTi) {
    const set = TIPS[tipSetKey(s)];
    const sessions = state.sessions.filter(x => x.skillId === s.id).length;

    const tipXp = Math.max(totalXp(s), s.importedMin || 0), ti = tierIdx(lvFrom(tipXp)), vetBoost = ti > lvTi;

        : `${s.importedMin >= 60 ? vetBadge(s.importedMin, true) : `<span class="muted">No veteran hours</span>`}<button class="linkbtn" style="font-size:13px" data-act="vet-edit" data-id="${s.id}">${s.importedMin >= 60 ? "Edit" : "Add veteran hours"}</button>`}</div>

    const sp = { id: "sp", name: "Spanish", catId: "language", cat: "mind", tips: "language", importedMin: 0, earnedMin: 0, earnedXp: 0, created: daysAgo(20) };

    plan.reverse().forEach(([ago, id, min, note, type], i) => {

      const sk = s.skills.find(k => k.id === id); sk.earnedMin += min; sk.earnedXp += xp;
      s.sessions.unshift({ id: "x" + i, skillId: id, min, day: daysAgo(ago), ts: Date.now() - ago * 864e5, xp, rested: 0, type, shards: min, note });
    });

    s.gold = 140; s.owned = { "g:0": true }; s.equipped = { g: "g:0" };
    s.talents = { instrument: ["instrument.a1", "instrument.b1"], health: ["health.a1", "health.a2", "health.c1"] };
    s.days = {};
    s.sessions.forEach(x => { (s.days[x.day] = s.days[x.day] || {})[x.skillId] = (s.days[x.day][x.skillId] || 0) + x.min; });
    [[g, 600], [r, 1200], [sp, 300]].forEach(([k, m], j) => { for (let w = 2; w < 12; w++) { const d = daysAgo(w * 7 + j), part = Math.round(m / 10 * (0.6 + ((w * 7 + j * 3) % 9) / 10)); (s.days[d] = s.days[d] || {})[k.id] = part; } });

  // ---------- Events ----------
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset && el.dataset.actChange === "ap-slot") { appearance().show[el.dataset.slot] = el.value; persist(); render(); }
    if (el.dataset && el.dataset.actChange === "prog-skill") { progSkill = el.value; render(); }
    if (el.dataset && el.dataset.actChange === "skill-disc") {
      const s = skillById(el.dataset.id), d = DISCIPLINES[el.value];
      if (s && d) { s.disc = el.value; s.cat = d.path; persist(); render(); toast(`${esc(s.name)} now counts toward ${esc(PATHS[d.path].label)} · ${esc(d.label)}.`); }
    }
  });
  function reportError(err) {
    const msg = err && err.message ? err.message : String(err);
    try { console.error(err); } catch (e) {}
    toast(`Something went wrong: ${esc(msg).slice(0, 140)}. Please tell us with Send feedback.`, "", 7000);
  }
  // Ignore harmless browser noise (layout observer warnings, opaque errors from the host page).
  const benign = m => /ResizeObserver|Script error|Load failed|NetworkError|AbortError|cancelled|declined/i.test(String(m || ""));
  window.addEventListener("error", e => { const m = (e.error && e.error.message) || e.message; if (!e.error || benign(m)) return; reportError(e.error); });
  window.addEventListener("unhandledrejection", e => { const r = e.reason; const m = r && (r.message || r.code) || r; if (benign(m) || (r && r.code)) return; reportError(r); });
  document.addEventListener("click", e => {
    try { handleClick(e); } catch (err) { reportError(err); try { render(); } catch (e2) {} }
  });
  function handleClick(e) {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    switch (act) {
      case "toggle": open = open === id ? null : id; confirm = null; render(); break;
      case "start-timer": openStart(id); break;
      case "start-now": if (!state.timer && skillById(id)) startTimer(id, b.dataset.type); break;
      case "start-go": dlgStart.close(); if (!state.timer && skillById(startFor)) startTimer(startFor, b.dataset.type); break;
      case "stop-timer": stopTimer(); break;
      case "ask-discard": confirm = { kind: "timer" }; render(); break;
      case "discard-timer": state.timer = null; confirm = null; toast("Session discarded."); persist(); render(); break;
      case "cancel-confirm": confirm = null; render(); break;
      case "quick": logMinutes(id, +b.dataset.min, dayKey(), ""); break;
      case "open-log": openLog(id); break;
      case "open-add": openAdd(); break;
      case "ask-remove": confirm = { kind: "skill", id }; render(); break;
      case "remove-skill": confirm = null; removeSkill(id); break;
      case "ask-session": confirm = { kind: "session", id }; render(); break;
      case "delete-session": confirm = null; deleteSession(id); break;
      case "edit-name": editingName = true; render(); break;
      case "tab": tab = b.dataset.tab; if (tab !== "dungeons" && runView && runView.step >= 4) runView = null; try { localStorage.setItem("levelup.tab", tab); } catch (e) {} render(); if (window.matchMedia("(max-width: 820px)").matches) { const col = document.querySelector(".col"); if (col) col.scrollIntoView({ block: "start" }); } break;
      case "install-go": tab = "settings"; render(); { const el = document.getElementById("install-card"); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); } break;
      case "copy-link": {
        const done = () => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy link"; }, 1600); };
        try { navigator.clipboard.writeText(APP_URL).then(done, () => { const i = document.getElementById("app-url"); if (i) { i.focus(); i.select(); } }); } catch (e2) { const i = document.getElementById("app-url"); if (i) { i.focus(); i.select(); } }
        break;
      }
      case "buy": buyItem(id); break;
      case "tal-cat": talCat = id; confirm = null; Sound.play("tap"); render(); break;
      case "tal-learn": learnTalent(id); break;
      case "ask-tal-reset": confirm = { kind: "tal-reset", id: talCat }; render(); break;
      case "tal-reset": confirm = null; resetTree(id); break;
      case "tal-title": state.title = state.title === id ? null : id; persist(); render(); break;
      case "equip": equipItem(id); break;
      case "relic-ver": { if (!hasRelic(id)) break; if (!state.relicOff) state.relicOff = {}; if (b.dataset.val === "1") delete state.relicOff[id]; else state.relicOff[id] = true; Sound.play("tap"); persist(); render(); break; }
      case "run": runDungeon(id); break;
      case "close-run": runView = null; render(); break;
      case "bt-skill": useSkill(id); break;
      case "tal-skill": toggleTalSkill(id); break;
      case "drink": drinkElixir(id); break;
      case "drink-replace": drinkElixir(id, true); break;
      case "buy-elixir": buyElixir(id); break;
      case "feedback": openFeedback("feedback"); break;
      case "upd-go": Updater.go(); break;
      case "upd-check": Updater.update(); break;
      case "toggle-autoupd": { state.settings.autoUpdate = !Updater.auto(); persist(); render(); if (Updater.auto()) Updater.check(false); break; }
      case "cel-close": closeCelebrate(); break;
      case "cel-talents": closeCelebrate(); talCat = id; tab = "talents"; try { localStorage.setItem("levelup.tab", tab); } catch (e) {} render(); { const col = document.querySelector(".col"); if (col && window.matchMedia("(max-width: 820px)").matches) col.scrollIntoView({ block: "start" }); } break;
      case "set-theme": { if (!themeUnlocked(b.dataset.val)) break; state.settings.theme = b.dataset.val; Sound.play("tap"); persist(); render(); break; }
      case "set-panel": { if (!panelUnlocked(b.dataset.val)) break; state.settings.panel = b.dataset.val; Sound.play("tap"); persist(); render(); break; }
      case "toggle-sound": { state.settings.sound = !(state.settings.sound !== false); if (state.settings.sound) Sound.play("coin"); persist(); render(); break; }
      case "toggle-haptics": { state.settings.haptics = state.settings.haptics === false; if (state.settings.haptics) buzz(30); persist(); render(); break; }
      case "ap-set": { const ap = appearance(); ap[b.dataset.key] = +b.dataset.val; persist(); render(); break; }
      case "ap-frame": { if (!frameUnlocked(b.dataset.val)) break; appearance().frame = b.dataset.val; Sound.play("tap"); persist(); render(); break; }
      case "ap-bg": { if (!bdUnlocked(b.dataset.val)) break; appearance().bg = b.dataset.val; persist(); render(); break; }
      case "ap-random": {
        const ap = appearance(), r = n => Math.floor(Math.random() * n);
        Object.assign(ap, { skin: r(SKINS.length), hairStyle: r(HAIR_STYLES.length), hairColor: r(HAIR_COLORS.length), eyes: r(EYE_COLORS.length), eyeStyle: r(EYE_NAMES.length), mouth: r(MOUTH_NAMES.length), cheeks: r(CHEEKS.length), shirt: r(classClothN()), pants: r(classClothN()) });
        persist(); render(); break;
      }
      case "portrait": savePortrait(); break;
      case "backup-copy": {
        const code = backupCode(), out = document.getElementById("backup-out");
        const showBox = () => { if (out) { out.innerHTML = `<textarea class="input backup-box" id="backup-text" rows="4" readonly>${esc(code)}</textarea><div class="hint">Select all and copy this code.</div>`; const t = document.getElementById("backup-text"); t.focus(); t.select(); } };
        try { navigator.clipboard.writeText(code).then(() => toast("Backup code copied. Paste it into Restore on your other device."), showBox); } catch (e2) { showBox(); }
        break;
      }
      case "restore-open": restoreOpen = !restoreOpen; restorePending = null; render(); break;
      case "restore-cancel": restorePending = null; restoreOpen = false; render(); break;
      case "restore-check": {
        const el = document.getElementById("restore-input"), err = document.getElementById("restore-err");
        try { restorePending = readBackup(el ? el.value : ""); render(); }
        catch (e2) { if (err) err.textContent = e2.message || "That code couldn't be read."; }
        break;
      }
      case "restore-confirm": {
        if (!restorePending) break;
        state = Object.assign(blank(), restorePending); migrate();
        if (state.timer && !skillById(state.timer.skillId)) state.timer = null;
        restorePending = null; restoreOpen = false; sample = false;
        persist(); render(); toast(`Restored ${esc(state.heroName || "your hero")}.`);
        break;
      }
      case "suggest-tip": openFeedback("tip", id); break;
      case "vote": {
        const sk = skillById(id), key = b.dataset.key, v = b.dataset.v;
        state.tipVotes[key] = v; persist(); render();
        const [set, tier, idx] = key.split(":");
        const text = TIPS[set] && TIPS[set][+tier] ? TIPS[set][+tier][+idx] || "" : "";
        submit({ kind: "tip-vote", vote: v, tipSet: set, tier: TIERS[+tier].name, skill: sk ? sk.name : "", text });
        break;
      }
      case "tip-next": {
        const c = tipCursor[id] || (tipCursor[id] = { cur: 0, ref: 0 });
        c[b.dataset.which === "ref" ? "ref" : "cur"] += 1; render(); break;
      }
      case "vet-edit": editVet = id; render(); { const el = document.getElementById("vet-input"); if (el) el.focus(); } break;
      case "vet-cancel": editVet = null; render(); break;
      case "vet-save": {
        const sk = skillById(id), el = document.getElementById("vet-input"), h = el ? +el.value || 0 : 0;
        if (!sk) break;
        if (h < 0 || h > 20000) { toast("Veteran hours must be between 0 and 20,000."); break; }
        sk.importedMin = Math.round(h * 60); editVet = null;
        toast(h >= 1 ? `${esc(sk.name)} veteran hours set to ${h.toLocaleString()}.` : `Veteran hours removed from ${esc(sk.name)}.`);
        persist(); render(); break;
      }
      case "sample": sample = true; state = sampleState(); setPill("Example, not saved"); render(); break;
      case "leave-sample": sample = false; state = blank(); pick = new Map(); load().then(render); break;
      case "pick-cat": savePickerInputs(); browseCat = b.dataset.cat; rerenderPicker(); break;
      case "pick-skill": {
        savePickerInputs();
        const n = b.dataset.name, c = catById(browseCat);
        const p = PRESETS.find(x => x.name === n && x.catId === c.id);
        const entry = p ? { catId: p.catId, cat: p.cat, tips: p.tips } : { catId: c.id, cat: c.path, tips: c.tips };
        if (inPicker() === "add") addSel = addSel && addSel.name === n ? null : Object.assign({ name: n }, entry);
        else if (pick.has(n)) pick.delete(n); else pick.set(n, Object.assign({ prior: "" }, entry));
        rerenderPicker(); break;
      }
      case "pick-custom": {
        const inp = document.getElementById("pick-custom"), n = inp.value.trim().replace(/\s+/g, " ");
        const c = catById(browseCat);
        if (!n) { pickerErr(`Type the ${c.noun} name first.`); break; }
        if (state.skills.some(s => s.name.toLowerCase() === n.toLowerCase())) { pickerErr(`You already track ${n}.`); break; }
        savePickerInputs();
        const p = PRESETS.find(x => x.name.toLowerCase() === n.toLowerCase());
        const entry = p ? { catId: p.catId, cat: p.cat, tips: p.tips } : { catId: c.id, cat: c.path, tips: c.tips };
        const name = p ? p.name : n;
        if (p) browseCat = p.catId;
        if (inPicker() === "add") addSel = Object.assign({ name }, entry);
        else if ([...pick.keys()].some(k => k.toLowerCase() === name.toLowerCase())) { pickerErr(`${name} is already picked.`); break; }
        else pick.set(name, Object.assign({ prior: "" }, entry));
        rerenderPicker(); break;
      }
      case "ob-start": {
        syncPriors(); keepName();
        const bad = [...pick.values()].some(v => v.prior !== "" && (+v.prior < 0 || +v.prior > 20000));
        if (bad) { document.getElementById("ob-err").textContent = "Veteran hours must be between 0 and 20,000."; break; }
        state = blank(); state.heroName = obName;
        pick.forEach((v, n) => addSkill(n, v.catId, v.cat, v.tips, (+v.prior || 0) * 60, v.disc));
        pick = new Map();
        tab = "hero";
        persist(); render();
        toast("Your hero is ready. Give them a look, then start a timer to earn your first XP.");
        break;
      }
    }
  }
  let obName = "";
  function keepName() { const el = document.getElementById("ob-name"); if (el) { obName = el.value.trim(); state.heroName = obName; } }
  function syncPriors() { document.querySelectorAll("[data-prior]").forEach(el => { const v = pick.get(el.dataset.prior); if (v) v.prior = el.value; }); }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && celebrateView) { closeCelebrate(); return; }
    if (e.target.id === "vet-input" && e.key === "Enter") { e.preventDefault(); const btn = document.querySelector('[data-act="vet-save"]'); if (btn) btn.click(); return; }
    if (e.target.id === "pick-custom" && e.key === "Enter") { e.preventDefault(); const btn = document.querySelector('[data-act="pick-custom"]'); if (btn) btn.click(); return; }
    if (e.target.id === "name-input" && (e.key === "Enter" || e.key === "Escape")) {
      if (e.key === "Enter") commitName(e.target.value); else { editingName = false; render(); }
    }
  });
  document.addEventListener("focusout", e => { if (e.target.id === "name-input" && editingName) commitName(e.target.value); });
  function commitName(v) { editingName = false; v = v.trim(); if (v !== state.heroName) { state.heroName = v; persist(); } render(); }

  setInterval(liveTick, 1000);

  // ---------- Mobile app bridge ----------
  // A native shell (Capacitor, React Native WebView, or a Swift/Kotlin WebView) hosts this UI and
  // mirrors widgetSnapshot() into the OS widget (WidgetKit on iOS, Glance on Android).
  // Outbound: every state change posts {type:"widget", payload} to whichever native channel exists.
  // Inbound: native code calls window.LevelUp.* (e.g. when the widget's Quick start button fires a deep link).
  const listeners = new Set();
  let lastWidgetJson = null, lastWidgetLook = null;
  function notifyNative() {
    const msg = { type: "widget", payload: widgetSnapshot() };
    try { window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.levelup && window.webkit.messageHandlers.levelup.postMessage(msg); } catch (e) {}
    try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(msg)); } catch (e) {}
    try { window.LevelUpAndroid && window.LevelUpAndroid.postMessage(JSON.stringify(msg)); } catch (e) {}
    try {
      const W = isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.LevelUpWidget;
      if (W) {
        const json = JSON.stringify(msg.payload);
        const lookKey = JSON.stringify(heroLook());
        const arg = {};
        if (json !== lastWidgetJson) arg.json = json;
        if (lookKey !== lastWidgetLook) { arg.portrait = window.LevelUp.portrait().split(",")[1]; }
        if (arg.json || arg.portrait) { lastWidgetJson = json; lastWidgetLook = lookKey; W.update(arg).catch(() => {}); }
      }
    } catch (e) {}
    listeners.forEach(fn => { try { fn(msg.payload); } catch (e) {} });
  }
  const baseRender = render;
  render = function () {
    try { applyTheme(); } catch (e) {}
    baseRender();
    try { paintPixels(); } catch (e) { console.error(e); }
    try { const cv = document.getElementById("battle"); if (cv && bt) updateBattleUI(); else if (cv && runView) paintOutro(cv, runView);
      if (document.getElementById("advmap")) { const a = adv(); if (!seenGet()[a.y * AW + a.x]) { reveal(a.x, a.y, 4); seenSave(); } paintMap(); } } catch (e) { console.error(e); }
    try { paintQR(); } catch (e) {}
    if (lastGain) {
      const card = document.querySelector(`[data-skill="${lastGain.skillId}"]`);
      if (card) { const fl = document.createElement("span"); fl.className = "float-xp px-title"; fl.textContent = "+" + fmtXp(lastGain.xp) + " XP"; card.appendChild(fl); card.querySelector(".xp")?.classList.add("gain"); setTimeout(() => fl.remove(), 1800); }
      lastGain = null;
    }
    if (!sample) notifyNative();
  };

  window.LevelUp = Object.freeze({
    version: 1,
    snapshot: () => widgetSnapshot(),
    portrait: () => { const c = document.createElement("canvas"); paintGrid(c, renderHero(heroLook()), { scale: 8, crop: [3, 0, 26, 26], pad: 3, bg: appearance().bg, border: frameKey() }); return c.toDataURL("image/png"); },
    quickStart: (skillId, type = "solo") => { const s = skillId ? skillById(skillId) : quickTarget(); if (s && !state.timer) startTimer(s.id, type); return widgetSnapshot(); },
    stop: () => { stopTimer(); return widgetSnapshot(); },
    log: (skillId, minutes, daysBack = 0, note = "", type = "solo") => {
      if (!skillById(skillId)) throw new Error("Unknown skill id");
      if (!(minutes >= 1 && minutes <= MAX_ENTRY)) throw new Error("Minutes must be 1–720");
      logMinutes(skillId, minutes, daysAgo(Math.max(0, Math.min(2, daysBack))), note, type);
      return widgetSnapshot();
    },
    skills: () => state.skills.map(s => ({ id: s.id, name: s.name, level: lvFrom(totalXp(s)), path: s.cat })),
    onChange: fn => { listeners.add(fn); return () => listeners.delete(fn); }
  });

  // Deep links: the widget opens the app at #quickstart, #stop or #log.
  let pendingLaunch = null;
  function handleHash() {
    const h = (location.hash || "").slice(1);
    if (!h || !state.skills.length || sample) return;
    if (h === "quickstart") { const s = quickTarget(); if (s && !state.timer) openStart(s.id); }
    else if (h === "quickstart-solo") window.LevelUp.quickStart(null, "solo");
    else if (h === "quickstart-lesson") window.LevelUp.quickStart(null, "lesson");
    else if (h === "stop") window.LevelUp.stop();
    else if (h === "log") openLog();
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
  window.addEventListener("hashchange", handleHash);
  function routeLink(url) {
    const m = String(url || "").match(/^levelup:\/\/([a-z-]+)/i); if (!m) return;
    const action = m[1].toLowerCase();
    if (action === "open") return;
    if (!state.skills.length) return;
    location.hash = "#" + action; setTimeout(handleHash, 0);
  }
  if (isNative && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    const App = window.Capacitor.Plugins.App;
    try { App.addListener("appUrlOpen", e => routeLink(e && e.url)); } catch (e) {}
    try { App.addListener("appStateChange", st => { if (st && !st.isActive) flushSave(); }); } catch (e) {}
    pendingLaunch = App.getLaunchUrl ? App.getLaunchUrl().then(r => r && r.url).catch(() => null) : null;
  }

  // Live updates: hand the current state to the next version of the page so a publish never drops progress.
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") {
    try { hot.snapshot(() => ({ state: sample ? null : JSON.parse(JSON.stringify(state)), tab })); } catch (e) {}
  }
  function start(hotData) {
    load().then(() => {
      if (hotData && hotData.state && Array.isArray(hotData.state.skills) && hotData.state.skills.length) {
        state = Object.assign(blank(), hotData.state); migrate();
        if (hotData.tab) tab = hotData.tab;
        persist();
      }
      render(); handleHash();
      if (pendingLaunch) pendingLaunch.then(u => { if (u) routeLink(u); });
      if (state.skills.length && !sample) { persist(); render(); }
      if (state.battle) { state.keysUsed = Math.max(0, state.keysUsed - 1); delete state.battle; persist(); render(); toast("Your last battle was interrupted, so its key is back."); }
      try {
        localStorage.removeItem("levelup.shell.trying");
        const from = localStorage.getItem("levelup.updatedFrom");
        if (from) { localStorage.removeItem("levelup.updatedFrom"); if (from !== BUILD) toast(`Level UP updated to v${esc(APP_VERSION)}.`, "", 4000); }
      } catch (e) {}
      if (Updater.canUpdate() && Updater.auto()) setTimeout(() => Updater.check(false), 2500);
    });
  }
  if (hot && typeof hot.ready === "function") { try { hot.ready(start); } catch (e) { start({}); } }
  else start((hot && hot.data) || {});
})();
</script>
