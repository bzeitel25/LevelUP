name: Android app

# Builds the Level UP Android app (with home-screen widgets) on every push to main
# and publishes it at a fixed download link:
# https://github.com/bzeitel25/LevelUP/releases/download/android/LevelUP.apk
on:
  push:
    branches: [main]
    paths: ["docs/**", "mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME is set).
      # Gradle downloads any missing SDK platform on its own once licenses are accepted.
      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the Android project
        working-directory: mobile
        run: |
          npm ci
          node scripts/sync-www.mjs
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Compile the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LevelUP.apk"

      - name: Publish to the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'const APP_VERSION = "[^"]*"' docs/index.html | cut -d'"' -f2)
          NOTES="Level UP $VERSION for Android (build ${{ github.run_number }}). Open this page on your phone, download LevelUP.apk and install it. To update, install the new download over the old app; your hero stays."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android LevelUP.apk --clobber
            gh release edit android --title "Level UP for Android ($VERSION)" --notes "$NOTES"
          else
            gh release create android LevelUP.apk --title "Level UP for Android ($VERSION)" --notes "$NOTES" --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LevelUP-android
          path: LevelUP.apk
