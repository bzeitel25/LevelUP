    if (min < 60) return min + "m";
    const h = Math.floor(min / 60), r = min % 60;
    return r ? `${h.toLocaleString()}h ${r}m` : `${h.toLocaleString()}h`;
  }
  const fmtXp = n => Math.round(n).toLocaleString();
  const fmtH = min => (min / 60 >= 100 ? Math.round(min / 60).toLocaleString() : (Math.round(min / 6) / 10).toLocaleString()) + "h";
  const pad = n => String(n).padStart(2, "0");
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dayKey(d); };
  const dayNum = k => { const [y, m, d] = k.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function dayLabel(k) {
    const diff = dayNum(dayKey()) - dayNum(k);
    if (diff === 0) return "Today"; if (diff === 1) return "Yesterday";
    const [y, m, d] = k.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  // ---------- State ----------
  const blank = () => ({ v: 1, heroName: "", skills: [], sessions: [], gold: 0, keyShards: 0, keysUsed: 0, owned: {}, equipped: {}, trophies: {}, runs: [], tipVotes: {}, submissions: [], restedPool: 0, lastSessionDay: null, timer: null });
  let state = blank();
  let sample = false;
  let open = null;                 // expanded skill id
  let editingName = false;
  let editVet = null;
  let tab = "train";
  try { const t = localStorage.getItem("levelup.tab"); if (t === "gear" || t === "dungeons" || t === "settings") tab = t; } catch (e) {}
  let confirm = null;              // { kind, id } for inline confirmations
  let pick = new Map();            // onboarding selections: name -> {cat, tips, prior}

  // ---------- Persistence ----------
  const LS_KEY = "levelup.hero.v1";
  let mode = "none", ref = null, dbh = null, saveTimer = null, chain = Promise.resolve();
  const pill = document.getElementById("save-pill");
  function setPill(text, warn) { pill.textContent = text; pill.classList.toggle("warn", !!warn); }

  async function load() {
    let db = null, user = null, id = null;
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use("db");
        user = await window.claude.use("user");
        id = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    if (db && id) {
      try {
        ref = db.collection("data/users/" + id).doc("hero"); dbh = db;
        const snap = await ref.get();
        if (snap.exists) { state = Object.assign(blank(), snap.data()); migrate(); }
        mode = "cloud"; setPill("Saved to your account");
        return;
      } catch (e) { ref = null; }
    }
    try { const raw = localStorage.getItem(LS_KEY); if (raw) { state = Object.assign(blank(), JSON.parse(raw)); migrate(); } mode = "local"; setPill("Saved on this device"); }
    catch (e) { mode = "none"; setPill("Not saving: storage is blocked here", true); }
  }

  // Saves go out right away (one at a time, newest state wins) so nothing is lost if the page
  // reloads, for example when an update is published while the app is open.
  let dirty = false, saving = false, failToastShown = false;
  function persist() {
    if (sample) return;
    dirty = true;
    if (mode !== "none") setPill("Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 0);
  }
  function flushSave() {
    if (!dirty || saving) return;
    dirty = false; saving = true;
    const data = JSON.parse(JSON.stringify(state));
    chain = chain.then(async () => {
      if (mode === "cloud") {
        try { await ref.set(data); if (!dirty) setPill("Saved to your account"); failToastShown = false; }
        catch (e) {
          dirty = true;
          setPill("Couldn't save. Retrying when you make your next change.", true);
          if (!failToastShown) { failToastShown = true; toast(`Couldn't save to your account${e && e.code ? " (" + esc(e.code) + ")" : ""}. Your progress is still on screen.`); }
        }
      } else if (mode === "local") {
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); if (!dirty) setPill("Saved on this device"); }
        catch (e) { setPill("Couldn't save on this device", true); }
      }
    }).finally(() => { saving = false; if (dirty) flushSave(); });
  }
  window.addEventListener("pagehide", flushSave);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSave(); });

  // Older saves had no category; place each skill in the best-matching one.
  function migrate() {
    state.skills.forEach(s => {
      if (!PATHS[s.cat]) s.cat = "life";
      if (s.earnedXp == null) s.earnedXp = s.earnedMin;
      if (!s.catId || !CATEGORIES.some(c => c.id === s.catId)) {
        const p = PRESETS.find(x => x.name.toLowerCase() === s.name.toLowerCase());
        s.catId = p ? p.catId : (PATH_HOME[s.cat] || "life");
      }
    });
    state.sessions.forEach(x => {
      if (x.xp == null) x.xp = x.min;
      if (!x.type) x.type = "solo";
      if (x.rested == null) x.rested = 0;
    });
    if (state.sessions.some(x => x.shards == null)) {
      const byDay = {};
      [...state.sessions].sort((a, b) => a.ts - b.ts).forEach(x => {
        if (x.shards == null) { const used = byDay[x.day] || 0; x.shards = Math.max(0, Math.min(x.min, DAILY_SHARD_CAP - used)); }
        byDay[x.day] = (byDay[x.day] || 0) + x.shards;
      });
      state.keyShards = state.sessions.reduce((n, x) => n + x.shards, 0);
    }
    if (state.keyShards == null) state.keyShards = 0;
    if (state.keysUsed == null) state.keysUsed = 0;
    ["owned", "equipped", "trophies", "tipVotes"].forEach(k => { if (!state[k] || typeof state[k] !== "object") state[k] = {}; });
    if (!Array.isArray(state.runs)) state.runs = [];
    if (!Array.isArray(state.submissions)) state.submissions = [];
  }

  // ---------- Derived ----------
  function restedNow() {
    if (!state.lastSessionDay) return Math.min(REST_CAP, state.restedPool);
    const idle = Math.max(0, dayNum(dayKey()) - dayNum(state.lastSessionDay) - 1);
    return Math.min(REST_CAP, state.restedPool + idle * REST_PER_DAY);
  }
  function heroClass() {
    const by = {};
    state.skills.forEach(s => { by[s.cat] = (by[s.cat] || 0) + totalXp(s); });
    const ranked = Object.entries(by).filter(([, m]) => m > 0).sort((a, b) => b[1] - a[1]);
    if (!ranked.length) return { name: "Wanderer", paths: [] };
    const [a, b] = ranked;
    if (b && b[1] >= a[1] * 0.4) return { name: HYBRIDS[[a[0], b[0]].sort().join("+")], paths: [a[0], b[0]] };
    return { name: PATHS[a[0]].cls, paths: [a[0]] };
  }
  // Dungeon keys: earned from real practice minutes only (never prior hours), capped per day.
  const keysAvail = () => Math.floor(state.keyShards / SHARDS_PER_KEY) - state.keysUsed;
  const shardRem = () => state.keyShards % SHARDS_PER_KEY;
  const shardsOnDay = day => state.sessions.filter(x => x.day === day).reduce((n, x) => n + (x.shards || 0), 0);
  const earnedLv = s => lvFrom(totalXp(s));
  function gearFor(s) {
    const names = GEAR_BY_SKILL[s.name] || GEAR_BY_CAT[s.catId] || GEAR_BY_CAT.life;
    return GEAR_TIERS.map((t, i) => Object.assign({ id: s.id + ":" + i, tier: i, name: names[i].replace("{s}", s.name), skill: s }, t));
  }
  function equippedItem(s) { const id = state.equipped[s.id]; return id ? gearFor(s).find(g => g.id === id) : null; }
  function heroStats() {
    const base = {}, gear = {};
    Object.keys(STATS).forEach(k => { base[k] = 0; gear[k] = 0; });
    state.skills.forEach(s => { base[s.cat] += lvFrom(totalXp(s)); const it = equippedItem(s); if (it) gear[s.cat] += it.bonus; });
    const total = {}; Object.keys(STATS).forEach(k => total[k] = base[k] + gear[k]);
    return { base, gear, total, power: Object.values(total).reduce((a, b) => a + b, 0) };
  }
  const fortunePct = st => Math.min(50, st.total.life);
  const chanceFor = (d, power) => Math.max(0.1, Math.min(0.97, 0.35 + 0.5 * (power / d.rec)));
  const dungeonOpen = (d, power) => d.rec <= 5 || power >= d.rec * 0.5;

  const pipsHTML = n => `<span class="pips" aria-label="${n} of 10 key shards">${Array.from({ length: SHARDS_PER_KEY - 1 }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;

  const totalLevel = () => state.skills.reduce((n, s) => n + lvFrom(totalXp(s)), 0);
  const todayMin = () => state.sessions.filter(x => x.day === dayKey()).reduce((n, x) => n + x.min, 0);
  const skillById = id => state.skills.find(s => s.id === id);

  // ---------- Actions ----------
  function addSkill(name, catId, cat, tips, priorMin) {
    state.skills.push({ id: uid(), name, catId, cat, tips: tips || "generic", importedMin: Math.max(0, Math.round(priorMin || 0)), earnedMin: 0, earnedXp: 0, created: dayKey() });
  }

  function logMinutes(skillId, min, day, note, type) {
    const s = skillById(skillId); if (!s) return;
    min = Math.round(min);
    type = type === "lesson" ? "lesson" : "solo";
    const before = lvFrom(totalXp(s)), beforeTier = tierIdx(before), beforeStars = stars(totalXp(s));
    const keysBefore = keysAvail();
    const pool = restedNow();
    const rested = Math.min(min, pool);                      // rested minutes earn double base XP
    const xp = Math.round(min * (type === "lesson" ? LESSON_MULT : 1) + rested);
    state.restedPool = pool - rested;
    state.lastSessionDay = dayKey();
    s.earnedMin += min;
    s.earnedXp = (s.earnedXp ?? 0) + xp;
    const shards = Math.max(0, Math.min(min, DAILY_SHARD_CAP - shardsOnDay(day)));
    state.keyShards += shards;
    state.sessions.unshift({ id: uid(), skillId, min, day, ts: Date.now(), xp, rested, type, shards, note: note || "" });
    if (state.sessions.length > 400) state.sessions.length = 400;

    const after = lvFrom(totalXp(s));
    if (after > before) toast(`<b>DING!</b>${esc(s.name)} reached Lv ${after}`, "ding", 4200);
    if (tierIdx(after) > beforeTier) toast(`New tier: ${TIERS[tierIdx(after)].name}. A new ${esc(s.name)} tip is unlocked.`);
    if (stars(totalXp(s)) > beforeStars) toast(`Mastery star earned in ${esc(s.name)}.`);
    const parts = [type === "lesson" ? "lesson 1.5×" : "", rested ? `${fmt(rested)} rested` : ""].filter(Boolean);
    const newKeys = keysAvail() - keysBefore;
    toast(`Logged ${fmt(min)} of ${esc(s.name)}: +${fmtXp(xp)} XP${parts.length ? " (" + parts.join(", ") + ")" : ""}, +${shards} shards` + (newKeys > 0 ? `, ${newKeys} new dungeon key${newKeys > 1 ? "s" : ""}` : "") + (shards < min ? ". Daily key limit reached; XP still counts" : "") + ".");
    persist(); render();
  }

  function deleteSession(id) {
    const i = state.sessions.findIndex(x => x.id === id); if (i < 0) return;
    const x = state.sessions[i], s = skillById(x.skillId);
    if (s) { s.earnedMin = Math.max(0, s.earnedMin - x.min); s.earnedXp = Math.max(0, (s.earnedXp ?? 0) - (x.xp ?? x.min)); }
    if (x.rested) state.restedPool = Math.min(REST_CAP, state.restedPool + x.rested);
    state.keyShards = Math.max(state.keysUsed * SHARDS_PER_KEY, state.keyShards - (x.shards || 0));
    state.sessions.splice(i, 1);
    toast("Session removed.");
    persist(); render();
  }

  function buyItem(id) {
    const [sid] = id.split(":"); const s = skillById(sid); if (!s) return;
    const it = gearFor(s).find(g => g.id === id); if (!it || state.owned[id]) return;
    if (earnedLv(s) < it.lv) { toast(`${esc(it.name)} needs ${esc(s.name)} Lv ${it.lv}.`); return; }
    if (state.gold < it.price) { toast(`You need ${it.price - state.gold} more gold. Run a dungeon to earn it.`); return; }
    state.gold -= it.price; state.owned[id] = true;
    const cur = equippedItem(s);
    if (!cur || cur.bonus < it.bonus) state.equipped[s.id] = id;
    toast(`Bought ${esc(it.name)}${state.equipped[s.id] === id ? " and equipped it" : ""}. +${it.bonus} ${STATS[s.cat].name}.`);
    persist(); render();
  }
  function equipItem(id) {
    const [sid] = id.split(":"); if (!state.owned[id] || !skillById(sid)) return;
    state.equipped[sid] = id; persist(); render();
  }

  let runView = null, runTimer = null;
  function runDungeon(did) {
    const d = DUNGEONS.find(x => x.id === did); if (!d || runView && runView.step < 4) return;
    if (keysAvail() < 1) { toast("No keys yet. Practice 10 minutes to earn one."); return; }
    const st = heroStats();
    if (!dungeonOpen(d, st.power)) return;
    const chance = chanceFor(d, st.power), win = Math.random() < chance;
    const weights = Object.entries(st.total).filter(([, v]) => v > 0);
    const pickStat = () => { if (!weights.length) return "body"; let r = Math.random() * weights.reduce((n, [, v]) => n + v, 0); for (const [k, v] of weights) { if ((r -= v) <= 0) return k; } return weights[0][0]; };
    const encounters = [0, 1, 2].map(() => { const k = pickStat(); const lines = ENCOUNTERS[k]; return { stat: k, value: st.total[k], text: lines[Math.floor(Math.random() * lines.length)] }; });
    const roll = d.gold[0] + Math.random() * (d.gold[1] - d.gold[0]);
    const gold = Math.round((win ? roll : d.gold[0] * 0.3) * (1 + fortunePct(st) / 100));
    const trophy = win && Math.random() < 0.1 ? d.trophy : null;
    state.keysUsed += 1; state.gold += gold;
    if (trophy) state.trophies[d.id] = (state.trophies[d.id] || 0) + 1;
    state.runs.unshift({ id: uid(), dungeon: d.id, win, gold, trophy, day: dayKey(), ts: Date.now() });
    if (state.runs.length > 30) state.runs.length = 30;
    persist();
    runView = { d, win, gold, trophy, encounters, chance, fortune: fortunePct(st), step: 0 };
    clearInterval(runTimer);
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { runView.step = 4; render(); return; }
    render();
    runTimer = setInterval(() => { runView.step += 1; render(); if (runView.step >= 4) clearInterval(runTimer); }, 750);
  }

  function removeSkill(id) {
    const s = skillById(id);
    state.skills = state.skills.filter(k => k.id !== id);
    state.sessions = state.sessions.filter(x => x.skillId !== id);
    if (state.timer && state.timer.skillId === id) state.timer = null;
    if (open === id) open = null;
    toast(`${esc(s ? s.name : "Skill")} removed.`);
    persist(); render();
  }

  function startTimer(id, type) { state.timer = { skillId: id, startedAt: Date.now(), type: type === "lesson" ? "lesson" : "solo" }; persist(); render(); }
  function stopTimer() {
    const t = state.timer; if (!t) return;
    const secs = (Date.now() - t.startedAt) / 1000;
    state.timer = null;
    if (secs < 60) { toast("Under a minute, so nothing was logged. Practice is counted in whole minutes."); persist(); render(); return; }
    let min = Math.floor(secs / 60);
    if (min > MAX_ENTRY) { min = MAX_ENTRY; toast("Timer ran past 12 hours, so it was capped at 12h. Edit with a manual log if needed."); }
    logMinutes(t.skillId, min, dayKey(), "", t.type);
  }

  // ---------- Rendering ----------
  const app = document.getElementById("app");
  const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></svg>';
  const STOP = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect fill="currentColor" x="6" y="6" width="12" height="12" rx="1"/></svg>';

  function render() {
    if (!state.skills.length && !sample) { renderOnboarding(); return; }
    const cls = heroClass();
    const rested = restedNow();
    const name = state.heroName || "Unnamed hero";
    const earnedAll = state.skills.reduce((n, s) => n + s.earnedMin, 0);

    app.innerHTML = `
      ${sample ? `<div class="banner"><span>Example hero, not your data. Changes here aren't saved.</span><button class="btn small" data-act="leave-sample">Create my own hero</button></div>` : ""}
      ${renderTraining()}
      <div class="grid">
        <aside class="panel sheet" aria-label="Character sheet">
          <div class="who">
            <div class="emblem" aria-hidden="true">${esc(cls.name[0])}</div>
            <div class="who-text">
              ${editingName
                ? `<input class="input" id="name-input" maxlength="30" value="${esc(state.heroName)}" placeholder="Hero name" aria-label="Hero name">`
                : `<div class="hero-name">${esc(name)} <button class="linkbtn" style="font-size:12px" data-act="edit-name">Rename</button></div>`}
              <div class="class-title">${esc(cls.name)}</div>
              <div class="paths">${cls.paths.length ? cls.paths.map(p => PATHS[p].label).join(" + ") + " path" : "Log time to discover your class"}</div>
              ${(() => { const v = state.skills.filter(k => k.importedMin >= 60); return v.length ? `<div class="paths" style="margin-top:4px">${vetBadge(v.reduce((n, k) => n + k.importedMin, 0), true)}</div>` : ""; })()}
            </div>
          </div>
          <div class="stats">
            <div class="stat"><b class="num">${totalLevel()}</b><span>Total level</span></div>
            <div class="stat"><b class="num">${fmtH(earnedAll)}</b><span>Practiced</span></div>
            <div class="stat"><b class="num">${state.gold.toLocaleString()}</b><span>Gold</span></div>
          </div>
          ${(() => { const st = heroStats(); return `<div>
            <div class="power"><strong>Hero power</strong><b class="num">${st.power}</b></div>
            <div class="statgrid">${Object.entries(STATS).map(([k, v]) => `<div title="${esc(v.desc)}"><span>${v.name}</span><b>${st.total[k]}${st.gear[k] ? ` <i>+${st.gear[k]}</i>` : ""}</b></div>`).join("")}</div>
            <div class="hint">Stats come from your skill levels in each path. Green numbers are gear bonuses.</div>
          </div>`; })()}
          <div>
            <div class="meter-label"><strong>Rested XP</strong><span class="num">${rested ? "next " + fmt(rested) + " earns 2× XP" : "Not rested"}</span></div>
            <div class="rest-bar"><i style="width:${(rested / REST_CAP) * 100}%"></i></div>
            <div class="hint">Each day off adds 30 minutes of double XP, up to 3 hours, so missed days don't set you back. You never lose progress.</div>
          </div>
          <div>
            <div class="meter-label"><strong>Dungeon keys</strong><span class="num muted">${shardRem()} / ${SHARDS_PER_KEY} shards</span></div>
            <div class="keys-row"><span class="keys-count num">${keysAvail()} key${keysAvail() === 1 ? "" : "s"}</span>${pipsHTML(shardRem())}</div>
            <div class="hint">Every minute of practice is a shard, and 10 shards make a key (up to 15 keys a day). Spend keys on dungeon runs to earn gold for gear.</div>
          </div>
          <div class="meter-label" style="margin:0"><span class="muted">Logged today</span><strong class="num">${fmt(todayMin())}</strong></div>
          <button class="btn primary" data-act="open-log">Log practice</button>
        </aside>

        <div class="col">
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-act="tab" data-tab="train" aria-selected="${tab === "train"}">Training</button>
            <button class="tab" role="tab" data-act="tab" data-tab="gear" aria-selected="${tab === "gear"}">Gear<span class="cnt">${state.gold.toLocaleString()}g</span></button>
            <button class="tab" role="tab" data-act="tab" data-tab="dungeons" aria-selected="${tab === "dungeons"}">Dungeons<span class="cnt">${keysAvail()} key${keysAvail() === 1 ? "" : "s"}</span></button>
            <button class="tab" role="tab" data-act="tab" data-tab="settings" aria-selected="${tab === "settings"}">Settings</button>
          </div>
          ${tab === "gear" ? renderGear() : tab === "dungeons" ? renderDungeons() : tab === "settings" ? renderSettings() : `
          <section>
            <div class="section-head"><h2>Home screen widget</h2><span class="muted" style="font-size:13px">Live preview · tap Quick start</span></div>
            <div class="wall">${renderWidget("sm")}${renderWidget("md")}</div>
          </section>
          <section>
            <div class="section-head"><h2>Skill tracks</h2><button class="btn small" data-act="open-add">+ Add skill</button></div>
            <div class="skills">${CATEGORIES.map(c => {
              const list = state.skills.filter(s => s.catId === c.id);
              return list.length ? `<div class="group"><div class="group-head">${esc(c.label)}</div>${list.map(renderSkill).join("")}</div>` : "";
            }).join("")}</div>
          </section>
          <section>
            <div class="section-head"><h2>Recent sessions</h2></div>
            <div class="panel log">${renderLog()}</div>
          </section>
          ${renderRules()}`}
        </div>
      </div>`;
    if (editingName) { const el = document.getElementById("name-input"); el.focus(); el.select(); }
  }

  // ---------- Build, install and self-update (same approach as Pocket Fertilizer) ----------
  const BUILD = "2026-10-07.1";
  const APP_VERSION = "0.1.0";
  const inClaude = !!(window.claude && window.claude.use);
  const onWeb = location.protocol.indexOf("http") === 0 && !inClaude;
  const Updater = {
    prompt: null,
    installed: (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true,
    ios: /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
    status: "",
    init() {
      window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); Updater.prompt = e; if (tab === "settings") render(); });
      window.addEventListener("appinstalled", () => { Updater.prompt = null; Updater.installed = true; toast("Installed. Level UP is on your home screen."); if (tab === "settings") render(); });
      if (onWeb && "serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    },
    label() { return Updater.prompt ? "Install on this phone" : "Check for updates"; },
    say(html, cls) { Updater.status = `<div class="note ${cls || ""}">${html}</div>`; const el = document.getElementById("upd-status"); if (el) el.innerHTML = Updater.status; },
    async go() {
      if (Updater.prompt) {
        const pr = Updater.prompt; Updater.prompt = null;
        try { pr.prompt(); const r = await pr.userChoice; toast(r.outcome === "accepted" ? "Installing…" : "Install dismissed."); }
        catch (e) { toast("Install isn't available in this browser."); }
        render(); return;
      }
      Updater.update();
    },
    async update() {
      if (!onWeb) return Updater.say("Updates work in the installed app or at the live web address. This preview always shows the newest version.", "warn");
      Updater.say('<span class="spin"></span>Checking for a newer version…');
      let latest = null;
      try {
        const r = await fetch("index.html?ts=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const m = (await r.text()).match(/const BUILD = "([^"]+)"/); latest = m ? m[1] : null;
      } catch (e) { return Updater.say("Couldn't reach the server. You may be offline. The app keeps working either way.", "warn"); }
      if (latest && latest === BUILD) {
        try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) reg.update(); } catch (e) {}
        return Updater.say(`You're on the latest version (build ${esc(BUILD)}).`, "good");
      }
      Updater.say(`<span class="spin"></span>New version ${esc(latest || "")} found. Installing…`, "good");
      await Updater.hardRefresh();
    },
    async hardRefresh() {
      try { flushSave(); await chain; } catch (e) {}
      try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { await reg.update(); if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" }); } } catch (e) {}
      try { if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } } catch (e) {}
      setTimeout(() => location.replace(location.pathname + "?u=" + Date.now()), 600);
    }
  };

  function readBackup(code) {
    const raw = String(code || "").trim().replace(/\s+/g, "");
    if (!raw.startsWith("LVUP1:")) throw new Error("That doesn't look like a Level UP backup code. It should start with LVUP1:");
    const data = JSON.parse(decodeURIComponent(escape(atob(raw.slice(6)))));
    if (!data || !Array.isArray(data.skills)) throw new Error("The backup code is incomplete. Copy the whole code and try again.");
    return data;
  }

  // ---------- Training scene ----------
  let liveLevel = null;
  function project(t) {
    const s = skillById(t.skillId);
    const el = Math.max(0, (Date.now() - t.startedAt) / 60000);
    const pool = restedNow(), rested = Math.min(el, pool);
    const xp = el * (t.type === "lesson" ? LESSON_MULT : 1) + rested;
    const shards = Math.max(0, Math.min(Math.floor(el), DAILY_SHARD_CAP - shardsOnDay(dayKey())));
    const total = totalXp(s) + xp;
    return { s, xp, rested: pool > 0 && rested < pool, p: progress(total), shards, keys: Math.floor((state.keyShards + shards) / SHARDS_PER_KEY) - state.keysUsed, rem: (state.keyShards + shards) % SHARDS_PER_KEY };
  }

  function liveTick() {
    const t = state.timer; if (!t) return;
    document.querySelectorAll("[data-elapsed]").forEach(el => { el.textContent = clock(Date.now() - t.startedAt); });
    const pj = project(t); if (!pj.s) return;
    const q = sel => document.querySelector(sel);
    if (!q("[data-live-xp]")) return;
    q("[data-live-xp]").textContent = `+${fmtXp(pj.xp)} XP`;
    q("[data-live-lv]").textContent = `Lv ${pj.p.L}`;
    q("[data-live-need]").textContent = `${fmtXp(pj.p.have)} / ${fmtXp(pj.p.need)} XP to ${pj.p.next}`;
    q("[data-live-bar]").style.width = (pj.p.pct * 100).toFixed(1) + "%";
    q("[data-live-keys]").textContent = pj.keys;
    q("[data-live-pips]").innerHTML = pipsHTML(pj.rem);
    if (liveLevel != null && pj.p.L > liveLevel) {
      liveLevel = pj.p.L;
      toast(`<b>DING!</b>${esc(pj.s.name)} Lv ${pj.p.L}`, "ding", 3800);

  function clock(ms) {

  function renderSkill(s) {

  function renderDetail(s, p, lvTi) {

      ${tipCard(s, `${TIERS[ti].name} tip${vetBoost ? " · unlocked by your Veteran badge" : ""}`, ti, curIdx, "cur", set[ti].length, false)}
      ${refPick ? tipCard(s, `Refresher · ${TIERS[refPick[0]].name}`, refPick[0], refPick[1], "ref", pool.length, true) : ""}
      ${next ? `<div class="lock">Next tip unlocks at ${next.name} (Lv ${next.min}), ${fmtXp(minFor(next.min) - tipXp)} XP away${vetBoost ? " counting your veteran hours" : ""}.</div>` : ""}
      ${tipLibrary(s, ti)}
      <div><button class="linkbtn" style="font-size:13px" data-act="suggest-tip" data-id="${s.id}">Suggest a ${esc(s.name)} tip</button></div>
      <div><div class="lbl" style="margin-bottom:6px">Milestones (in-app hours only)</div>
        <div class="ms">${MILESTONES.map(t => `<span class="${s.earnedMin >= t ? "got" : ""}">${fmtH(t)}</span>`).join("")}</div></div>
      <div class="detail-foot">

  });
  document.querySelectorAll("dialog [data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));

  // ---------- Sample hero ----------
  function sampleState() {
    const s = blank();
    s.heroName = "Example hero";
    const g = { id: "g", name: "Guitar", catId: "instrument", cat: "music", tips: "guitar", importedMin: 40 * 60, earnedMin: 0, earnedXp: 0, created: daysAgo(30) };
    const r = { id: "r", name: "Running", catId: "health", cat: "body", tips: "running", importedMin: 0, earnedMin: 0, earnedXp: 0, created: daysAgo(30) };
    const sp = { id: "sp", name: "Spanish", catId: "language", cat: "mind", tips: "language", importedMin: 0, earnedMin: 0, earnedXp: 0, created: daysAgo(20) };
    s.skills = [g, r, sp];
    const plan = [[0, "g", 30, "Worked on the F barre chord", "solo"], [0, "sp", 20, "Flashcards", "solo"], [1, "g", 45, "Weekly lesson", "lesson"], [1, "r", 30, "", "solo"],
      [3, "sp", 60, "Conversation class", "lesson"], [4, "r", 40, "", "solo"], [5, "g", 20, "", "solo"], [8, "r", 30, "", "solo"]];
    plan.reverse().forEach(([ago, id, min, note, type], i) => {
      const xp = type === "lesson" ? min * LESSON_MULT : min;
      const sk = s.skills.find(k => k.id === id); sk.earnedMin += min; sk.earnedXp += xp;
      s.sessions.unshift({ id: "x" + i, skillId: id, min, day: daysAgo(ago), ts: Date.now() - ago * 864e5, xp, rested: 0, type, shards: min, note });
    });
    [[g, 600, 720], [r, 1200, 1200], [sp, 300, 390]].forEach(([k, m, x]) => { k.earnedMin += m; k.earnedXp += x; });
    s.gold = 140; s.owned = { "g:0": true }; s.equipped = { g: "g:0" };
    s.keyShards = s.sessions.reduce((n, x) => n + x.shards, 0) + 7; s.keysUsed = 22; s.restedPool = 30; s.lastSessionDay = daysAgo(0);
    return s;
  }

  // ---------- Events ----------
  function reportError(err) {
    const msg = err && err.message ? err.message : String(err);
    try { console.error(err); } catch (e) {}
    toast(`Something went wrong: ${esc(msg).slice(0, 140)}. Please tell us with Send feedback.`, "", 7000);
  }
  window.addEventListener("error", e => reportError(e.error || e.message));
  window.addEventListener("unhandledrejection", e => reportError(e.reason));
  document.addEventListener("click", e => {
    try { handleClick(e); } catch (err) { reportError(err); try { render(); } catch (e2) {} }
  });
  function handleClick(e) {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    switch (act) {
      case "toggle": open = open === id ? null : id; confirm = null; render(); break;
      case "start-timer": openStart(id); break;
      case "start-now": if (!state.timer && skillById(id)) startTimer(id, b.dataset.type); break;
      case "start-go": dlgStart.close(); if (!state.timer && skillById(startFor)) startTimer(startFor, b.dataset.type); break;
      case "stop-timer": stopTimer(); break;
      case "ask-discard": confirm = { kind: "timer" }; render(); break;
      case "discard-timer": state.timer = null; confirm = null; toast("Session discarded."); persist(); render(); break;
      case "cancel-confirm": confirm = null; render(); break;
      case "quick": logMinutes(id, +b.dataset.min, dayKey(), ""); break;
      case "open-log": openLog(id); break;
      case "open-add": openAdd(); break;
      case "ask-remove": confirm = { kind: "skill", id }; render(); break;
      case "remove-skill": confirm = null; removeSkill(id); break;
      case "ask-session": confirm = { kind: "session", id }; render(); break;
      case "delete-session": confirm = null; deleteSession(id); break;
      case "edit-name": editingName = true; render(); break;
      case "tab": tab = b.dataset.tab; if (tab !== "dungeons" && runView && runView.step >= 4) runView = null; try { localStorage.setItem("levelup.tab", tab); } catch (e) {} render(); break;
      case "buy": buyItem(id); break;
      case "equip": equipItem(id); break;
      case "run": runDungeon(id); break;
      case "close-run": runView = null; render(); break;
      case "feedback": openFeedback("feedback"); break;
      case "upd-go": Updater.go(); break;
      case "backup-copy": {
        const code = backupCode(), out = document.getElementById("backup-out");
        const showBox = () => { if (out) { out.innerHTML = `<textarea class="input backup-box" id="backup-text" rows="4" readonly>${esc(code)}</textarea><div class="hint">Select all and copy this code.</div>`; const t = document.getElementById("backup-text"); t.focus(); t.select(); } };
        try { navigator.clipboard.writeText(code).then(() => toast("Backup code copied. Paste it into Restore on your other device."), showBox); } catch (e2) { showBox(); }
        break;
      }
      case "restore-open": restoreOpen = !restoreOpen; restorePending = null; render(); break;
      case "restore-cancel": restorePending = null; restoreOpen = false; render(); break;
      case "restore-check": {
        const el = document.getElementById("restore-input"), err = document.getElementById("restore-err");
        try { restorePending = readBackup(el ? el.value : ""); render(); }
        catch (e2) { if (err) err.textContent = e2.message || "That code couldn't be read."; }
        break;
      }
      case "restore-confirm": {
        if (!restorePending) break;
        state = Object.assign(blank(), restorePending); migrate();
        if (state.timer && !skillById(state.timer.skillId)) state.timer = null;
        restorePending = null; restoreOpen = false; sample = false;
        persist(); render(); toast(`Restored ${esc(state.heroName || "your hero")}.`);
        break;
      }
      case "suggest-tip": openFeedback("tip", id); break;
      case "vote": {
        const sk = skillById(id), key = b.dataset.key, v = b.dataset.v;
        state.tipVotes[key] = v; persist(); render();
        const [set, tier, idx] = key.split(":");
        const text = TIPS[set] && TIPS[set][+tier] ? TIPS[set][+tier][+idx] || "" : "";
        submit({ kind: "tip-vote", vote: v, tipSet: set, tier: TIERS[+tier].name, skill: sk ? sk.name : "", text });
        break;
      }
      case "tip-next": {
        const c = tipCursor[id] || (tipCursor[id] = { cur: 0, ref: 0 });
        c[b.dataset.which === "ref" ? "ref" : "cur"] += 1; render(); break;
      }
      case "vet-edit": editVet = id; render(); { const el = document.getElementById("vet-input"); if (el) el.focus(); } break;
      case "vet-cancel": editVet = null; render(); break;
      case "vet-save": {
        const sk = skillById(id), el = document.getElementById("vet-input"), h = el ? +el.value || 0 : 0;
        if (!sk) break;
        if (h < 0 || h > 20000) { toast("Veteran hours must be between 0 and 20,000."); break; }
        sk.importedMin = Math.round(h * 60); editVet = null;
        toast(h >= 1 ? `${esc(sk.name)} veteran hours set to ${h.toLocaleString()}.` : `Veteran hours removed from ${esc(sk.name)}.`);
        persist(); render(); break;
      }
      case "sample": sample = true; state = sampleState(); setPill("Example, not saved"); render(); break;
      case "leave-sample": sample = false; state = blank(); pick = new Map(); load().then(render); break;
      case "pick-cat": savePickerInputs(); browseCat = b.dataset.cat; rerenderPicker(); break;
      case "pick-skill": {
        savePickerInputs();
        const n = b.dataset.name, c = catById(browseCat);
        const p = PRESETS.find(x => x.name === n && x.catId === c.id);
        const entry = p ? { catId: p.catId, cat: p.cat, tips: p.tips } : { catId: c.id, cat: c.path, tips: c.tips };
        if (inPicker() === "add") addSel = addSel && addSel.name === n ? null : Object.assign({ name: n }, entry);
        else if (pick.has(n)) pick.delete(n); else pick.set(n, Object.assign({ prior: "" }, entry));
        rerenderPicker(); break;
      }
      case "pick-custom": {
        const inp = document.getElementById("pick-custom"), n = inp.value.trim().replace(/\s+/g, " ");
        const c = catById(browseCat);
        if (!n) { pickerErr(`Type the ${c.noun} name first.`); break; }
        if (state.skills.some(s => s.name.toLowerCase() === n.toLowerCase())) { pickerErr(`You already track ${n}.`); break; }
        savePickerInputs();
        const p = PRESETS.find(x => x.name.toLowerCase() === n.toLowerCase());
        const entry = p ? { catId: p.catId, cat: p.cat, tips: p.tips } : { catId: c.id, cat: c.path, tips: c.tips };
        const name = p ? p.name : n;
        if (p) browseCat = p.catId;
        if (inPicker() === "add") addSel = Object.assign({ name }, entry);
        else if ([...pick.keys()].some(k => k.toLowerCase() === name.toLowerCase())) { pickerErr(`${name} is already picked.`); break; }
        else pick.set(name, Object.assign({ prior: "" }, entry));
        rerenderPicker(); break;
      }
      case "ob-start": {
        syncPriors(); keepName();
        const bad = [...pick.values()].some(v => v.prior !== "" && (+v.prior < 0 || +v.prior > 20000));
        if (bad) { document.getElementById("ob-err").textContent = "Veteran hours must be between 0 and 20,000."; break; }
        state = blank(); state.heroName = obName;
        pick.forEach((v, n) => addSkill(n, v.catId, v.cat, v.tips, (+v.prior || 0) * 60));
        pick = new Map();
        persist(); render();
        toast("Your hero is ready. Start a timer to earn your first XP.");
        break;
      }
    }
  }
  let obName = "";
  function keepName() { const el = document.getElementById("ob-name"); if (el) { obName = el.value.trim(); state.heroName = obName; } }
  function syncPriors() { document.querySelectorAll("[data-prior]").forEach(el => { const v = pick.get(el.dataset.prior); if (v) v.prior = el.value; }); }

  document.addEventListener("keydown", e => {
    if (e.target.id === "vet-input" && e.key === "Enter") { e.preventDefault(); const btn = document.querySelector('[data-act="vet-save"]'); if (btn) btn.click(); return; }
    if (e.target.id === "pick-custom" && e.key === "Enter") { e.preventDefault(); const btn = document.querySelector('[data-act="pick-custom"]'); if (btn) btn.click(); return; }
    if (e.target.id === "name-input" && (e.key === "Enter" || e.key === "Escape")) {
      if (e.key === "Enter") commitName(e.target.value); else { editingName = false; render(); }
    }
  });
  document.addEventListener("focusout", e => { if (e.target.id === "name-input" && editingName) commitName(e.target.value); });
  function commitName(v) { editingName = false; v = v.trim(); if (v !== state.heroName) { state.heroName = v; persist(); } render(); }

  setInterval(liveTick, 1000);

  // ---------- Mobile app bridge ----------
  // A native shell (Capacitor, React Native WebView, or a Swift/Kotlin WebView) hosts this UI and
  // mirrors widgetSnapshot() into the OS widget (WidgetKit on iOS, Glance on Android).
  // Outbound: every state change posts {type:"widget", payload} to whichever native channel exists.
  // Inbound: native code calls window.LevelUp.* (e.g. when the widget's Quick start button fires a deep link).
  const listeners = new Set();
  function notifyNative() {
    const msg = { type: "widget", payload: widgetSnapshot() };
    try { window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.levelup && window.webkit.messageHandlers.levelup.postMessage(msg); } catch (e) {}
    try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(msg)); } catch (e) {}
    try { window.LevelUpAndroid && window.LevelUpAndroid.postMessage(JSON.stringify(msg)); } catch (e) {}
    listeners.forEach(fn => { try { fn(msg.payload); } catch (e) {} });
  }
  const baseRender = render;
  render = function () { baseRender(); if (!sample) notifyNative(); };

  window.LevelUp = Object.freeze({
    version: 1,
    snapshot: () => widgetSnapshot(),
    quickStart: (skillId, type = "solo") => { const s = skillId ? skillById(skillId) : quickTarget(); if (s && !state.timer) startTimer(s.id, type); return widgetSnapshot(); },
    stop: () => { stopTimer(); return widgetSnapshot(); },
    log: (skillId, minutes, daysBack = 0, note = "", type = "solo") => {
      if (!skillById(skillId)) throw new Error("Unknown skill id");
      if (!(minutes >= 1 && minutes <= MAX_ENTRY)) throw new Error("Minutes must be 1–720");
      logMinutes(skillId, minutes, daysAgo(Math.max(0, Math.min(2, daysBack))), note, type);
      return widgetSnapshot();
    },
    skills: () => state.skills.map(s => ({ id: s.id, name: s.name, level: lvFrom(totalXp(s)), path: s.cat })),
    onChange: fn => { listeners.add(fn); return () => listeners.delete(fn); }
  });

  // Deep links: the widget opens the app at #quickstart, #stop or #log.
  function handleHash() {
    const h = (location.hash || "").slice(1);
    if (!h || !state.skills.length || sample) return;
    if (h === "quickstart") { const s = quickTarget(); if (s && !state.timer) openStart(s.id); }
    else if (h === "quickstart-solo") window.LevelUp.quickStart(null, "solo");
    else if (h === "quickstart-lesson") window.LevelUp.quickStart(null, "lesson");
    else if (h === "stop") window.LevelUp.stop();
    else if (h === "log") openLog();
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
  window.addEventListener("hashchange", handleHash);

  // Live updates: hand the current state to the next version of the page so a publish never drops progress.
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") {
    try { hot.snapshot(() => ({ state: sample ? null : JSON.parse(JSON.stringify(state)), tab })); } catch (e) {}
  }
  function start(hotData) {
    load().then(() => {
      if (hotData && hotData.state && Array.isArray(hotData.state.skills) && hotData.state.skills.length) {
        state = Object.assign(blank(), hotData.state); migrate();
        if (hotData.tab) tab = hotData.tab;
        persist();
      }
      render(); handleHash();
    });
  }
  if (hot && typeof hot.ready === "function") { try { hot.ready(start); } catch (e) { start({}); } }
  else start((hot && hot.data) || {});
})();
</script>

</body>
