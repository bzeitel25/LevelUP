  // Reviewed for accuracy; safety tips come first for trades and sports. Category sets cover custom skills.
  const TIP_DATA = {"sets": {"art": [["Make something small every day. Volume builds skill.", "Keep a sketchbook or folder of everything you make.", "Don't wait for perfect materials. Start with what you have."], ["Pick one specific thing to improve each session.", "Study work you admire and ask what makes it effective.", "Use references. Even professionals rely on them."], ["Learn the basics of composition, like balance and focal point.", "Finish pieces even when they're not going well.", "Share your work with a supportive group for feedback."], ["Copy a master's work to study their decisions.", "Try a new medium or technique to stretch yourself.", "Set a small project with a deadline."], ["Work in a series. Several pieces on one theme reveal your voice.", "Ask for honest critique from experienced artists.", "Compare your recent work to pieces from months ago."], ["Develop your own style by combining influences.", "Show your work in public, online or in person.", "Teach a technique to deepen your understanding."], ["Take on an ambitious, long-term project.", "Mentor a beginner.", "Keep experimenting so your work keeps growing."]], "drawing": [["Draw basic shapes like boxes, spheres and cylinders. Most objects are built from them.", "Draw from life, not just photos, to train your eye."], ["Do 30-second gesture drawings to catch movement before detail.", "Draw lightly at first, then darken lines you're sure about."], ["Squint at your reference to see light and shadow as a few simple shapes.", "Practice one- and two-point perspective."], ["Copy a master's drawing. Copying teaches decisions you wouldn't think to make.", "Study basic anatomy if you draw people."], ["Draw from memory, then check the reference.", "Work on a full illustration with background and lighting."], ["Develop a consistent personal style.", "Fill a sketchbook on a single theme."], ["Work in a series. Ten pieces on one theme reveal your own voice.", "Teach a beginner to draw basic forms."]], "painting": [["Start with a limited palette of a few colors plus white.", "Clean your brushes thoroughly after every session."], ["Learn to mix colors rather than buying every tube.", "Block in big shapes first, then add detail."], ["Work out values, light versus dark, before worrying about color.", "Paint small studies before big canvases."], ["Learn about warm and cool colors and how they push and pull space.", "In oils, follow 'fat over lean': later layers should contain more oil than earlier ones to prevent cracking."], ["Paint the same subject in different lighting.", "Study how master painters handled edges, hard and soft."], ["Develop a series with a consistent theme.", "Experiment with texture, glazing and other techniques."], ["Exhibit your work in a show or online gallery.", "Teach a color-mixing workshop."]], "photography": [["Learn the exposure triangle: aperture, shutter speed and ISO.", "Hold the camera steady and squeeze the shutter gently."], ["Use the rule of thirds as a starting guide, not a strict law.", "Shoot during golden hour, just after sunrise or before sunset, for soft light."], ["Learn to read your camera's histogram to check exposure.", "Shoot in RAW if your camera allows it, for more editing flexibility."], ["Practice manual mode until it feels natural.", "Learn basic editing: exposure, white balance and cropping."], ["Shoot a themed project over several weeks.", "Study photographers you admire and analyze their composition."], ["Develop a consistent editing style.", "Learn to work with off-camera light."], ["Publish a portfolio or photo book.", "Teach someone the basics of exposure."]], "pottery": [["Wedge your clay to remove air bubbles before throwing.", "Keep your hands and the clay wet, but not soaking, on the wheel."], ["Centering is the foundation. Practice it until it feels steady.", "Start with simple cylinders before bowls and vases."], ["Keep wall thickness even so pieces dry and fire evenly.", "Let pieces dry slowly to prevent cracking."], ["Learn trimming to shape the foot of your pieces.", "Try handbuilding techniques like coil and slab."], ["Learn about glazes and test them on tiles first.", "Throw sets of matching pieces to build consistency."], ["Experiment with different clay bodies and firing temperatures.", "Develop your own forms and surfaces."], ["Exhibit or sell a collection of your work.", "Teach someone to center clay."]], "writing": [["Write a little every day, even 10 minutes.", "Read widely. Reading teaches you what good writing sounds like."], ["Finish a first draft before editing. Drafts are supposed to be rough.", "Cut words that don't add meaning."], ["Read your work aloud to catch awkward sentences.", "Use specific, concrete details instead of vague descriptions."], ["Get feedback from a writing group or trusted reader.", "Study the structure of stories or essays you admire."], ["Revise in passes: big structure first, then sentences.", "Try a form you don't usually write, like poetry or a personal essay."], ["Submit work to publications or contests.", "Develop a recognizable voice."], ["Finish a long project, like a novel or collection.", "Mentor a newer writer."]], "cooking": [["Read the whole recipe first and set out every ingredient before you turn on the heat.", "Wash your hands and keep raw meat separate from ready-to-eat food.", "Taste as you cook, not only at the end."], ["Season gradually: add a little salt, taste, and adjust.", "Let the pan heat up before adding food for better browning.", "Don't crowd the pan. Food steams instead of browning when it's packed in."], ["Master one heat skill at a time: a hard sear, a gentle simmer, a quick sauté.", "Use a meat thermometer instead of guessing doneness.", "Learn to make a simple pan sauce from the browned bits left after searing."], ["Cook a favorite dish without the recipe, then compare it to the original.", "Learn to balance a dish with a splash of acid, like lemon juice or vinegar.", "Plan and cook a full meal so everything finishes at the same time."], ["Learn the classic French mother sauces. Many sauces branch from them.", "Make your own stock and taste the difference.", "Try cooking from a cuisine you've never tried before."], ["Build dishes around balance: salt, fat, acid and heat.", "Develop your own versions of classic recipes.", "Cook for a group and manage timing like a restaurant line."], ["Invent a dish and write the recipe clearly enough for someone else to make.", "Teach someone to cook a dish you know well.", "Host a dinner with a menu you designed yourself."]], "baking": [["Weigh ingredients with a kitchen scale. It's far more accurate than cups.", "Preheat the oven fully before baking."], ["Use room-temperature butter and eggs when a recipe calls for creaming.", "Measure flour by weight, or spoon it into the cup and level it. Scooping packs in too much."], ["Get an oven thermometer. Many ovens run hotter or colder than the dial says.", "Avoid opening the oven door too early, especially for cakes."], ["Learn the difference between baking soda and baking powder. Soda needs an acid in the recipe to work.", "Bake a simple bread and learn to tell when dough is properly kneaded."], ["Try a sourdough starter or a long, cold fermentation for more flavor.", "Learn to adjust recipes for altitude or different pan sizes."], ["Practice laminated doughs like croissants.", "Study the role of each ingredient so you can troubleshoot recipes."], ["Develop your own signature recipe.", "Teach a friend to bake a loaf of bread."]], "knife-skills": [["Use the claw grip: curl your fingertips under so your knuckles guide the blade.", "Put a damp towel under your cutting board so it doesn't slide."], ["A sharp knife is safer than a dull one because it needs less force and slips less.", "Hold the knife with a pinch grip on the blade, just in front of the handle."], ["Learn to dice an onion efficiently, keeping the root end attached.", "Practice a rocking motion with a chef's knife for fast chopping."], ["Learn the difference between honing, which realigns the edge, and sharpening, which removes metal.", "Practice consistent cuts like brunoise and julienne."], ["Learn to break down a whole chicken.", "Practice filleting fish with a flexible knife."], ["Learn to sharpen on a whetstone at a consistent angle.", "Work on speed only after your cuts are consistently even."], ["Teach someone the claw grip and basic cuts.", "Build a small, well-maintained knife kit that suits your cooking."]], "grilling-bbq": [["Set up two heat zones, one hot and one cooler, so you can move food around.", "Clean and oil the grates before cooking."], ["Use a meat thermometer. Safe minimums: poultry 165°F (74°C), ground beef 160°F (71°C), and whole cuts of beef or pork 145°F (63°C) with a 3-minute rest.", "Keep the lid closed as much as possible to hold the temperature steady."], ["Let meat rest after grilling so juices settle.", "Learn indirect grilling for thicker cuts."], ["Try low-and-slow smoking for cuts like pork shoulder.", "Learn to manage charcoal or wood for steady temperatures."], ["Experiment with dry rubs, marinades and brines.", "Keep a log of cook times and temperatures to learn your grill."], ["Tackle a long cook like brisket.", "Learn to grill vegetables and fish as well as meat."], ["Host a cookout and manage multiple dishes at once.", "Develop your own signature rub or sauce."]], "pastry": [["Keep butter cold for flaky pastry dough.", "Measure precisely. Pastry is less forgiving than cooking."], ["Rest dough in the fridge before rolling so it's easier to handle and shrinks less.", "Use a light touch. Overworking dough makes it tough."], ["Blind-bake tart shells with weights to keep them flat.", "Learn to make a basic pastry cream."], ["Learn choux pastry for éclairs and cream puffs.", "Practice piping with a pastry bag."], ["Work on laminated doughs like puff pastry.", "Learn to temper chocolate for a glossy finish."], ["Design a plated dessert with different textures.", "Study classic French pâtisserie techniques."], ["Create a signature pastry of your own.", "Teach a friend to make a simple tart."]], "world-cuisines": [["Pick one cuisine to explore first and learn its key ingredients.", "Find a trusted cookbook or creator from that cuisine."], ["Stock the pantry staples for your chosen cuisine.", "Learn a simple everyday dish from it before festive ones."], ["Learn the core techniques of that cuisine, like stir-frying or slow braising.", "Visit local markets for authentic ingredients."], ["Learn about regional variations within the cuisine.", "Cook a full traditional meal with several dishes."], ["Explore a second cuisine and compare techniques.", "Learn the history and culture behind the dishes."], ["Cook with someone from the culture to learn hands-on.", "Adapt dishes to local ingredients while respecting tradition."], ["Host a dinner featuring a cuisine you've studied.", "Teach a dish to friends and share its story."]], "fitness": [["Start smaller than you think. Three short sessions a week beat one heroic one.", "Warm up for a few minutes before working hard.", "If you have a health condition or haven't exercised in a long time, check with a doctor before starting."], ["Learn proper form before adding intensity.", "Mild soreness is normal. Sharp or joint pain is a signal to stop.", "Schedule your sessions like appointments so they happen."], ["Track your sessions so you can see progress and spot plateaus.", "Mix in some variety so you train different muscles and avoid burnout.", "Sleep and food fuel your progress as much as the workouts do."], ["Follow a structured plan for 8 to 12 weeks before judging it.", "Increase one thing at a time: duration, intensity or frequency.", "Find a partner or class to keep you accountable."], ["Schedule easier recovery weeks. Your body adapts during rest.", "Train your weak points on purpose.", "Learn to tell the difference between being tired and being injured."], ["Set a measurable performance goal and build a plan toward it.", "Consider working with a coach to refine technique.", "Review your training log every few months and adjust."], ["Pick a big goal event, like a race, meet or climb, and build toward it.", "Help a beginner get started safely.", "Keep training enjoyable so it lasts for decades."]], "running": [["Start with run/walk intervals, like 1 minute running and 2 walking.", "Run at a pace where you could still talk in short sentences."], ["Most runs should feel easy. Speed comes later.", "Get fitted for running shoes at a specialty store if you can."], ["Increase weekly distance gradually. The popular '10% rule' is a rough guide, not a law.", "Add a longer, slow run once a week to build endurance."], ["Add one session of strides or intervals each week and keep the rest easy.", "Add a little strength training to support your legs and hips."], ["Plan a training block toward a race, with a lighter taper in the final week or two.", "Practice race-day fueling and gear during long training runs, not on race day."], ["Track recovery like sleep and how your legs feel. Progress needs rest as much as mileage.", "Run varied terrain like hills and trails to build strength."], ["Pace a friend through their first race.", "Pick a goal race that excites you and train for it over months."]], "strength-training": [["Learn form with light weight first: squat, hinge, push and pull.", "Warm up with lighter sets of the exercise you're about to do."], ["Use progressive overload: add a little weight or one rep over time.", "Control the weight on the way down instead of dropping it."], ["Log every workout so you can spot a plateau early.", "Use a spotter or safety bars for heavy bench presses and squats."], ["Run a structured program for 8 to 12 weeks before judging it.", "Make sure you're eating enough protein to support muscle growth."], ["Plan lighter deload weeks to manage built-up fatigue.", "Film heavy lifts from the side to catch form breaking down."], ["Bring up weak points with targeted accessory work.", "Learn to adjust training based on how recovered you feel each day."], ["Coach a beginner through their first lifts with good form.", "Set a long-term strength goal and plan it in training blocks."]], "cycling": [["Always wear a helmet, and check your brakes before every ride.", "Set your saddle height so your leg is almost straight at the bottom of the pedal stroke."], ["Do an ABC check before rides: air in tires, brakes and chain.", "Shift gears before you hit a hill, not halfway up."], ["Practice keeping a steady, smooth pedal rhythm. Many road cyclists aim for roughly 80 to 90 pedal turns a minute.", "Learn to fix a flat tire before you need to."], ["Add one longer ride each week to build endurance.", "Learn to ride safely in a group, holding a steady line."], ["Add interval sessions to build power.", "Consider a professional bike fit if you ride long distances."], ["Learn basic bike maintenance like cleaning and lubing the chain.", "Plan a long event ride and train toward it."], ["Lead a group ride for newer cyclists.", "Take on a multi-day tour or a big climbing challenge."]], "swimming": [["Swim where there's a lifeguard, and never swim alone in open water.", "Practice breathing out steadily underwater, then breathing in when your face turns to the side."], ["Practice kicking with a kickboard to build leg strength.", "Keep your body long and flat in the water to reduce drag."], ["Learn bilateral breathing, breathing to both sides, for a balanced stroke.", "Use drills like catch-up freestyle to improve your stroke."], ["Learn a second stroke, like backstroke or breaststroke.", "Practice flip turns or open turns to keep laps flowing."], ["Swim structured sets with rest intervals instead of just swimming laps.", "Ask a coach to watch your stroke and give feedback."], ["Learn butterfly or work toward all four strokes.", "Try open-water swimming with a group and proper safety support."], ["Enter a swim meet or open-water event.", "Help a beginner get comfortable in the water."]], "martial-arts": [["Learn at a reputable school with qualified instructors.", "Focus on basic stances and footwork before advanced techniques."], ["Train with control. Your partner is helping you learn, not an opponent.", "In grappling, tap early when caught in a hold. It prevents injury."], ["Drill fundamentals slowly until they feel natural.", "Learn how to fall safely before sparring or throwing."], ["Start sparring or rolling with control under supervision.", "Add conditioning and flexibility work outside class."], ["Study your sparring rounds to find patterns in your mistakes.", "Train with partners of different sizes and styles."], ["Help teach techniques to newer students.", "Prepare for a grading or competition with a focused plan."], ["Develop a personal approach built on the fundamentals.", "Mentor junior students and lead parts of class."]], "climbing": [["Take an intro class at a climbing gym to learn the basics safely.", "Before every climb, check your partner's harness and knot, and have them check yours."], ["Use your legs more than your arms. Push with your feet.", "Learn to fall safely in bouldering, landing on your feet and rolling back."], ["Practice precise footwork: place your feet quietly and deliberately.", "Rest by straightening your arms and hanging from your skeleton."], ["Learn to read a route before you climb it.", "Add some antagonist training like push-ups to keep shoulders balanced."], ["Work on projects slightly above your level over several sessions.", "Learn lead climbing from a qualified instructor before trying it."], ["Take outdoor climbing courses before climbing outside, including how to assess anchors and rock.", "Train finger strength gradually to avoid tendon injuries."], ["Mentor a new climber in safe gym practices.", "Plan an outdoor climbing trip with experienced partners."]], "wellness": [["Start with five minutes. Consistency matters more than length.", "Practice at the same time and place each day so the habit runs on autopilot.", "There's no perfect way to start. Just begin."], ["Try a guided session from a teacher or app to learn new techniques.", "Notice how you feel before and after each session.", "Keep your practice space simple and comfortable."], ["When your attention wanders, come back without judging it. Coming back is the practice.", "Gradually lengthen sessions by a few minutes.", "Try practicing at a different time of day to see what suits you."], ["Try one longer session, or a half-day retreat.", "Explore a different style or tradition to deepen your practice.", "Bring the practice into ordinary moments, like walking or waiting in line."], ["Join a group or class to practice with others.", "Read about the history and ideas behind your practice.", "Keep a simple log of what helps and what doesn't."], ["Take a multi-day retreat or longer course.", "Share what you've learned with a friend who's curious.", "Notice how the practice affects your relationships and work."], ["Help someone else start their own practice.", "Make the practice a lifelong habit rather than a goal.", "Keep learning from experienced teachers."]], "yoga": [["Start with a beginner class taught by a qualified instructor.", "Never force a pose into pain. Mild stretch is fine, sharp pain isn't."], ["Use props like blocks and straps. They help you find good alignment.", "Link movement with your breath, moving on the inhale or exhale."], ["Learn the core standing poses well, like Mountain, Warrior and Downward Dog.", "Practice regularly, even short sessions at home."], ["Explore different styles like Hatha, Vinyasa or Yin to find what suits you.", "Work on balance poses to build stability and focus."], ["Learn to modify poses for your own body instead of copying others.", "Try a longer class or workshop to deepen your practice."], ["Build a home practice you sequence yourself.", "Study the breathing and meditation side of yoga, too."], ["Share a basic sequence with a friend.", "Consider teacher training if you want to go deeper."]], "meditation": [["Start with five minutes of focusing on your breath.", "Sit comfortably. A chair works just as well as the floor."], ["Use a guided meditation app or recording when starting out.", "When your mind wanders, gently return to the breath. That's the practice."], ["Try body scans, moving attention slowly from head to toe.", "Meditate at the same time each day to build the habit."], ["Explore loving-kindness or other styles of meditation.", "Gradually extend sessions to 15 or 20 minutes."], ["Practice mindfulness during daily tasks like eating or walking.", "Join a group sitting or meditation class."], ["Attend a retreat led by experienced teachers.", "Read classic texts on meditation to understand its roots."], ["Help a friend start meditating.", "Make meditation part of your daily life, not just a session."]], "journaling": [["Write a few lines each day. Length doesn't matter.", "Date every entry so you can look back later."], ["Use prompts when you're stuck, like 'What went well today?'", "Write for yourself. It doesn't need to be polished."], ["Try different formats: lists, letters, or bullet journaling.", "Note what you're grateful for a few times a week."], ["Reread entries from a month ago and notice patterns.", "Use journaling to think through decisions."], ["Set a monthly reflection where you review goals and progress.", "Keep separate sections or notebooks for different purposes."], ["Write longer reflective pieces on big life events.", "Combine journaling with other practices like meditation."], ["Keep journaling as a lifelong habit.", "Share the habit with a friend who's curious."]], "language": [["Learn the most common words first. A few hundred cover a large share of everyday conversation.", "Learn greetings and survival phrases so you can use the language from day one.", "Learn how the sounds work early, before bad pronunciation habits set in."], ["Use spaced-repetition flashcards a little every day instead of cramming.", "Learn words in short phrases, not alone, so you also learn how they're used.", "Label things around your home in the language."], ["Rewatch a show you know, with audio and subtitles in the language.", "Keep a short daily journal in the language, even three sentences.", "Learn the most common verb patterns and practice them out loud."], ["Find a conversation partner or tutor. Speaking is where many learners stall.", "Switch your phone or a game to the language for a week.", "Listen to podcasts made for learners at your level."], ["Read a full novel or long article series. Only look up words that keep coming back.", "Practice explaining something complicated, like your job, in the language.", "Watch content made for native speakers without subtitles."], ["Shadow native audio: repeat each sentence right after the speaker to polish rhythm and accent.", "Learn idioms and slang from real conversations, not just textbooks.", "Write something longer, like a letter or story, and get it corrected."], ["Narrate your day in your head in the language.", "Help a newer learner. Explaining grammar shows you what you've mastered.", "Consume news, books and shows in the language as your normal routine."]], "sign-language": [["Learn the fingerspelling alphabet for your sign language.", "Sign languages differ by country. ASL and British Sign Language, for example, are separate languages."], ["Practice receptive skills by watching signers in videos, not just signing yourself.", "Facial expressions carry grammar in many sign languages, like marking questions. Practice them, too."], ["Learn classes from Deaf instructors when you can. They teach the language and its culture.", "Practice signing in front of a mirror or record yourself to check your handshapes."], ["Attend Deaf community events where signing is welcome, and be respectful as a learner.", "Learn how signers use the space in front of them to track people and places."], ["Practice storytelling in sign, using role shift to show different characters.", "Watch fast natural signing and try to follow full conversations."], ["Learn regional variations and slang from community members.", "Practice interpreting short spoken passages into sign."], ["Help newer learners with fingerspelling and receptive practice.", "If you're interested, look into formal interpreter training and certification."]], "life": [["Start with one small area, like a single drawer or shelf.", "Use the two-minute rule: if it takes under two minutes, do it now.", "Pick one habit to work on at a time."], ["Build a short weekly reset routine and keep it the same each week.", "Write things down instead of keeping them in your head.", "Celebrate small wins."], ["Give everything a home. Clutter is mostly things without a place.", "Batch similar tasks together.", "Review what's working each month."], ["Automate what you can: recurring bills, shopping lists, reminders.", "Plan your week before it starts.", "Learn from people who do this well."], ["Review your systems every few months and drop what you don't use.", "Build routines that work even on bad days.", "Share chores fairly with your household."], ["Teach your systems to family or roommates.", "Plan ahead for big life events.", "Keep refining instead of starting over."], ["Help someone else set up their system.", "Make your systems simple enough to last for years.", "Keep improving a little at a time."]], "organizing": [["Start with one drawer or shelf, not a whole room.", "Sort items into keep, donate and discard."], ["Give everything a home close to where you use it.", "Label containers so everyone knows where things go."], ["Store frequently used items at eye level.", "Use the 'one in, one out' rule for new items."], ["Declutter each room on a regular schedule.", "Organize digital files with clear folder names."], ["Set up systems for paperwork and important documents.", "Review storage seasonally."], ["Help a friend organize a space.", "Design systems that are easy to maintain."], ["Keep your whole home organized with simple routines.", "Teach your family your organizing system."]], "cleaning": [["Clean from top to bottom so dust falls onto areas you haven't cleaned yet.", "Never mix bleach with ammonia or acidic cleaners. It can release toxic gas."], ["Let cleaners sit for the time on the label before wiping.", "Do a quick 10-minute tidy each day."], ["Build a weekly cleaning schedule by room.", "Clean as you cook to avoid a big mess later."], ["Deep-clean one area each week on a rotation.", "Use microfiber cloths for dusting and streak-free glass."], ["Learn to treat common stains quickly.", "Keep supplies in each area where you need them."], ["Create a seasonal deep-cleaning checklist.", "Teach household members the routine."], ["Keep your home clean with minimal effort through habits.", "Help someone set up a cleaning routine."]], "budgeting": [["Track every expense for one month to see where money goes.", "List your fixed bills and their due dates."], ["Pick a simple budgeting method and try it for a few months. The 50/30/20 split is one popular starting point.", "Review subscriptions and cancel ones you don't use."], ["Start an emergency fund, even a small one.", "Set up automatic transfers to savings."], ["Plan for irregular expenses like car repairs or gifts.", "Review your budget monthly and adjust."], ["Learn the basics of interest and how debt grows.", "Set specific savings goals with timelines."], ["Learn general investing concepts from reputable sources.", "Consider talking to a licensed financial professional for big decisions."], ["Help a friend build their first budget.", "Keep refining your money habits over time."]], "gardening": [["Start small with a few easy plants.", "Learn your climate zone so you choose plants that suit it."], ["Water deeply and less often to grow strong roots.", "Check how much sun each spot gets before planting."], ["Add compost to improve your soil.", "Mulch to keep moisture in and weeds down."], ["Get a soil test to learn what your soil needs.", "Learn to spot common pests early."], ["Plan your garden with crop rotation in mind.", "Start plants from seed."], ["Try companion planting and succession planting.", "Save seeds from your best plants."], ["Design a garden that produces through several seasons.", "Share plants and knowledge with neighbors."]], "home-repair": [["Learn where your water shutoff, gas shutoff and breaker panel are.", "Build a basic toolkit: hammer, screwdrivers, tape measure, level and pliers."], ["Use a stud finder before hanging heavy items.", "Patch small drywall holes with spackle and sand smooth."], ["Learn to caulk tubs and windows neatly.", "Fix squeaky doors and loose cabinet hinges."], ["Learn to replace a faucet aerator or showerhead.", "Keep a log of home maintenance tasks."], ["Learn to paint a room with clean edges.", "Know when a job needs a licensed pro, like electrical, gas or structural work."], ["Plan a seasonal maintenance checklist.", "Take on a larger project like installing shelves or tile."], ["Help a neighbor with a repair.", "Keep your home in good shape with regular maintenance."]], "time-management": [["Write down every task so your head is free to focus.", "Pick the one most important task each day."], ["Try working in focused blocks, like 25 minutes with a 5-minute break.", "Turn off notifications during focus time."], ["Block time on your calendar for important work.", "Group similar tasks together."], ["Do a weekly review of tasks and priorities.", "Learn to say no to things that don't fit your goals."], ["Track how you actually spend your time for a week.", "Plan your week around your energy levels."], ["Delegate tasks others can do.", "Set quarterly goals and break them into weekly steps."], ["Help someone set up a planning system.", "Keep your system simple and adjust it as life changes."]], "generic": [["Short daily sessions beat one long weekly one. Ten minutes counts.", "Start with the basics before advanced techniques.", "Focus on enjoying the process early on."], ["Pick one specific thing to improve in each session.", "Find a good beginner resource and work through it.", "Practice at the same time each day."], ["Find someone a little ahead of you and notice what they do differently.", "Track your progress so you can see it.", "Push slightly past your comfort zone."], ["Record or save your work so you can compare it later.", "Get feedback from someone experienced.", "Take on a project with a clear goal."], ["Spend part of each session on your weakest area. That's deliberate practice.", "Study the work of experts.", "Set a challenging long-term goal."], ["Take on a project bigger than you think you can finish.", "Refine your own style or approach.", "Share your progress with a community."], ["Teach what you know. It locks it in and shows you the gaps.", "Mentor someone starting out.", "Keep learning for the long haul."]], "instrument": [["Learn to hold the instrument comfortably and play one clean note before chasing songs.", "Practice in short daily sessions. Fifteen focused minutes beats an hour once a week.", "Learn the names of the notes your instrument plays so lessons and tabs make sense."], ["Practice with a metronome at a tempo where you make no mistakes, then speed up gradually.", "Learn the major scale in a couple of keys. A lot of melodies are built from it.", "Warm up before you play songs, even if it's just a minute of slow scales."], ["Learn one full song start to finish, including the bar you keep skipping.", "Isolate the hardest two bars and loop them slowly instead of replaying the whole piece.", "Learn basic chord building: a major chord is the 1st, 3rd and 5th notes of the major scale."], ["Play along with recordings to build timing and feel.", "Start learning to read music or charts if you haven't. It opens up far more material.", "Practice dynamics on purpose: play a phrase very quietly, then loudly, keeping it even."], ["Record yourself and listen back a day later with fresh ears.", "Learn a piece in a style you don't usually play. It exposes new techniques.", "Play with other musicians. Staying together teaches more about timing than solo practice."], ["Transcribe a passage by ear and compare it to the written version.", "Perform for an audience, even a small one. Nerves are a skill you can train.", "Work on tone as a goal in itself, not just correct notes."], ["Teach a beginner. Explaining technique exposes habits you've stopped noticing.", "Compose or arrange your own piece using what you've learned.", "Keep a few long-term goal pieces that stretch you for months."]], "guitar": [["Start with E minor and G major. They're easy shapes and appear in countless songs.", "Press strings just behind the fret, not on top of it, for a clean sound with less pressure."], ["Practice switching between two chords for one minute straight. Clean changes matter more than speed.", "Learn to tune by ear against a tuner app, then check how close you got."], ["Learn the A minor pentatonic scale in its first position at the 5th fret. It's the backbone of many rock and blues solos.", "Start practicing the F barre chord a little each day. It's hard for everyone at first."], ["Learn the CAGED system to see each chord in five places on the neck.", "Practice bends to pitch: play the target note first, then bend up to match it."], ["Transcribe a solo by ear. It trains your ear faster than reading tabs.", "Learn the notes on the low E and A strings so you can find any root note quickly."], ["Record yourself and listen for timing first, tone second.", "Learn modes by hearing them over a drone, not by memorizing shapes alone."], ["Teach someone. Explaining technique exposes the habits you've stopped noticing.", "Develop a signature phrase or tone you could recognize as your own."]], "piano": [["Learn finger numbers: thumbs are 1 and pinkies are 5 on both hands.", "Find middle C and learn the white keys around it by name."], ["Practice hands separately until each feels easy, then put them together slowly.", "Keep fingers gently curved, as if holding a ball, to play evenly."], ["Learn the C major scale with correct fingering, passing the thumb under smoothly.", "Learn to read the treble and bass clefs together, a few notes at a time."], ["Start using the sustain pedal, lifting and pressing it right after each chord change so chords don't blur.", "Learn the major and minor scales in all keys, a few each week."], ["Practice voicing: let the melody sing out over a softer accompaniment.", "Learn a piece from a different era, like Baroque or Romantic, to stretch your technique."], ["Record yourself to check evenness in fast runs and the balance between hands.", "Study a piece's harmony so you can memorize it by structure, not just muscle memory."], ["Prepare a short recital program and perform it from memory.", "Teach a beginner their first song. It sharpens your own fundamentals."]], "bass": [["Start by playing root notes on beat one of each chord in a simple song.", "Use your fretting hand's fingertips and keep your thumb behind the neck."], ["Lock in with the kick drum. Bass and drums together make the groove.", "Alternate your index and middle fingers when plucking for an even sound."], ["Mute strings you're not playing with both hands to avoid ringing notes.", "Learn simple walking lines using root, fifth and octave."], ["Learn the major and minor arpeggios across the neck.", "Practice with a metronome clicking only on beats 2 and 4 to strengthen your internal time."], ["Transcribe bass lines from songs you love and notice how they support the chords.", "Experiment with slap or pick technique to widen your tone options."], ["Learn to read bass clef or chord charts so you can sit in with other musicians.", "Work on playing behind, on, or ahead of the beat on purpose."], ["Write your own bass lines for chord progressions you haven't heard before.", "Teach a drummer or guitarist how your parts lock together."]], "drums": [["Learn a basic rock beat: kick on 1 and 3, snare on 2 and 4, hi-hat on eighth notes.", "Wear ear protection. Drums are loud enough to damage hearing over time."], ["Practice the single stroke roll and double stroke roll on a practice pad.", "Let the stick rebound off the head instead of pressing into it."], ["Learn the paradiddle and use it around the kit.", "Practice fills that end cleanly on beat one of the next bar."], ["Work through all 40 standard rudiments, a few at a time.", "Practice with a metronome at slow tempos. Steady and slow is harder than fast."], ["Learn grooves from different styles like funk, jazz, and Latin.", "Record yourself playing along to songs and check if you're rushing fills."], ["Work on dynamics: play ghost notes softly so accents stand out.", "Practice odd time signatures like 5/4 and 7/8."], ["Play with a band regularly and learn to support the song, not just show off.", "Develop your own fills and grooves that musicians would recognize as yours."]], "ukulele": [["Standard tuning is G-C-E-A, with the G string tuned higher than the C on most ukuleles.", "Learn C, A minor, F and G. Those four chords cover lots of songs."], ["Practice a simple down-down-up-up-down-up strum until it feels automatic.", "Keep your strumming hand moving even on beats where you don't hit the strings."], ["Learn to switch chords without stopping your strum.", "Try fingerpicking simple patterns with thumb and first two fingers."], ["Learn barre chords like B flat to unlock more keys.", "Try a chord-melody arrangement where you play the tune and harmony together."], ["Learn the notes on the fretboard so you can find melodies by ear.", "Experiment with chucks and percussive strums for rhythm variety."], ["Learn songs in a low-G tuning to hear a fuller range.", "Arrange a song from another instrument for ukulele."], ["Perform a full set of songs for friends or an open mic.", "Teach someone their first four chords."]], "violin": [["Learn the open strings: G, D, A and E, from lowest to highest.", "Work on a relaxed bow hold before worrying about notes."], ["Keep the bow parallel to the bridge and practice long, straight strokes on open strings.", "Beginners often use tape on the fingerboard to mark finger positions. That's normal while your ear develops."], ["Practice scales slowly with a drone note to train your intonation.", "Learn to tune with the fine tuners first, then the pegs with help."], ["Learn third position to reach higher notes on each string.", "Start working on vibrato slowly with a teacher's guidance."], ["Practice shifting between positions slowly, listening for the target note.", "Study bowing techniques like spiccato and martelé."], ["Record yourself to catch intonation drift in fast passages.", "Play chamber music with others to build ensemble listening."], ["Prepare a full concerto movement or recital piece.", "Teach a beginner bow hold and posture."]], "saxophone": [["Many beginners start with a softer reed, around strength 2 to 2.5, before moving up.", "Learn a steady embouchure: lower lip slightly over the bottom teeth, corners firm."], ["Play long tones every session to build a steady, full sound.", "Learn the octave key to jump between low and middle registers smoothly."], ["Learn your first major scales and practice them slowly.", "Use a tuner while playing long tones to check pitch."], ["Practice overtones to strengthen your air support and control.", "Start learning simple jazz standards and their melodies."], ["Transcribe solos by ear from recordings you admire.", "Work on articulation like slap tongue or ghosted notes."], ["Learn to improvise over common chord progressions such as a ii–V–I.", "Explore altissimo notes above the normal range with a teacher."], ["Develop a recognizable personal tone.", "Play in a band or combo and practice blending your sound."]], "tuba": [["Buzz your lips on the mouthpiece alone before playing the full instrument.", "Breathe deeply and relaxed. The tuba needs a lot of steady air."], ["Play long tones every day to build steady air and tone.", "Learn your first few valve combinations and the notes they make."], ["Practice lip slurs between notes using the same valve combination.", "Learn to read bass clef fluently."], ["Work on your low register while keeping the tone full, not flabby.", "Practice scales across the instrument's range."], ["Play in an ensemble and practice keeping the group in time.", "Work on articulation so low notes speak clearly."], ["Learn solo repertoire written for tuba.", "Record yourself to check pitch in your extreme registers."], ["Perform a solo piece in public.", "Teach a new brass player how to buzz and breathe."]], "singing": [["Warm up gently before singing, with hums or lip trills.", "Stop if your voice hurts or feels strained. Pushing through pain can cause damage."], ["Practice breathing low and steady so your shoulders don't rise when you inhale.", "Sing along with a piano or app to check your pitch."], ["Learn sirens: glide smoothly from low to high notes and back.", "Record yourself. Your voice sounds different from inside your head."], ["Learn to blend smoothly between your chest voice and head voice.", "Work on clear vowels. They carry tone more than consonants."], ["Sing harmony parts to train your ear.", "Learn a song in another language to stretch your diction."], ["Prepare a set and perform it for an audience.", "Work with a vocal coach to refine your technique and stamina."], ["Develop a recognizable personal style and interpretation.", "Teach someone how to warm up properly."]], "study": [["Study in short focused blocks with breaks.", "Remove distractions like your phone during study time.", "Start with an overview of the topic before diving into details."], ["Test yourself instead of just rereading. Recalling information strengthens memory.", "Space out your review over several days.", "Explain what you learned in your own words."], ["Take notes that summarize ideas, not copies of the text.", "Mix related topics in one session to see connections.", "Use a variety of sources."], ["Teach a concept to someone else to check your understanding.", "Work through harder material slowly and repeatedly.", "Join a study group or discussion."], ["Apply what you learn to a real project or problem.", "Read critically and question sources.", "Track what you've learned over time."], ["Go deep into one area and become the go-to person for it.", "Read primary sources and advanced texts.", "Write about what you've learned."], ["Mentor others in your subject.", "Contribute your own ideas to discussions in the field.", "Keep learning as a lifelong habit."]], "reading": [["Read at the same time each day to build the habit.", "Start with books you're genuinely curious about."], ["Keep a book with you for spare moments.", "It's fine to quit a book you don't enjoy."], ["Take brief notes or highlight key ideas.", "Summarize each chapter in a sentence or two."], ["Read across genres and subjects.", "Discuss books with friends or a book club."], ["Read challenging classics slowly and with notes.", "Compare books on the same topic."], ["Write reviews or reflections on what you read.", "Reread favorite books and notice new details."], ["Recommend books thoughtfully to others.", "Build a personal library of books that shaped you."]], "math": [["Work through problems yourself instead of only reading solutions.", "Review the basics you're shaky on before moving forward."], ["Show your work so you can find where mistakes happen.", "Practice a little every day instead of cramming."], ["Focus on understanding why a method works, not just the steps.", "Check answers by estimating first."], ["Explain a solution to someone else.", "Mix problem types so you learn to choose the right method."], ["Tackle problems that take several sessions to solve.", "Read proofs carefully and try to reconstruct them."], ["Study a new branch of math that interests you.", "Try competition-style or challenge problems."], ["Tutor someone in math.", "Explore open problems or research-level topics."]], "chess": [["Learn how every piece moves, including castling and en passant.", "Learn basic checkmates like king and queen against a lone king."], ["Follow opening principles: control the center, develop your pieces, castle early.", "Before each move, check what your opponent's last move threatens."], ["Solve tactics puzzles daily to spot forks, pins and skewers.", "Review your losses to find the mistakes."], ["Learn basic endgames like king and pawn endings.", "Play longer games where you have time to think."], ["Study annotated master games.", "Build a small, consistent opening repertoire."], ["Calculate variations deeply before moving in critical positions.", "Play in tournaments to test yourself."], ["Coach a beginner.", "Study the games of a world champion in depth."]], "history": [["Start with a broad overview of a period before details.", "Use timelines to place events in order."], ["Learn the difference between primary sources from the time and secondary sources about it.", "Ask why events happened when they did."], ["Read several perspectives on the same event.", "Visit museums or historic sites."], ["Read primary sources from the period you're studying.", "Notice how historians disagree and why."], ["Write a short essay on a historical question.", "Study how geography and economics shaped events."], ["Research a topic in depth using primary sources.", "Connect historical patterns to current events, carefully."], ["Share your research through talks or writing.", "Mentor someone starting to study history."]], "public-speaking": [["Practice out loud, not just in your head.", "Know your opening lines well. A strong start calms nerves."], ["Record yourself and watch it back.", "Pause instead of using filler words like 'um.'"], ["Structure talks with a clear beginning, middle and end.", "Practice in front of a friend or small group."], ["Know your audience and tailor your message.", "Use stories to make points memorable."], ["Join a speaking group, like a Toastmasters club.", "Practice handling questions and interruptions calmly."], ["Speak without reading from notes.", "Work on vocal variety: pace, volume and pitch."], ["Give a talk to a large audience.", "Coach someone preparing their first speech."]], "tech": [["Follow a beginner tutorial all the way through before starting your own project.", "Learn the keyboard shortcuts for the tools you use most.", "Save your work often and keep backups."], ["Build a tiny project you'd actually use.", "When stuck, search the exact error message.", "Keep notes on what you learn so you can find it later."], ["Learn version control or another way to track changes.", "Read official documentation, not just tutorials.", "Break big problems into small steps."], ["Study how experienced people structure their projects.", "Join a community or forum for your area.", "Build something slightly beyond your current skill."], ["Get feedback on your work from someone more experienced.", "Learn to debug systematically instead of guessing.", "Finish and share a complete project."], ["Contribute to a community project or help others online.", "Learn the fundamentals beneath the tools you use.", "Plan a larger project with milestones."], ["Mentor someone who's starting out.", "Build something that other people rely on.", "Keep learning as tools change."]], "coding": [["Type examples out instead of pasting them. Your fingers learn the syntax too.", "Learn one language well before jumping to another."], ["Build a tiny project you'd actually use, like a dice roller or a to-do list.", "Read error messages carefully. They usually point to the problem."], ["Learn Git basics and commit small changes often, with clear messages.", "Learn to use a debugger instead of only print statements."], ["Read the source of an open-source project you use.", "Learn basic data structures like arrays, maps and sets."], ["Write a test that reproduces a bug before fixing it, so it can't sneak back.", "Ask for code reviews and learn from the feedback."], ["Measure performance before optimizing. The slow part is rarely where you'd guess.", "Learn a second language in a different style, like functional programming."], ["Write for the person reading your code next year, including future you.", "Mentor a beginner or contribute to open source."]], "game-development": [["Start by recreating a simple classic like Pong.", "Pick one engine and stick with it while you learn."], ["Keep scope tiny. Finished small games teach more than unfinished big ones.", "Learn your engine's basics: scenes, objects and input."], ["Make a game in a weekend game jam.", "Playtest with someone else and watch without explaining."], ["Learn basic game feel: responsive controls, feedback and juice.", "Use version control for your projects."], ["Finish and publish a small game online.", "Study games you love and break down why they're fun."], ["Learn optimization and profiling in your engine.", "Work with others on art, sound or design."], ["Release a polished game with a full start-to-finish experience.", "Share postmortems of what you learned."]], "3d-modeling": [["Learn to navigate the viewport smoothly: orbit, pan and zoom.", "Start with simple objects like a mug or a chair."], ["Use reference images from several angles.", "Learn the basic modeling tools: extrude, loop cut and bevel."], ["Aim for clean topology, using mostly four-sided faces.", "Model in low detail first, then add detail."], ["Learn UV unwrapping and basic texturing.", "Learn basic lighting and rendering."], ["Model a full scene with several objects.", "Study professional models to see how they're built."], ["Learn sculpting or procedural techniques.", "Optimize models for their purpose, like games or film."], ["Build a portfolio of finished pieces.", "Teach a beginner the basics of the viewport."]], "video-editing": [["Organize footage into folders or bins before you start cutting.", "Learn the keyboard shortcuts for cut, trim and playback."], ["Cut out anything that doesn't serve the story.", "Good audio matters as much as good video."], ["Learn J and L cuts, where audio leads or trails the picture.", "Cut on action to make transitions feel smooth."], ["Color correct for consistency before adding a creative grade.", "Learn basic audio mixing and leveling."], ["Edit a short film or video with a clear structure.", "Study editing in films you admire."], ["Learn motion graphics or advanced effects.", "Develop a recognizable editing style."], ["Edit a longer project from start to finish.", "Teach someone to organize and cut footage."]], "electronics": [["Start with low-voltage, battery-powered projects. Leave mains wiring to qualified people.", "Learn Ohm's law: voltage equals current times resistance."], ["Always use a current-limiting resistor with an LED.", "Build circuits on a breadboard before soldering."], ["Learn to use a multimeter to measure voltage, current and resistance.", "Learn to solder in a ventilated area, and wash your hands afterward."], ["Learn to read schematics.", "Try a microcontroller board like Arduino for simple projects."], ["Design and build a small project from your own schematic.", "Learn to read component datasheets."], ["Design a printed circuit board for a project.", "Learn basic debugging with an oscilloscope."], ["Build a complex project combining hardware and code.", "Teach someone to solder safely."]], "trade": [["Learn the safety gear and rules for every tool before anything else.", "Keep your workspace clean and well lit.", "Read the manual for each tool you use."], ["Measure twice, cut once. Slow, accurate work beats fast rework.", "Learn the names and uses of the basic hand tools.", "Practice on scrap material before your real project."], ["Finish a small project start to finish, even if it's simple.", "Learn how to keep your tools clean and sharp.", "Ask experienced people to look at your work."], ["Take a class or find a mentor in your trade.", "Learn the relevant codes or standards for your work.", "Keep a notebook of techniques and measurements."], ["Take on a project with a real deadline or a real customer.", "Learn to estimate time and materials before starting.", "Study common failure points and how to avoid them."], ["Keep a log of mistakes and fixes. It becomes your best reference.", "Learn when a job needs a licensed professional.", "Refine your work for both function and finish."], ["Mentor an apprentice. Teaching keeps your standards sharp.", "Consider formal certification if it fits your goals.", "Take on a showcase project that uses all your skills."]], "woodworking": [["Wear eye and hearing protection, and keep fingers away from blades.", "Learn to read wood grain direction before cutting or planing."], ["Measure from the same reference edge each time to avoid adding up errors.", "Keep chisels and plane blades sharp. Dull tools need more force and slip."], ["Use push sticks on the table saw and never reach over a moving blade.", "Learn a few basic joints, like butt, dado and rabbet."], ["Check for square at every step of assembly.", "Learn about wood movement: boards expand and shrink with humidity."], ["Learn traditional joinery like mortise-and-tenon and dovetails.", "Wear a dust mask or use dust collection. Fine wood dust is harmful to breathe."], ["Experiment with finishes and test them on scrap first.", "Design your own furniture with sketches and a cut list."], ["Build a heirloom piece that uses your best joinery.", "Teach a beginner to use hand tools safely."]], "welding": [["Learn in a class with proper supervision before welding on your own.", "Always wear a welding helmet, gloves, and flame-resistant clothing. Arc light can burn your eyes and skin."], ["Weld in a well-ventilated area. Welding fumes are harmful to breathe.", "Clean metal thoroughly before welding. Rust and paint cause weak, dirty welds."], ["Practice running straight, consistent beads on flat scrap metal.", "Keep a fire extinguisher nearby and clear flammables from your area."], ["Learn the differences between MIG, TIG and stick welding.", "Practice different joint types, like butt, lap and T-joints."], ["Practice welding in different positions, like horizontal and vertical.", "Learn to read welding symbols on drawings."], ["Cut and inspect test welds to check penetration.", "Learn to weld different metals, like aluminum and stainless."], ["Consider a recognized welding certification if you want to weld professionally.", "Build a project that requires precise fitting and welding."]], "electrical": [["Many places require permits or a licensed electrician for wiring work. Check your local rules first.", "Learn the basics of how circuits work before touching any wiring."], ["Always turn off power at the breaker before working, then confirm it's off with a voltage tester.", "Never assume a circuit is dead just because a switch is off."], ["Learn to safely replace a light switch or outlet with power off and verified.", "Use the correct wire gauge for the circuit."], ["Learn to read basic wiring diagrams.", "Understand what GFCI and AFCI protection do and where they're required."], ["Learn your local electrical code basics.", "Practice clean, secure connections and proper box fill."], ["Know when to call a licensed electrician, especially for panels or service upgrades.", "Learn to troubleshoot circuits with a multimeter."], ["Consider formal training if you want to work in the trade.", "Teach others the basics of electrical safety."]], "plumbing": [["Find your home's main water shutoff before you need it.", "Turn off the water supply before working on any fixture."], ["Wrap thread tape in the same direction the fitting tightens.", "Don't overtighten plastic fittings. They can crack."], ["Learn to fix a running toilet by replacing the flapper or fill valve.", "Learn to clear a clog with a plunger or drain snake before reaching for chemicals."], ["Learn basic pipe types like copper, PEX and PVC.", "Check for leaks after every repair."], ["Learn to replace a faucet or shower valve cartridge.", "Understand how drain venting works."], ["Learn local plumbing codes for your area.", "Know when to call a licensed plumber, especially for gas lines or main sewer work."], ["Take on a full fixture install from start to finish.", "Teach someone where their shutoff valves are."]], "auto-repair": [["Never work under a car supported only by a jack. Use jack stands on solid ground.", "Learn to check oil, coolant and tire pressure."], ["Chock the wheels before lifting a car.", "When disconnecting a battery, remove the negative terminal first and reconnect it last."], ["Learn to change your oil and filter.", "Tighten lug nuts in a star pattern to the torque in your manual."], ["Learn to replace brake pads with a repair manual for your vehicle.", "Use an OBD-II scanner to read engine fault codes on most modern cars."], ["Learn to diagnose common noises and leaks.", "Keep a maintenance log for your vehicle."], ["Work on more advanced repairs like suspension parts with proper tools.", "Know when a job needs a professional shop or specialized equipment."], ["Take on a restoration or major repair project.", "Teach someone basic car care."]], "sewing": [["Practice sewing straight lines on paper with an unthreaded machine.", "Learn to thread your machine and wind a bobbin."], ["Pre-wash fabric to pre-shrink it before cutting.", "Press seams with an iron as you go for a cleaner finish."], ["Learn to read a pattern and match its seam allowance.", "Change machine needles regularly. Dull needles cause skipped stitches."], ["Learn to sew zippers and buttonholes.", "Make a simple garment like a skirt or tote bag."], ["Learn to adjust patterns for fit.", "Try working with tricky fabrics like knits or silk."], ["Draft a simple pattern from your own measurements.", "Learn finishing techniques like French seams."], ["Design and sew a garment from scratch.", "Teach someone to use a sewing machine."]]}, "extras": {"japanese": [["Learn hiragana first, then katakana, before starting kanji."], ["Learn kanji gradually with their common words, not in isolation."], ["Pay attention to politeness levels: the same idea changes form depending on who you're speaking to."], ["Notice pitch accent in words. It can distinguish words that otherwise sound alike."]], "mandarin": [["Learn the four tones plus the neutral tone early. Tones change word meaning."], ["Learn pinyin well so you can look up and pronounce new words."], ["Learn measure words with nouns, since each noun takes a specific one."], ["Practice characters by their components. Many share common parts that hint at meaning or sound."]], "korean": [["Learn Hangul first. Its letters were designed to be learned quickly."], ["Learn how syllable blocks are built from individual letters."], ["Learn speech levels: endings change based on formality."], ["Learn common sound changes between words so spoken Korean is easier to follow."]], "spanish": [["Learn the difference between ser and estar early. Both mean 'to be' but are used differently."]], "french": [["Learn which final letters are usually silent. It makes reading aloud much easier."]], "german": [["Learn every noun with its article (der, die, das), since gender affects the rest of the sentence."]], "italian": [["Practice double consonants. Holding them a bit longer can change a word's meaning."]], "portuguese": [["Decide early whether you're learning Brazilian or European Portuguese. Pronunciation differs a lot."]]}};
  const TIPS = Object.assign({}, TIP_DATA.sets);

  const TIP_ALIASES = { "everyday-cooking": "cooking" };

  const VET_TIERS = [{ h: 1, name: "Bronze" }, { h: 50, name: "Silver" }, { h: 250, name: "Gold" }, { h: 1000, name: "Platinum" }, { h: 5000, name: "Diamond" }];
  function vetBadge(min, long) {

  function progress(m) {

    if (m >= LEGEND_MIN) return { L, have: 1, need: 1, pct: 1, next: "Legend" };

  function fmt(min) {
