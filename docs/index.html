<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Level up real-life skills. Practice fills your XP bars, earns dungeon keys and powers your hero.">
<meta name="theme-color" content="#151a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Level UP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Level UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: game HUD. Left = character sheet (sticky on desktop), right = skill tracks + session log. Stacks on phones. */
:root {
  --bg: #e9edf5;
  --panel: #ffffff;
  --panel-2: #dfe5f0;
  --ink: #151a2c;
  --muted: #586180;
  --line: #c9d1e1;
  --xp: #9a6604;
  --xp-fill: #e2a521;
  --xp-hi: #f5cc62;
  --rest: #2a66d9;
  --good: #1b7f53;
  --danger: #bf3b28;
  --shadow: 0 1px 0 rgba(21,26,44,.06), 0 6px 18px -10px rgba(21,26,44,.25);
  --f-display: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f111b; --panel: #171a28; --panel-2: #212539; --ink: #e8ebf6; --muted: #8f97b8; --line: #2b3050;
    --xp: #f2c14e; --xp-fill: #e3a72c; --xp-hi: #ffd977; --rest: #73a6ff; --good: #4fc58d; --danger: #f17a66;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f111b; --panel: #171a28; --panel-2: #212539; --ink: #e8ebf6; --muted: #8f97b8; --line: #2b3050;
  --xp: #f2c14e; --xp-fill: #e3a72c; --xp-hi: #ffd977; --rest: #73a6ff; --good: #4fc58d; --danger: #f17a66;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding: 0 16px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 18px 48px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rest); outline-offset: 2px; }
.px { font-family: var(--f-display); letter-spacing: .01em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 28px; font-weight: 700; }
.brand h1 b { color: var(--xp); font-weight: 700; }
.brand span { color: var(--muted); font-size: 13px; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); white-space: nowrap; }
.pill.warn { color: var(--danger); border-color: var(--danger); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border: 1px dashed var(--rest); color: var(--ink); border-radius: 8px; margin-bottom: 16px; font-size: 14px; background: var(--panel); }

/* buttons */
.btn { border: 2px solid var(--ink); background: var(--panel); padding: 8px 14px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--xp-fill); color: #1b1404; border-color: var(--xp-fill); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.btn.primary:hover { background: var(--xp-hi); }
.btn.ghost { border-color: var(--line); }
.btn.small { padding: 4px 10px; font-size: 13px; border-width: 1px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--rest); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* layout */
.grid { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.sheet { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); padding: 18px; display: grid; gap: 16px; }
@media (max-width: 820px) { .sheet { position: static; } }

/* character sheet */
.who { display: flex; gap: 14px; align-items: center; }
.emblem { width: 76px; height: 76px; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-size: 40px; font-weight: 700; color: #1b1404; background: linear-gradient(160deg, var(--xp-hi), var(--xp-fill)); clip-path: polygon(0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)); }
.who-text { min-width: 0; }
.hero-name { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.class-title { font-family: var(--f-display); color: var(--xp); font-size: 18px; }
.paths { font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-weight: 700; }
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.meter-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 4px; }
.meter-label strong { font-weight: 600; }
.rest-bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.rest-bar i { display: block; height: 100%; background: var(--rest); border-radius: 4px; }
.pips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; padding-left: 2px; }
.pips i { width: 9px; height: 9px; border: 1.5px solid var(--xp); transform: rotate(45deg); border-radius: 1px; }
.pips i.on { background: var(--xp-fill); border-color: var(--xp-fill); }
.keys-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.keys-count { font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--xp); }

/* training scene */
.train { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 18px; margin-bottom: 20px; border: 2px solid var(--xp-fill); align-items: center; }
@media (max-width: 640px) { .train { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; height: 200px; border-radius: 10px; overflow: hidden; display: grid; place-items: end center; background: radial-gradient(circle at 50% 85%, color-mix(in srgb, var(--xp-fill) 28%, var(--panel-2)), var(--panel-2) 70%); }
.chibi { width: 160px; height: 172px; display: block; margin-bottom: 4px; }
.chibi .ol { stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.chibi .hero { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 1.2s ease-in-out infinite; }
.chibi.run .hero { animation-duration: .42s; }
.chibi.float .hero { animation: float 3s ease-in-out infinite; }
.chibi .legA, .chibi .legB { transform-box: fill-box; transform-origin: 50% 0; }
.chibi.run .legA { animation: legs .42s ease-in-out infinite; }
.chibi.run .legB { animation: legs .42s ease-in-out infinite reverse; }
.chibi .eye { transform-box: fill-box; transform-origin: center; animation: eyeblink 4s infinite; }
.chibi .strum { animation: strum .5s ease-in-out infinite; }
.chibi .swing { transform-box: fill-box; transform-origin: 15% 90%; animation: swing .7s ease-in-out infinite; }
.chibi .sweep { transform-box: fill-box; transform-origin: 30% 5%; animation: sweep .9s ease-in-out infinite; }
.chibi .flip { transform-box: fill-box; transform-origin: 0 50%; animation: flip 2.6s ease-in-out infinite; }
.chibi .glow { animation: glow .8s steps(2) infinite; }
.chibi .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
.chibi .tap { animation: strum .3s ease-in-out infinite; }
.chibi .tap2 { animation: strum .3s ease-in-out infinite reverse; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes legs { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
@keyframes eyeblink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes strum { 50% { transform: translateY(6px); } }
@keyframes swing { 0%, 100% { transform: rotate(-35deg); } 50% { transform: rotate(20deg); } }
@keyframes sweep { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
@keyframes flip { 0%, 60% { transform: scaleX(1); } 80%, 100% { transform: scaleX(-1); } }
@keyframes glow { 50% { opacity: .45; } }
@keyframes pulse { 0%, 100% { transform: scale(.9); opacity: .35; } 50% { transform: scale(1.08); opacity: .7; } }
.sparks { position: absolute; inset: 0; pointer-events: none; }
.sparks i { position: absolute; bottom: 8px; width: 6px; height: 6px; background: var(--xp-fill); opacity: 0; animation: rise 2.6s linear infinite; }
@keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-160px); opacity: 0; } }
.stage .ring { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border: 4px solid var(--xp-hi); border-radius: 50%; opacity: 0; pointer-events: none; }
.stage .lvpop { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: var(--xp); opacity: 0; }
.stage.burst .ring { animation: ring 1.1s ease-out; }
.stage.burst .lvpop { animation: pop 1.8s ease-out; }
@keyframes ring { 0% { opacity: 1; transform: scale(.5); } 100% { opacity: 0; transform: scale(6); } }
@keyframes pop { 0% { opacity: 0; transform: translateY(10px); } 20%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
.train-info { display: grid; gap: 12px; min-width: 0; }
.train-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.train-head h2 { font-family: var(--f-display); font-size: 20px; }
.train-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.live-xp { font-family: var(--f-display); font-size: 22px; color: var(--xp); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .chibi *, .sparks i, .stage.burst .ring, .stage.burst .lvpop { animation: none !important; } .stage.burst .lvpop { opacity: 1; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tag { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.tag.lesson { color: var(--good); border: 1px solid var(--good); }
.tag.rest { color: var(--rest); border: 1px solid var(--rest); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

/* timer card */
.timer { border: 2px solid var(--xp-fill); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: color-mix(in srgb, var(--xp-fill) 10%, var(--panel)); }
.timer-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.timer-clock { font-family: var(--f-display); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 6px; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* skills */
.col { display: grid; gap: 20px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.section-head h2 { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.skills { display: grid; gap: 10px; }
.skill { padding: 14px 16px; }
.skill-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.skill-main { min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 6px; }
.skill-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.skill-title h3 { font-size: 17px; font-weight: 700; }
.lv { font-family: var(--f-display); font-size: 17px; color: var(--xp); font-weight: 700; }
.tier { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.badge.vet { border-color: var(--rest); color: var(--rest); }
.badge.star { border-color: var(--xp); color: var(--xp); }
.xp { position: relative; height: 16px; background: var(--panel-2); border: 2px solid var(--ink); border-radius: 3px; overflow: hidden; }
.xp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, var(--xp-hi), var(--xp-fill) 60%, var(--xp)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.xp::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), color-mix(in srgb, var(--ink) 35%, transparent) calc(10% - 2px) 10%); pointer-events: none; }
.xp-text { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.play { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--ink); background: var(--panel); display: grid; place-items: center; }
.play:hover:not(:disabled) { background: var(--xp-fill); border-color: var(--xp-fill); color: #1b1404; }
.play svg { width: 20px; height: 20px; }
.play.on { background: var(--danger); border-color: var(--danger); color: #fff; }
.play:disabled { opacity: .35; cursor: not-allowed; }

.detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.quick span { font-size: 13px; color: var(--muted); margin-right: 4px; }
.facts { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
.facts b { font-weight: 700; }
.tip { border-left: 3px solid var(--xp-fill); padding: 6px 0 6px 12px; }
.tip.old { border-left-color: var(--line); }
.tip small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.tip p { margin: 2px 0 0; max-width: 62ch; }
.lock { font-size: 13px; color: var(--muted); }
.ms { display: flex; gap: 6px; flex-wrap: wrap; }
.ms span { font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px dashed var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.ms span.got { border: 1px solid var(--xp); color: var(--xp); font-weight: 700; }
.detail-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }

/* sessions */
.log { padding: 6px 16px; }
.log-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log-row:last-child { border-bottom: 0; }
.log-row .when { color: var(--muted); font-size: 13px; }
.log-row .what { min-width: 0; overflow-wrap: anywhere; }
.log-row .what em { color: var(--muted); font-style: normal; font-size: 13px; }
.log-row .gold { color: var(--xp); font-size: 13px; font-weight: 600; white-space: nowrap; }
.x { border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 4px; font-size: 13px; }
.x:hover { color: var(--danger); background: var(--panel-2); }
@media (max-width: 520px) { .log-row { grid-template-columns: minmax(0, 1fr) auto auto; } .log-row .when { grid-column: 1 / -1; padding-bottom: 0; margin-bottom: -6px; } }
.empty-log { padding: 16px 0; color: var(--muted); font-size: 14px; }

.rules { padding: 16px 18px; font-size: 14px; }
.rules h2 { font-family: var(--f-display); font-size: 18px; margin-bottom: 8px; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.rules table { border-collapse: collapse; margin: 6px 0 12px; font-size: 13px; }
.rules td, .rules th { padding: 3px 14px 3px 0; text-align: left; font-variant-numeric: tabular-nums; }
.rules th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }

/* onboarding */
.onboard { max-width: 680px; margin: 0 auto; padding: 24px; display: grid; gap: 22px; }
.onboard h2 { font-family: var(--f-display); font-size: 30px; }
.onboard p { margin: 0; max-width: 60ch; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.input { border: 2px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel); width: 100%; min-width: 0; }
.input:focus { border-color: var(--rest); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.picked { display: grid; gap: 8px; }
.picked-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; align-items: center; }
.picked-row span { font-weight: 600; overflow-wrap: anywhere; }
.custom-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px auto; gap: 8px; }
@media (max-width: 520px) { .custom-row { grid-template-columns: minmax(0, 1fr); } .picked-row { grid-template-columns: minmax(0, 1fr) 120px; } }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* dialog */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cat { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.cat b { font-size: 14px; }
.cat small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat:hover { border-color: var(--muted); }
.cat[aria-pressed="true"] { border-color: var(--xp-fill); background: color-mix(in srgb, var(--xp-fill) 12%, var(--panel)); }
.cat .count { color: var(--xp); font-weight: 700; font-size: 12px; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.custom-row.two { grid-template-columns: minmax(0, 1fr) auto; }
.group { display: grid; gap: 10px; }
.group-head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 6px; }
.group:first-child .group-head { margin-top: 0; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(10, 12, 22, .55); }
.dlg { padding: 20px; display: grid; gap: 16px; }
.dlg h2 { font-family: var(--f-display); font-size: 22px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; }
.err { color: var(--danger); font-size: 13px; min-height: 1em; }

/* home-screen widget preview */
.wall { border-radius: 14px; padding: 18px; display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--rest) 55%, var(--panel-2)), color-mix(in srgb, var(--xp-fill) 35%, var(--panel-2))); }
.wdg { background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px); border-radius: 22px; padding: 14px; box-shadow: 0 8px 22px -12px rgba(0,0,0,.45); display: grid; gap: 10px; color: var(--ink); }

  // One tip per tier: Novice, Apprentice, Journeyman, Adept, Expert, Master, Grandmaster
